<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profil Saya – Langkatalk</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/feed.css">
  <style>
    .lk-profil{max-width:720px;margin:18px auto;padding:0 14px}
    .lk-kartu{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(95,63,200,.10);margin-bottom:14px}
    .lk-profil-atas{display:flex;gap:16px;align-items:center}
    .lk-foto-besar{width:84px;height:84px;border-radius:999px;overflow:hidden;flex-shrink:0;border:3px solid #fff;box-shadow:0 6px 18px rgba(124,58,237,.25);background:linear-gradient(135deg,#7c3aed,#2563eb,#06b6d4,#f59e0b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
    .lk-foto-besar img{width:100%;height:100%;object-fit:cover;display:block}
    .lk-avatar{width:36px;height:36px;border-radius:999px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 4px 14px rgba(124,58,237,.25);flex-shrink:0;background:linear-gradient(135deg,#7c3aed,#2563eb,#06b6d4,#f59e0b);color:#fff;font-weight:800;font-size:16px;text-decoration:none}
    .lk-avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .lk-avatar-kosong{background:#E9E4FF;border-color:#E9E4FF}
    #headerAkun{display:inline-flex;align-items:center;gap:8px;flex-shrink:0}
    .lk-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:14px}
    .lk-nama{font-family:Sora,sans-serif;font-size:22px;font-weight:800;margin:0}
    .lk-username{color:#6b7280;margin:2px 0 6px}
    .lk-chip{display:inline-block;background:#E9E4FF;color:#5b21b6;font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:999px}
    .lk-stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
    .lk-stat div{background:#F3F0FF;border-radius:14px;padding:12px;text-align:center}
    .lk-stat b{display:block;font-size:22px;line-height:1}
    .lk-stat span{font-size:12.5px;color:#6b7280}
    .lk-label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
    .lk-label small{font-weight:400;color:#6b7280}
    .lk-input{width:100%;height:44px;border:1.5px solid #e5e7eb;border-radius:12px;padding:0 12px;font:inherit;background:#fff;box-sizing:border-box}
    .lk-sandi-wrap{position:relative;display:flex;align-items:center}
    .lk-sandi-wrap .lk-input{padding-right:44px}
    .lk-mata{position:absolute;right:6px;width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:#4b5563;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .lk-mata:hover{background:#f3f4f6;color:#161133}
    .lk-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .lk-note{font-size:13px;color:#6b7280}
    .lk-berkas{border:1.5px dashed #c7d2fe;border-radius:12px;padding:12px;margin-top:8px}
    .lk-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#161133;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:9999;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .lk-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
  <header class="lk-header">
    <a class="lk-logo" href="index.html">
      <img src="favicon.png" alt="" width="28" height="28">
      <span><b>Langkatalk</b><small>Menghubungkan Cerita Langkat</small></span>
    </a>
    <span id="headerAkun"><span class="lk-avatar lk-avatar-kosong" aria-hidden="true"></span></span>
  </header>

  <main class="lk-profil">
    <div id="isiProfil"><p class="lk-note" style="text-align:center;padding:30px">Memuat profil…</p></div>
    <div style="text-align:center"><a href="index.html">← Kembali ke Beranda</a> &nbsp;•&nbsp; <a href="redaksi.html">Ruang Redaksi</a></div>
  </main>

  <div id="toast" class="lk-toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="js/supabase.js"></script>
  <script>
  (function(){
    var IKON_MATA_TUTUP = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    var IKON_MATA_BUKA = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';

    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function kabar(t){var e=document.getElementById('toast');if(!e)return;e.textContent=t;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2500)}
    function tglIndo(t){if(!t)return '-';try{return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}catch(e){return t}}
    var FOTO_SISI = 480;
    var FOTO_MAX_MB = 2;

    function muatGambar(url){
      return new Promise(function(resolve, reject){
        var img = new Image();
        img.onload = function(){ resolve(img); };
        img.onerror = function(){ reject(new Error('File gambar tidak bisa dibaca.')); };
        img.src = url;
      });
    }

    function keBlob(canvas, tipe, kualitas){
      return new Promise(function(resolve){ canvas.toBlob(resolve, tipe, kualitas); });
    }

    async function prosesFoto(file){
      var url = URL.createObjectURL(file);
      try{
        var img = await muatGambar(url);
        var sw = img.naturalWidth, sh = img.naturalHeight;
        var sisi = Math.min(sw, sh);
        var sx = (sw - sisi) / 2, sy = (sh - sisi) / 2;

        var canvas = document.createElement('canvas');
        canvas.width = FOTO_SISI;
        canvas.height = FOTO_SISI;
        canvas.getContext('2d').drawImage(img, sx, sy, sisi, sisi, 0, 0, FOTO_SISI, FOTO_SISI);

        var blob = await keBlob(canvas, 'image/webp', 0.85);
        var ext = 'webp';
        if(!blob || blob.type !== 'image/webp'){
          blob = await keBlob(canvas, 'image/jpeg', 0.85);
          ext = 'jpg';
        }
        if(!blob) throw new Error('Gagal memproses foto.');
        return { blob: blob, ext: ext };
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function unggahFotoProfil(sb, file, userId){
      if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
        throw new Error('Pilih gambar JPG, PNG, atau WebP.');
      }
      if(file.size > FOTO_MAX_MB * 1024 * 1024){
        throw new Error('Ukuran foto maksimal ' + FOTO_MAX_MB + ' MB.');
      }
      var hasil = await prosesFoto(file);
      var path = 'avatars/' + userId + '/' + Date.now() + '.' + hasil.ext;
      var up = await sb.storage.from('articles').upload(path, hasil.blob, {
        contentType: hasil.blob.type,
        cacheControl: '31536000',
        upsert: false
      });
      if(up.error) throw new Error('Unggah foto gagal: ' + up.error.message);
      return sb.storage.from('articles').getPublicUrl(path).data.publicUrl;
    }

    function kotakSandi(id, label, placeholder){
      return '<label class="lk-label" for="'+id+'">'+label+'</label>'+
        '<div class="lk-sandi-wrap">'+
          '<input class="lk-input" id="'+id+'" type="password" autocomplete="new-password" placeholder="'+placeholder+'">'+
          '<button type="button" class="lk-mata" data-mata="'+id+'" aria-label="Tampilkan kata sandi" aria-pressed="false">'+IKON_MATA_TUTUP+'</button>'+
        '</div>';
    }

    function pasangTombolMata(){
      document.querySelectorAll('[data-mata]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var inp=document.getElementById(btn.getAttribute('data-mata'));
          if(!inp)return;
          var tampil=inp.type==='password';
          inp.type=tampil?'text':'password';
          btn.innerHTML=tampil?IKON_MATA_BUKA:IKON_MATA_TUTUP;
          btn.setAttribute('aria-pressed',tampil?'true':'false');
          btn.setAttribute('aria-label',tampil?'Sembunyikan kata sandi':'Tampilkan kata sandi');
        });
      });
    }

    async function muat(){
      var sb=window.LK&&window.LK.sb; if(!sb)return;
      var sesi=await sb.auth.getSession();
      var user=sesi&&sesi.data&&sesi.data.session&&sesi.data.session.user;
      if(!user){location.href='redaksi.html';return;}

      var pr={};
      try{
        var ph=await sb.from('profiles').select('id,username,full_name,role,is_active,avatar_url,desk,email,created_at,status_akun').eq('id',user.id).maybeSingle();
        if(ph&&!ph.error&&ph.data){ pr=ph.data; }
      }catch(e){}
      if(pr&&pr.is_active===false){ await sb.auth.signOut(); location.href='redaksi.html'; return; }

      try{
        var box=document.getElementById('headerAkun');
        if(box){ box.innerHTML='<a class="btn btn-utama btn-kecil" href="redaksi.html">Ruang Redaksi</a><a class="lk-avatar" href="profil.html" title="Akun saya">'+(pr.avatar_url?'<img src="'+esc(pr.avatar_url)+'" alt="">':esc(((pr.full_name||pr.username||'?').trim().charAt(0)||'?').toUpperCase()))+'</a>'; }
      }catch(e){}

      var terbit=0, draf=0;
      try{
        var a=await sb.from('articles').select('id,status').eq('author_id',user.id).limit(1000);
        (a.data||[]).forEach(function(x){ if(x.status==='terbit') terbit++; else draf++; });
      }catch(e){}

      var gabung = pr.created_at || user.created_at;
      var hariAktif = gabung ? Math.max(1, Math.floor((Date.now()-new Date(gabung).getTime())/86400000)+1) : 1;

      var inisial=((pr.full_name||pr.username||'?').trim().charAt(0)||'?').toUpperCase();
      var foto=pr.avatar_url?'<img src="'+esc(pr.avatar_url)+'" alt="">':inisial;
      var roleMap={direktur:'Direktur',pemred:'Pemimpin Redaksi',redaktur:'Redaktur',editor:'Editor',reporter:'Reporter',kontributor:'Kontributor'};
      var jabatan=roleMap[pr.role]||pr.role||'Kontributor';

      document.getElementById('isiProfil').innerHTML=
        '<section class="lk-kartu"><div class="lk-profil-atas"><div class="lk-foto-besar">'+foto+'</div><div><p class="lk-nama">'+esc(pr.full_name||pr.username||'Tanpa Nama')+'</p><p class="lk-username">@'+esc(pr.username||'-')+'</p><span class="lk-chip">'+esc(jabatan)+'</span></div></div>'+
        '<div class="lk-stat"><div><b>'+terbit+'</b><span>Berita Terbit</span></div><div><b>'+draf+'</b><span>Draf / Proses</span></div><div><b>'+hariAktif+' hari</b><span>Aktif Sejak '+tglIndo(gabung)+'</span></div></div>'+
        '<div class="lk-bar"><a class="btn btn-utama btn-kecil" href="tulis.html">+ Tulis Berita</a><label class="btn btn-kecil" style="background:#fff;border:1.5px solid #e5e7eb;color:#161133;cursor:pointer">Ubah Foto Profil<input type="file" id="inputFotoProfil" accept="image/jpeg,image/png,image/webp" hidden></label></div></section>'+
        '<section class="lk-kartu"><h2 style="font-size:17px">Data Profil</h2>'+
        '<form id="formProfil"><label class="lk-label">Nama Lengkap</label><input class="lk-input" id="fNama" value="'+esc(pr.full_name||'')+'">'+
        '<label class="lk-label">Deskripsi Singkat</label><input class="lk-input" id="fDesk" placeholder="Peran atau deskripsi singkat" value="'+esc(pr.desk||'')+'">'+
        '<label class="lk-label">Email <small>(tidak bisa diubah di sini)</small></label><input class="lk-input" value="'+esc(user.email||'')+'" disabled>'+
        '<div class="lk-bar"><button type="submit" class="btn btn-utama btn-kecil">Simpan Profil</button></div></form></section>'+
        '<section class="lk-kartu"><h2 style="font-size:17px">Ubah Kata Sandi</h2><p class="lk-note">Minimal 8 karakter. Klik ikon mata bila ingin melihat kata sandi yang diketik.</p>'+
        '<form id="formSandi">'+
          kotakSandi('sBaru', 'Kata Sandi Baru', 'Minimal 8 karakter')+
          kotakSandi('sUlang', 'Ulangi Kata Sandi Baru', 'Ketik ulang kata sandi baru')+
          '<div class="lk-bar"><button type="submit" class="btn btn-utama btn-kecil" id="btnSimpanSandi">Perbarui Kata Sandi</button></div>'+
        '</form></section>'+
        '<section class="lk-kartu"><h2 style="font-size:17px">Berkas Karyawan</h2><p class="lk-note">Untuk KTP / SK / kontrak, kirim ke Direktur lewat WhatsApp redaksi dulu. Nanti link berkasnya ditampilkan di sini.</p><div class="lk-berkas">Belum ada berkas yang diunggah.</div></section>';

      pasangTombolMata();

      document.getElementById('formProfil').addEventListener('submit', async function(ev){
        document.getElementById('inputFotoProfil').addEventListener('change', async function(ev){
        var file = ev.target.files && ev.target.files[0];
        if(!file) return;
        try{
          kabar('Mengunggah foto…');
          var url = await unggahFotoProfil(sb, file, user.id);
          var r = await sb.rpc('perbarui_profil_sendiri', { p_full_name: null, p_username: null, p_avatar_url: url });
          if(r.error) throw new Error(r.error.message);

          pr.avatar_url = url;
          var fotoBesar = document.querySelector('.lk-foto-besar');
          if(fotoBesar) fotoBesar.innerHTML = '<img src="'+esc(url)+'" alt="">';
          var boxHeader = document.getElementById('headerAkun');
          if(boxHeader){
            boxHeader.innerHTML = '<a class="btn btn-utama btn-kecil" href="redaksi.html">Ruang Redaksi</a><a class="lk-avatar" href="profil.html" title="Akun saya"><img src="'+esc(url)+'" alt=""></a>';
          }
          kabar('Foto profil diperbarui');
        } catch(e){
          kabar('Gagal: ' + (e.message || e));
        } finally {
          ev.target.value = '';
        }
      });
        ev.preventDefault();
        var nama=document.getElementById('fNama').value.trim();
        var desk=document.getElementById('fDesk').value.trim()||null;
        if(nama.length<2){ kabar('Nama minimal 2 huruf'); return; }
        var r=await sb.from('profiles').update({full_name:nama,desk:desk}).eq('id',user.id);
        if(r.error){ kabar('Gagal simpan: '+r.error.message); } else { kabar('Profil tersimpan'); }
      });

      document.getElementById('formSandi').addEventListener('submit', async function(ev){
        ev.preventDefault();
        var baru=document.getElementById('sBaru').value;
        var ulang=document.getElementById('sUlang').value;
        if(baru.length<8){ kabar('Kata sandi minimal 8 karakter'); return; }
        if(baru!==ulang){ kabar('Ulangan kata sandi tidak sama'); return; }
        var btn=document.getElementById('btnSimpanSandi');
        btn.disabled=true;
        var r=await sb.auth.updateUser({password:baru});
        btn.disabled=false;
        if(r.error){ kabar('Gagal ubah sandi: '+r.error.message); return; }
        document.getElementById('sBaru').value='';
        document.getElementById('sUlang').value='';
        document.getElementById('sBaru').type='password';
        document.getElementById('sUlang').type='password';
        kabar('Kata sandi berhasil diperbarui');
      });
    }
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',muat)}else{muat()}
  })();
  </script>
</body>
</html>
