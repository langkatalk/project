<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Langkatalk – Menghubungkan Cerita Langkat</title>
  <meta name="description" content="Langkatalk: portal berita investigasi dan cerita Langkat. Bongkar Atraksi Ruang Gelap.">
  <meta property="og:title" content="Langkatalk – Menghubungkan Cerita Langkat">
  <meta property="og:description" content="Bongkar Atraksi Ruang Gelap. Portal berita investigasi dan cerita Langkat.">
  <meta property="og:image" content="logo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://langkatalk.vercel.app/">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script id="ld-json" type="application/ld+json">{}</script>
</head>
<body>
  <div id="root" class="page-enter">
  <header class="ph">
    <div class="wrap">
      <a class="logo-link" href="index.html">
        <img src="favicon.png" alt="Langkatalk" width="28" height="28">
        <span>
          <span class="lt-wordmark">Langkatalk</span>
          <span class="lt-tagline">Menghubungkan Cerita Langkat</span>
        </span>
      </a>
      <a class="go sm" href="redaksi.html">Masuk</a>
    </div>
  </header>
  <main class="wrap" style="margin-top:16px">
    <div class="glass-box">
      <h2>Langkatalk – Menghubungkan Cerita Langkat</h2>
      <p class="mt">Bongkar Atraksi Ruang Gelap. Memuat cerita...</p>
    </div>
  </main>
</div>

  <div class="dlg" id="dlg" role="dialog" aria-modal="true">
    <div class="box" id="box"></div>
  </div>

  <button type="button" class="fab-top hide" id="fab-top" aria-label="Kembali ke atas" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <div class="toast" id="ts" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let allPublished = [];
    let visibleCount = 10;
    let loadingMore = false;
    let currentDetailArticle = null;

    function parseIndexRoute() {
      const hash = location.hash || '#/';
      const m = hash.match(/^#\/baca\/(.+)$/);
      if (m) return { mode: 'detail', slug: decodeURIComponent(m[1]) };
      if (hash.startsWith('#/artikel-')) return { mode: 'detail', slug: decodeURIComponent(hash.replace('#/artikel-', '')) };
      return { mode: 'feed', slug: '' };
    }

    async function renderIndexRoute() {
      $('root').classList.remove('page-enter');
      void $('root').offsetWidth;
      $('root').classList.add('page-enter');

      const rt = parseIndexRoute();
      if (rt.mode === 'detail') return renderDetailPage(rt.slug);
      return renderFeedPage();
    }
    addEventListener('hashchange', renderIndexRoute);

    function skeletonFeed(n = 2) {
      return Array.from({ length: n }).map(() => `
        <div class="sk-card">
          <div class="sk-img"></div>
          <div class="sk-line" style="width:72%"></div>
          <div class="sk-line" style="width:45%"></div>
        </div>
      `).join('');
    }

    async function renderFeedPage() {
      updateSeoMeta({
        title: 'Langkatalk – Menghubungkan Cerita Langkat',
        description: 'Bongkar Atraksi Ruang Gelap. Portal berita investigasi dan cerita Langkat.',
        image: `${location.origin}/logo.png`,
        url: `${location.origin}/`
      });

      $('root').innerHTML = renderPublicShell(`<div class="wrap" style="margin-top:14px">${skeletonFeed(2)}</div>`);
      if (!ltReady) {
        $('root').innerHTML = renderPublicShell(`<div class="wrap"><div class="empty" style="margin-top:16px">Supabase belum tersambung. Cek <code>config.js</code>.</div></div>`);
        return;
      }

      await Promise.all([loadCurrentUser(), loadSiteExtras()]);
      allPublished = await fetchPublishedArticles(60);
      visibleCount = 10;
      paintFeedList();
    }

    function getFilteredFeed() {
      let list = [...allPublished];
      if (ltState.cat === '__saved') list = list.filter((a) => ltState.savedIds.has(a.id));
      else if (ltState.cat) list = list.filter((a) => a.category === ltState.cat);

      if (ltState.tag) {
        list = list.filter((a) => Array.isArray(a.tags) && a.tags.includes(ltState.tag));
      }
      if (ltState.q) {
        const q = ltState.q.toLowerCase();
        list = list.filter((a) =>
          (a.title || '').toLowerCase().includes(q) ||
          (a.description || '').toLowerCase().includes(q) ||
          (a.body || '').toLowerCase().includes(q)
        );
      }
      return list;
    }

    function paintFeedList() {
      const filtered = getFilteredFeed();
      const hasFilter = Boolean(ltState.cat || ltState.tag || ltState.q);
      const heroArt = (!hasFilter && filtered.length > 0) ? filtered[0] : null;
      const pool = heroArt ? filtered.slice(1) : filtered;
      const items = pool.slice(0, visibleCount);
      const hasMore = pool.length > visibleCount;

      const heroHtml = heroArt ? `
        <article class="hero" onclick="location.hash='#/baca/${encodeURIComponent(heroArt.slug || heroArt.id)}'">
          <div class="hero-bg">
            ${heroArt.cover_image
              ? `<img src="${esc(heroArt.cover_image)}" srcset="${esc(heroArt.cover_image)} 1200w" sizes="(max-width:767px) 100vw, 1000px" alt="${esc(heroArt.title)}" width="1200" height="600" decoding="async">`
              : ''}
          </div>
          <div class="hero-body">
            <div class="hero-subtag">Bongkar Atraksi Ruang Gelap</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${heroArt.is_exclusive ? '<span class="chip ex">EKSKLUSIF</span>' : ''}
              <span class="chip glass-dark">${esc(heroArt.category)}</span>
            </div>
            <h1>${esc(heroArt.title)}</h1>
            <p>${esc(heroArt.description || stripHtmlText(heroArt.body).slice(0, 140))}</p>
            <div class="hero-meta">
              <span><b>${esc(heroArt.author_name || 'Redaksi')}</b></span>
              <span>• ${fmtDate(heroArt.published_at)}</span>
              <span>• ${readMinutes(heroArt.body)} mnt baca</span>
            </div>
          </div>
        </article>
      ` : '';

      const cardsHtml = items.map((a, idx) => {
        const slugOrId = a.slug || a.id;
        const isLiked = ltState.likedIds.has(a.id);
        const isSaved = ltState.savedIds.has(a.id);
        const initial = (a.author_name || 'L').trim().charAt(0).toUpperCase();
        const excerpt = esc(a.description || stripHtmlText(a.body || '')).slice(0, 145);
      const thumbHtml = a.cover_url
        ? `<img class="card-thumb" src="${esc(a.cover_url)}" alt="${esc(a.title)}" loading="lazy">`
        : `<div class="card-thumb-empty">Langkatalk</div>`;
      const adBetween = (idx === 1 && ads.length)
        ? renderInlineAd(ads[0])
        : (idx === 4 && ads.length > 1 ? renderInlineAd(ads[1]) : '');

      return `
        <article class="lt-card" onclick="location.hash='#/berita/${encodeURIComponent(slugOrId)}'">
          <div class="card-top">
            <div class="card-author">
              <div class="avatar-sm">${esc(initial)}</div>
              <div>
                <div class="author-name">${esc(a.author_name || 'Redaksi')}</div>
                <div class="author-sub">${esc(a.category || 'Umum')} • ${fmtDate(a.published_at)}</div>
              </div>
            </div>
            <div class="card-actions-top" onclick="event.stopPropagation()">
              <button type="button" class="icon-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${esc(a.id)}', this)" title="Suka">♥</button>
              <button type="button" class="icon-btn ${isSaved ? 'active' : ''}" onclick="toggleSave('${esc(a.id)}', this)" title="Simpan">🔖</button>
            </div>
          </div>
          <div class="card-body-row">
            <div class="card-text">
              <h3 class="card-title">${esc(a.title)}</h3>
              <p class="card-excerpt">${excerpt}</p>
              <div class="card-meta">
                <span>${readMinutes(a.body)} mnt baca</span>
                <span>•</span>
                <span>${Number(a.views || 0)} dibaca</span>
              </div>
            </div>
            ${thumbHtml}
          </div>
        </article>
        ${adBetween}
      `;
    }).join('');

    const feedBody = items.length
      ? `<div class="feed-list">${cardsHtml}</div>`
      : `<div class="glass-box mt"><p>Belum ada cerita di kategori ini.</p></div>`;

    const innerHtml = `
      ${renderTopHeader()}
      ${renderCategoryBar()}
      <main class="wrap page-main">
        ${heroHtml}
        ${feedBody}
      </main>
    `;

    root.innerHTML = renderPublicShell(innerHtml);
  }

  async function renderDetailPage(slugOrId) {
    const root = $('root');
    if (!root) return;
    root.innerHTML = `
      ${renderTopHeader()}
      <main class="wrap page-main">
        <div class="glass-box"><p>Memuat cerita...</p></div>
      </main>
    `;

    let art = null;
    if (typeof fetchArticleDetail === 'function') {
      art = await fetchArticleDetail(slugOrId);
    }

    if (!art) {
      root.innerHTML = renderPublicShell(`
        ${renderTopHeader()}
        <main class="wrap page-main">
          <div class="glass-box">
            <h2>Cerita tidak ditemukan</h2>
            <p class="mt">Artikel mungkin sudah dipindahkan atau belum terbit.</p>
            <a class="go sm mt" href="index.html">Kembali ke Beranda</a>
          </div>
        </main>
      `);
      return;
    }

    const isLiked = ltState.likedIds.has(art.id);
    const isSaved = ltState.savedIds.has(art.id);
    const detailHtml = `
      ${renderTopHeader()}
      <main class="wrap page-main">
        <article class="glass-box detail-article">
          <div class="detail-meta-top">
            <span class="chip">${esc(art.category || 'Umum')}</span>
            <span>${fmtDate(art.published_at)}</span>
            <span>•</span>
            <span>${readMinutes(art.body)} mnt baca</span>
          </div>
          <h1 class="detail-title">${esc(art.title)}</h1>
          <div class="detail-author">Oleh <b>${esc(art.author_name || 'Redaksi')}</b></div>
          ${art.cover_url ? `<img class="detail-cover" src="${esc(art.cover_url)}" alt="${esc(art.title)}">` : ''}
          <div class="detail-body">${art.body || ''}</div>
          <div class="detail-bar">
            <button type="button" class="pill ${isLiked ? 'active' : ''}" onclick="toggleLike('${esc(art.id)}', this)">♥ Suka</button>
            <button type="button" class="pill ${isSaved ? 'active' : ''}" onclick="toggleSave('${esc(art.id)}', this)">🔖 Simpan</button>
            <button type="button" class="pill" onclick="shareCurrentArticle()">↗ Bagikan</button>
          </div>
        </article>
      </main>
    `;

    root.innerHTML = renderPublicShell(detailHtml);
  }
async function loadPublicFeedFromSupabase() {
    const cfg = window.APP_CONFIG || {};
    if (!window.supabase || !cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY) return;
    try {
      const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
      const { data, error } = await sb
        .from('articles')
        .select('*')
        .eq('status', 'terbit')
        .order('published_at', { ascending: false, nullsFirst: false })
        .order('created_at', { ascending: false });

      if (!error && Array.isArray(data)) {
        const activeCat = (typeof ltState !== 'undefined' && ltState.category) ? ltState.category : 'Semua';
        const filtered = activeCat === 'Semua'
          ? data
          : data.filter(item => (item.category || '').toLowerCase() === activeCat.toLowerCase());

        const root = document.getElementById('root');
        if (!root) return;

        const itemsHtml = filtered.length
          ? filtered.map(a => {
              const title = esc(a.title || '(Tanpa Judul)');
              const cat = esc(a.category || 'Umum');
              const author = esc(a.author_name || 'Redaksi');
              const rawText = (a.description || stripHtmlText(a.body || '') || '').slice(0, 145);
              const thumb = a.cover_url
                ? `<img class="card-thumb" src="${esc(a.cover_url)}" alt="${title}" loading="lazy">`
                : `<div class="card-thumb-empty">Langkatalk</div>`;
              return `
                <article class="lt-card" onclick="location.hash='#/berita/${encodeURIComponent(a.slug || a.id)}'">
                  <div class="card-top">
                    <div class="card-author">
                      <div class="avatar-sm">${esc(author.charAt(0).toUpperCase())}</div>
                      <div>
                        <div class="author-name">${author}</div>
                        <div class="author-sub">${cat} • ${fmtDate(a.published_at || a.created_at)}</div>
                      </div>
                    </div>
                  </div>
                  <div class="card-body-row">
                    <div class="card-text">
                      <h3 class="card-title">${title}</h3>
                      <p class="card-excerpt">${esc(rawText)}</p>
                      <div class="card-meta">
                        <span>${readMinutes(a.body)} mnt baca</span>
                        <span>•</span>
                        <span>${Number(a.views || 0)} dibaca</span>
                      </div>
                    </div>
                    ${thumb}
                  </div>
                </article>
              `;
            }).join('')
          : `<div class="glass-box mt"><p>Belum ada berita terbit di kategori <b>${esc(activeCat)}</b>.</p></div>`;

        const feedContainer = root.querySelector('.feed-list') || root.querySelector('main.wrap');
        if (feedContainer && feedContainer.classList && feedContainer.classList.contains('feed-list')) {
          feedContainer.innerHTML = itemsHtml;
        } else if (root.querySelector('main.wrap')) {
          root.querySelector('main.wrap').innerHTML = `<div class="feed-list">${itemsHtml}</div>`;
        }
      }
    } catch (_) {}
  }

  window.addEventListener('hashchange', () => {
    setTimeout(loadPublicFeedFromSupabase, 60);
  });
  renderIndexRoute();
    setTimeout(loadPublicFeedFromSupabase, 80);
</script>
</body>
</html>
