<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Langkatalk – Menghubungkan Cerita Langkat</title>
  <meta name="description" content="Portal berita investigasi, cerita lokal, dan jurnalisme sosial dari Langkat, Sumatera Utara.">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/feed.css">
  <style>
    .lk-sosmed {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .lk-sosmed[hidden] { display: none !important; }
    .lk-sosmed-ikon {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--lk-teks);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 12px rgba(95, 63, 200, 0.10);
      transition: transform 150ms ease;
    }
    .lk-sosmed-ikon:hover { transform: translateY(-2px); }
        .lk-avatar{
      width:36px;height:36px;border-radius:999px;overflow:hidden;
      display:inline-flex;align-items:center;justify-content:center;
      border:2px solid #fff;box-shadow:0 4px 14px rgba(124,58,237,.25);
      flex-shrink:0;background:linear-gradient(135deg,#7c3aed,#2563eb,#06b6d4,#f59e0b);
      color:#fff;font-weight:800;font-size:16px;text-decoration:none;
    }
    .lk-avatar img{width:100%;height:100%;object-fit:cover;display:block}
        .lk-avatar-kosong{ background:#E9E4FF; border-color:#E9E4FF; }
        #headerAkun{ display:inline-flex; align-items:center; gap:8px; flex-shrink:0; }
    .lk-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding-right:14px; }
  </style>
</head>
<body>

  <header class="lk-header">
    <a class="lk-logo" href="index.html">
      <img src="favicon.png" alt="" width="28" height="28">
      <span>
        <b>Langkatalk</b>
        <small>Menghubungkan Cerita Langkat</small>
      </span>
    </a>
    <span id="headerAkun"><span class="lk-avatar lk-avatar-kosong" aria-hidden="true"></span></span>
  </header>

  <nav class="lk-chips" id="chips" aria-label="Kategori berita"></nav>

  <main class="lk-feed" id="feed"></main>

  <div id="sentinel" class="lk-sentinel" aria-hidden="true"></div>
  <p id="status" class="lk-status" role="status"></p>

  <footer class="lk-footer">
    <nav class="lk-sosmed" id="sosmed" aria-label="Media sosial Langkatalk" hidden></nav>
    <div><b>Langkatalk</b> • Dari hulu ke hilir, dari bukit ke layar.</div>
    <div class="lk-footer-link">
      <a href="index.html">Beranda</a>
      <a href="tulis.html">Tulis</a>
      <a href="redaksi.html">Redaksi</a>
    </div>
  </footer>

  <div id="toast" class="lk-toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/feed.js"></script>

  <script>
  (function () {
    var PLATFORM = [
      {
        kunci: 'instagram', nama: 'Instagram',
        svg: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>'
      },
      {
        kunci: 'facebook', nama: 'Facebook',
        svg: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8h2.7l.4-3.2h-3.1V8.8c0-.9.3-1.5 1.6-1.5h1.6V4.4c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1v2.4H7.6V14h2.7v8z"/></svg>'
      },
      {
        kunci: 'youtube', nama: 'YouTube',
        svg: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/></svg>'
      },
      {
        kunci: 'tiktok', nama: 'TikTok',
        svg: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16.5 3c.3 2.4 1.7 3.9 4 4.1v3.2c-1.4.1-2.7-.3-4-1.1v6.3a5.5 5.5 0 1 1-5.5-5.5c.3 0 .6 0 .9.1v3.3a2.3 2.3 0 1 0 1.4 2.1V3z"/></svg>'
      }
    ];

    // Hanya link https yang dipakai, supaya tidak ada link aneh
    function bersihUrl(u) {
      if (typeof u !== 'string') return '';
      var t = u.trim();
      if (!/^https:\/\//i.test(t)) return '';
      return t.replace(/"/g, '%22').replace(/</g, '%3C').replace(/>/g, '%3E');
    }

    async function muatSosmed() {
      var sb = window.LK && window.LK.sb;
      var box = document.getElementById('sosmed');
      if (!sb || !box) return;
      try {
        var r = await sb.from('site_settings').select('value').eq('key', 'sosmed').maybeSingle();
        if (r.error || !r.data) return;

        var v = r.data.value;
        if (typeof v === 'string') {
          try { v = JSON.parse(v); } catch (e) { return; }
        }
        if (!v || typeof v !== 'object') return;

        var html = PLATFORM.map(function (p) {
          var url = bersihUrl(v[p.kunci]);
          if (!url) return '';
          return '<a class="lk-sosmed-ikon" href="' + url + '" target="_blank" rel="noopener nofollow"' +
            ' aria-label="' + p.nama + '" title="' + p.nama + '">' + p.svg + '</a>';
        }).join('');

        if (!html) return;
        box.innerHTML = html;
        box.hidden = false;
      } catch (e) {
        // Diam saja: ikon tidak tampil, halaman tetap jalan
      }
    }

    muatSosmed();
  })();
  </script>
    <script>
  (function () {
    async function gantiHeaderAkun() {
      var box = document.getElementById('headerAkun');
      if (!box) return;
      var sb = window.LK && window.LK.sb;
      if (!sb) return;
      try {
        var sesi = await sb.auth.getSession();
        var user = sesi && sesi.data && sesi.data.session && sesi.data.session.user;
                if (!user) { box.innerHTML = '<a class="btn btn-utama btn-kecil" href="redaksi.html">Masuk</a>'; return; }
        var p = await sb.from('profiles').select('username,full_name,avatar_url').eq('id', user.id).maybeSingle();
        var profil = (p && p.data) || {};
        var inisial = ((profil.full_name || profil.username || '?').trim().charAt(0) || '?').toUpperCase();
        var foto = profil.avatar_url ? '<img src="' + profil.avatar_url + '" alt="">' : inisial;
              box.innerHTML = '<a class="btn btn-utama btn-kecil" href="redaksi.html">Ruang Redaksi</a><a class="lk-avatar" href="profil.html" title="Akun saya">' + foto + '</a>';
      } catch (e) {}
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function(){ setTimeout(gantiHeaderAkun, 300); });
    } else {
            setTimeout(gantiHeaderAkun, 0);
    }
  })();
  </script>
</body>
</html>
