<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Langkatalk – Menghubungkan Cerita Langkat</title>
  <meta name="description" content="Langkatalk: portal berita investigasi dan cerita Langkat. Bongkar Atraksi Ruang Gelap.">
  <meta property="og:title" content="Langkatalk – Menghubungkan Cerita Langkat">
  <meta property="og:description" content="Bongkar Atraksi Ruang Gelap. Portal berita investigasi dan cerita Langkat.">
  <meta property="og:image" content="logo.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://langkatalk.vercel.app/">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script id="ld-json" type="application/ld+json">{}</script>
  <style>
    :root {
      --violet: #7C3FE0;
      --indigo: #5F6FEE;
      --blue: #2B7BEA;
      --cyan: #1CC8C8;
      --orange: #FF9A55;
      --ink: #1B1640;
      --mute: #6B6890;
      --bg: #F6F4FF;
      --line: #E4E0F5;
      --err: #D6336C;
      --ok: #12926E;
      --glass: rgba(255, 255, 255, 0.68);
      --glass-border: rgba(255, 255, 255, 0.78);
      --glass-shadow: 0 20px 40px rgba(95, 63, 200, 0.14);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font: 15px/1.6 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 6%, rgba(124, 63, 224, 0.14), transparent 34%),
        radial-gradient(circle at 92% 10%, rgba(28, 200, 200, 0.14), transparent 34%),
        radial-gradient(circle at 82% 55%, rgba(255, 154, 85, 0.11), transparent 36%),
        radial-gradient(circle at 14% 78%, rgba(43, 123, 234, 0.11), transparent 36%),
        var(--bg);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    :focus-visible { outline: 3px solid rgba(95, 111, 238, 0.55); outline-offset: 2px; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    h1, h2, h3, h4 { margin: 0; letter-spacing: -0.015em; }

    .go {
      height: 44px;
      border: 0;
      border-radius: 13px;
      padding: 0 18px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(100deg, var(--violet), var(--blue) 70%, var(--cyan));
      box-shadow: 0 10px 22px rgba(95, 63, 200, 0.25);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .go:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(95, 63, 200, 0.32); }
    .go:disabled { opacity: 0.6; cursor: wait; }
    .sm { height: 36px; padding: 0 14px; font-size: 13.5px; border-radius: 11px; box-shadow: none; }

    .gh {
      height: 36px;
      border: 1.5px solid var(--line);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 11px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .gh:hover { border-color: var(--indigo); background: #fff; }
    .rd { background: var(--err) !important; color: #fff; box-shadow: none; }

    input[type=text], input[type=email], input[type=password], input[type=tel], input[type=url], input[type=datetime-local], select, textarea {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 0 13px;
      height: 44px;
      font: inherit;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.92);
    }
    textarea { height: auto; padding: 11px 13px; resize: vertical; min-height: 100px; }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--indigo);
      box-shadow: 0 0 0 4px rgba(95, 111, 238, 0.16);
    }

    label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
    .f { margin-bottom: 14px; }
    .err { color: var(--err); font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
    .ok-msg { color: var(--ok); font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
    .hide { display: none !important; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      font-weight: 700;
      background: rgba(124, 63, 224, 0.12);
      color: var(--violet);
      white-space: nowrap;
    }
    .chip.ex { background: #FFE4EC; color: var(--err); }
    .chip.ok { background: #DDF6EE; color: var(--ok); }
    .chip.wr { background: #FFF0DF; color: #B25E12; }
    .chip.bl { background: #E1EEFF; color: var(--blue); }
    .chip.glass-dark { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); color: #fff; border: 1px solid rgba(255, 255, 255, 0.35); }

    .mt { font-size: 12.5px; color: var(--mute); }
    .empty {
      padding: 28px 20px;
      text-align: center;
      color: var(--mute);
      border: 1.5px dashed var(--line);
      border-radius: 20px;
      background: var(--glass);
      backdrop-filter: blur(16px);
    }

    /* ---------- HEADER & TICKER ---------- */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .ph {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-border);
      padding-top: env(safe-area-inset-top, 0px);
    }
    .ph .wrap { display: flex; align-items: center; gap: 14px; height: 68px; }
    .ph .logo-link { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .ph img { height: 42px; display: block; }
    .hamb {
      display: none;
      width: 38px;
      height: 38px;
      border: 1.5px solid var(--line);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.85);
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .cats { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; margin: 0 auto; }
    .cats::-webkit-scrollbar { display: none; }
    .cats button {
      border: 0;
      background: none;
      padding: 6px 11px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13.5px;
      color: var(--mute);
      white-space: nowrap;
      transition: 0.2s;
    }
    .cats button:hover { background: rgba(124, 63, 224, 0.08); color: var(--ink); }
    .cats button.on { background: rgba(124, 63, 224, 0.14); color: var(--violet); font-weight: 700; }

    .srch-box { position: relative; width: 190px; flex-shrink: 0; }
    .srch-box input { height: 36px; border-radius: 999px; padding: 0 14px 0 32px; font-size: 13px; background: rgba(255, 255, 255, 0.88); }
    .srch-box span { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--mute); pointer-events: none; }

    /* Drawer Mobile */
    .drawer-bg { position: fixed; inset: 0; background: rgba(27, 22, 64, 0.45); backdrop-filter: blur(4px); z-index: 40; display: none; }
    .drawer-bg.on { display: block; }
    .drawer {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 270px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      padding: 20px 16px;
      z-index: 45;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer.on { transform: translateX(0); }
    .drawer button, .drawer a {
      text-align: left;
      padding: 10px 12px;
      border-radius: 12px;
      border: 0;
      background: none;
      font-weight: 600;
      color: var(--ink);
    }
    .drawer button.on { background: rgba(124, 63, 224, 0.14); color: var(--violet); }

    /* Ticker Breaking News (hanya muncul jika ada berita breaking/eksklusif) */
    .ticker {
      background: linear-gradient(90deg, #C91E4A, #E0315A);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    .ticker .wrap { display: flex; align-items: center; gap: 12px; height: 36px; }
    .ticker-tag { background: #fff; color: #C91E4A; font-weight: 800; font-size: 11px; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.04em; flex-shrink: 0; }
    .ticker-track { overflow: hidden; white-space: nowrap; flex: 1; }
    .ticker-move { display: inline-block; padding-left: 100%; animation: marquee 26s linear infinite; }
    .ticker-move:hover { animation-play-state: paused; }
    @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    /* ---------- HERO / HEADLINE BESAR (2:1) ---------- */
    .hero {
      position: relative;
      margin: 24px 0 22px;
      border-radius: 24px;
      overflow: hidden;
      aspect-ratio: 2 / 1;
      min-height: 320px;
      max-height: 540px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      transition: transform 300ms ease, box-shadow 300ms ease, border-color 300ms ease;
    }
    .hero:hover {
      transform: translateY(-4px);
      box-shadow: 0 26px 54px rgba(95, 63, 200, 0.24);
      border-color: var(--indigo);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 86% 14%, rgba(255, 154, 85, 0.55), transparent 32%),
        linear-gradient(145deg, #2A1470, #5B2FD0 40%, #2B7BEA 80%, #1CC8C8);
      transition: transform 400ms ease;
    }
    .hero-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero:hover .hero-bg { transform: scale(1.05); }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(18, 12, 48, 0.92) 8%, rgba(27, 22, 64, 0.45) 55%, rgba(27, 22, 64, 0.12) 100%);
    }
    .hero-body {
      position: relative;
      z-index: 2;
      padding: 32px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hero-subtag { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--orange); }
    .hero h1 { font-size: clamp(24px, 3.8vw, 40px); line-height: 1.15; font-weight: 800; max-width: 26ch; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .hero p { margin: 0; max-width: 64ch; color: rgba(255, 255, 255, 0.88); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: rgba(255, 255, 255, 0.8); margin-top: 4px; }

    /* ---------- LAYOUT UTAMA (FEED 2 KOLOM + SIDEBAR) ---------- */
    .main-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 24px;
      align-items: start;
      margin-bottom: 56px;
    }

    .feed-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .fc {
      background: var(--glass);
      backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      box-shadow: var(--glass-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 300ms ease, box-shadow 300ms ease, border-color 300ms ease;
    }
    .fc:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 50px rgba(95, 63, 200, 0.22);
      border-color: var(--indigo);
    }

    .fc-cover {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      background: linear-gradient(135deg, #3A1C96, #5F6FEE 55%, #1CC8C8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fc-cover img.real-cov {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 300ms ease;
    }
    .fc:hover .fc-cover img.real-cov { transform: scale(1.05); }
    .fc-cover .ph-logo {
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 16px;
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(20, 8, 70, 0.22);
      transition: transform 300ms ease;
    }
    .fc-cover .ph-logo img { height: 34px; display: block; }
    .fc:hover .fc-cover .ph-logo { transform: scale(1.05); }

    .fc-body { padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
    .fc-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .fc-title {
      font-size: 18.5px;
      font-weight: 700;
      line-height: 1.32;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 300ms ease;
    }
    .fc:hover .fc-title { color: var(--indigo); }
    .fc-desc {
      margin: 0;
      font-size: 14px;
      color: var(--mute);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .fc-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 6px;
      font-size: 12.5px;
      color: var(--mute);
    }
    .av {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--violet), var(--cyan));
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Action Bar Sosial Media */
    .act-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 10px 14px;
      border-top: 1px solid rgba(228, 224, 245, 0.85);
      background: rgba(255, 255, 255, 0.45);
    }
    .act-btn {
      border: 0;
      background: transparent;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--mute);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 200ms ease, color 200ms ease, transform 200ms ease;
    }
    .act-btn:hover { background: rgba(124, 63, 224, 0.08); color: var(--ink); }
    .act-btn.like-btn:hover { background: rgba(214, 51, 108, 0.12); color: #E64980; }
    .act-btn.like-btn.liked { color: var(--err); background: rgba(214, 51, 108, 0.12); }
    .act-btn.save-btn.saved { color: var(--violet); background: rgba(124, 63, 224, 0.12); }
    @keyframes popHeart { 0% { transform: scale(1); } 50% { transform: scale(1.32); } 100% { transform: scale(1); } }
    .pop { animation: popHeart 300ms ease; }

    /* ---------- SIDEBAR KANAN ---------- */
    .side-col { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 88px; }
    .glass-box {
      background: var(--glass);
      backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--glass-shadow);
    }
    .glass-box h3 { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }

    .pop-list { display: flex; flex-direction: column; gap: 12px; }
    .pop-item { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
    .pop-item:hover b { color: var(--indigo); }
    .pop-num {
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--violet), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      min-width: 28px;
    }
    .pop-item b { display: block; font-size: 13.5px; line-height: 1.35; margin-bottom: 2px; transition: color 0.2s; }

    .tag-cloud { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag-chip {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      transition: 0.2s;
    }
    .tag-chip:hover, .tag-chip.on { border-color: var(--violet); background: rgba(124, 63, 224, 0.12); color: var(--violet); }

    /* ---------- SLOT IKLAN KONDISIONAL ---------- */
    .ad-slot {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      margin: 18px 0;
    }
    .ad-slot.in-feed { grid-column: 1 / -1; margin: 2px 0; }
    .ad-badge {
      position: absolute;
      top: 8px;
      right: 10px;
      z-index: 2;
      background: rgba(27, 22, 64, 0.65);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.04em;
    }
    .ad-slot img { width: 100%; max-height: 220px; object-fit: cover; display: block; }

    /* ---------- HALAMAN DETAIL BERITA & KOMENTAR ---------- */
    .detail-wrap { max-width: 820px; margin: 26px auto 60px; }
    .crumb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--mute); margin-bottom: 14px; }
    .crumb a:hover { color: var(--violet); }

    .art-card {
      background: var(--glass);
      backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--glass-shadow);
    }
    .art-card h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.18; font-weight: 800; margin: 12px 0 14px; }
    .art-meta-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    .art-cover { width: 100%; aspect-ratio: 2 / 1; border-radius: 20px; overflow: hidden; margin-bottom: 24px; background: linear-gradient(135deg, #2A1470, #2B7BEA, #1CC8C8); display: flex; align-items: center; justify-content: center; }
    .art-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .art-tx { font-size: 17px; line-height: 1.85; color: var(--ink); }
    .art-tx p { margin: 0 0 18px; }
    .quote-glass {
      margin: 22px 0;
      padding: 18px 22px;
      border-left: 4px solid var(--violet);
      border-radius: 0 16px 16px 0;
      background: rgba(124, 63, 224, 0.08);
      font-weight: 600;
      font-size: 17.5px;
      color: var(--ink);
    }
    .hak-jawab-box {
      margin-top: 22px;
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(18, 146, 110, 0.1);
      border: 1px solid rgba(18, 146, 110, 0.3);
      color: #0D6E53;
      font-weight: 600;
      font-size: 14px;
    }

    .cmt-box { margin-top: 26px; }
    .cmt-item {
      display: flex;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .cmt-item:last-child { border-bottom: 0; }
    .cmt-content b { font-size: 14px; }
    .cmt-content p { margin: 4px 0 0; font-size: 14.5px; white-space: pre-wrap; }

    /* ---------- FOOTER ---------- */
    .pf {
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      padding: 28px 0 42px;
      color: var(--mute);
      font-size: 13.5px;
      margin-top: 30px;
    }
    .pf-grid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; }
    .pf-links { display: flex; flex-wrap: wrap; gap: 16px; }
    .pf-links a:hover { color: var(--violet); }

    /* ---------- LOGIN / DAFTAR ---------- */
    .lg { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; }
    .brand {
      color: #fff;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 85% 12%, rgba(255, 154, 85, 0.55), transparent 28%),
        linear-gradient(145deg, #2A1470, #5B2FD0 38%, #2B7BEA 78%, #1CC8C8);
    }
    .brand .cw {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 14px 20px;
      align-self: flex-start;
      box-shadow: 0 18px 40px rgba(20, 8, 70, 0.35);
    }
    .brand .cw img { display: block; height: 84px; }
    .brand h1 { font-size: clamp(28px, 3.4vw, 42px); line-height: 1.12; font-weight: 800; max-width: 15ch; margin-bottom: 12px; }
    .brand p { margin: 0; max-width: 42ch; color: rgba(255, 255, 255, 0.88); }

    .side { display: flex; align-items: center; justify-content: center; padding: 30px 20px; }
    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(95, 63, 200, 0.14);
    }
    .ml { display: none; height: 50px; margin: 0 auto 16px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #F0EDFB; border-radius: 14px; padding: 4px; margin-bottom: 20px; }
    .tabs button { border: 0; background: none; border-radius: 11px; padding: 9px; font-weight: 600; color: var(--mute); }
    .tabs button[aria-selected=true] { background: #fff; color: var(--violet); box-shadow: 0 4px 14px rgba(95, 63, 200, 0.16); }
    .card h2 { font-size: 23px; font-weight: 800; margin-bottom: 4px; }
    .sub { margin: 0 0 18px; color: var(--mute); font-size: 14px; }
    .in { position: relative; }
    .eye { position: absolute; right: 5px; top: 5px; height: 34px; border: 0; background: none; color: var(--violet); font-weight: 600; font-size: 13px; padding: 0 10px; }
    .forgot-wrap { margin-top: 12px; text-align: center; }
    .forgot-link { font-size: 13px; font-weight: 600; color: var(--violet); cursor: pointer; }
    .forgot-link:hover { text-decoration: underline; }

    /* ---------- RUANG REDAKSI (BACKEND UI) ---------- */
    .shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .sb {
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .sb img { height: 58px; display: block; margin: 0 auto 14px; }
    .sb nav { display: flex; flex-direction: column; gap: 3px; }
    .sb nav button { text-align: left; border: 0; background: none; border-radius: 12px; padding: 10px 13px; font-weight: 600; color: var(--mute); }
    .sb nav button:hover { background: #F4F1FF; }
    .sb nav button.on { background: linear-gradient(100deg, rgba(124, 63, 224, 0.14), rgba(28, 200, 200, 0.14)); color: var(--violet); }
    .badge { float: right; background: var(--orange); color: #4a2400; border-radius: 999px; font-size: 11px; padding: 0 7px; line-height: 19px; }

    .tp {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
      flex-wrap: wrap;
    }
    .tp .sp { flex: 1; }
    .tp select { width: auto; height: 36px; font-size: 13px; }
    .ct { padding: 26px 24px 60px; max-width: 1080px; }
    .ct h2 { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
    .lead { color: var(--mute); margin: 0 0 20px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .st { background: var(--glass); backdrop-filter: blur(14px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 14px 16px; }
    .st b { display: block; font-size: 26px; font-weight: 800; color: var(--violet); }
    .st span { font-size: 13px; color: var(--mute); }

    .panel { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 18px; padding: 20px; margin-bottom: 18px; box-shadow: 0 12px 30px rgba(95, 63, 200, 0.08); }
    .rw { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; width: 100%; text-align: left; background: rgba(255, 255, 255, 0.9); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
    button.rw:hover { border-color: var(--indigo); }
    .rw b { flex: 1 1 260px; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { font-size: 12px; color: var(--mute); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
    .tw { overflow-x: auto; }
    .c { text-align: center; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .tog { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; font-weight: 500; margin: 0; background: rgba(255, 255, 255, 0.8); }
    .tog input { width: 18px; height: 18px; accent-color: var(--violet); }

    /* Modal & Share Sheet */
    .dlg {
      position: fixed;
      inset: 0;
      background: rgba(27, 22, 64, 0.5);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      overflow: auto;
      z-index: 50;
    }
    .dlg.on { display: flex; }
    .dlg .box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      max-width: 680px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 30px 80px rgba(20, 8, 70, 0.4);
    }
    .body { white-space: pre-wrap; background: #FAF9FF; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
    .log { list-style: none; padding: 0; margin: 8px 0 16px; font-size: 13px; color: var(--mute); }
    .log li { padding: 5px 0 5px 14px; border-left: 2px solid var(--line); }
    .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .share-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 14px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 30px);
      opacity: 0;
      pointer-events: none;
      background: var(--ink);
      color: #fff;
      padding: 11px 20px;
      border-radius: 999px;
      font-weight: 600;
      transition: 0.3s;
      z-index: 70;
      max-width: 90vw;
      text-align: center;
    }
    .toast.on { transform: translate(-50%, 0); opacity: 1; }

    @media (max-width: 960px) {
      .main-layout { grid-template-columns: 1fr; }
      .side-col { position: static; }
    }
    @media (max-width: 860px) {
      .lg { grid-template-columns: 1fr; }
      .brand { display: none; }
      .ml { display: block; }
      .side { align-items: flex-start; }
      .cats { display: none; }
      .hamb { display: inline-flex; }
      .srch-box { width: 145px; }
      .ph .wrap { justify-content: space-between; }
      .feed-grid { grid-template-columns: 1fr; }
      .fc-cover { height: 180px; }
      .hero { aspect-ratio: auto; min-height: 290px; }
      .hero-body { padding: 22px; }
      .shell { grid-template-columns: 1fr; }
      .sb { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .sb img { height: 46px; }
      .sb nav { flex-direction: row; overflow-x: auto; }
      .sb nav button { white-space: nowrap; }
      .row2 { grid-template-columns: 1fr; }
      .tp { padding: 10px 16px; }
      .ct { padding: 20px 16px 60px; }
      .art-card { padding: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="dlg" id="dlg"><div class="box" id="box"></div></div>
  <div class="toast" id="ts" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
    const fmt = (d) => d ? new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    const fmtT = (d) => new Date(d).toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const readMins = (txt) => Math.max(1, Math.ceil(String(txt || '').trim().split(/\s+/).filter(Boolean).length / 200));

    function resolveConfig() {
      const raw = window.APP_CONFIG || window.LANGKATALK_CONFIG || {};
      const supaUrl = (raw.SUPABASE_URL || '').trim();
      const pubKey = (raw.SUPABASE_PUBLISHABLE_KEY || raw.SUPABASE_ANON_KEY || '').trim();
      const useProxy = raw.USE_PROXY !== false;
      const proxyPath = (raw.PROXY_PATH || '/supabase').replace(/\/+$/, '');
      const apiUrl = useProxy ? `${location.origin}${proxyPath}` : supaUrl;
      const hasValidKey = !!pubKey && pubKey.length >= 20 && !pubKey.includes('GANTI_') && !pubKey.startsWith('TEMPEL_');
      const hasValidUrl = !!apiUrl && !apiUrl.includes('GANTI_');
      return { supaUrl, pubKey, useProxy, proxyPath, apiUrl, ready: Boolean(window.supabase && hasValidUrl && hasValidKey) };
    }

    const CFG = resolveConfig();
    const ready = CFG.ready;
    const sb = ready ? window.supabase.createClient(CFG.apiUrl, CFG.pubKey) : null;

    // Device ID & LocalStorage Helpers (Like, Bookmark, Anti-spam)
    function getDeviceId() {
      let id = localStorage.getItem('lk_device_id');
      if (!id) {
        id = (crypto && crypto.randomUUID) ? crypto.randomUUID() : `dev-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
        localStorage.setItem('lk_device_id', id);
      }
      return id;
    }
    const DEVICE_ID = getDeviceId();
    const getJsonStore = (k, def) => { try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(def)); } catch { return def; } };
    const setJsonStore = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    let likedIds = new Set(getJsonStore('lk_liked_ids', []));
    let savedIds = new Set(getJsonStore('lk_saved_ids', []));

    // State Aplikasi
    let me = null;
    let view = 'direktur';
    let page = 'home';
    let pre = null;
    let cat = '';
    let activeTag = '';
    let searchQuery = '';
    let feedArticles = [];
    let activeAds = [];
    let siteSettings = {};
    const D = { arts: [], ideas: [], profs: [], comments: [], adsAll: [] };

    const CATS = ['Investigasi', 'Ruang Gelap', 'Politik', 'Panggung', 'Ekonomi Gelap', 'Opini'];
    const ROLES = {
      direktur: 'Direktur',
      pemred: 'Pemimpin Redaksi',
      redaktur: 'Redaktur',
      editor: 'Editor',
      reporter: 'Reporter',
      kontributor: 'Kontributor'
    };
    const MENUS = [
      ['home', 'Ringkasan'],
      ['usul', 'Usulan & Penugasan'],
      ['tulis', 'Tulis Naskah'],
      ['antre', 'Antrean Kerja'],
      ['semua', 'Semua Naskah'],
      ['komen', 'Komentar'],
      ['iklan', 'Iklan'],
      ['user', 'Pengguna & Peran'],
      ['settings', 'Pengaturan Situs'],
      ['matrix', 'Matriks Akses']
    ];
    const ACC = {
      direktur: ['home', 'usul', 'tulis', 'antre', 'semua', 'komen', 'iklan', 'user', 'settings', 'matrix'],
      pemred: ['home', 'usul', 'tulis', 'antre', 'semua', 'komen', 'matrix'],
      redaktur: ['home', 'usul', 'tulis', 'antre', 'semua', 'komen'],
      editor: ['home', 'antre', 'semua', 'komen'],
      reporter: ['home', 'usul', 'tulis', 'antre'],
      kontributor: ['home', 'tulis', 'antre']
    };
    const CAN = {
      'Menulis': ['direktur', 'pemred', 'redaktur', 'reporter', 'kontributor'],
      'Menyunting isi': ['direktur', 'pemred', 'redaktur', 'editor'],
      'Moderasi komentar': ['direktur', 'pemred', 'redaktur', 'editor'],
      'Meneruskan ke pemred': ['direktur', 'redaktur'],
      'Menerbitkan': ['direktur', 'pemred'],
      'Kelola iklan & situs': ['direktur'],
      'Kelola pengguna': ['direktur']
    };
    const ST = {
      draf: 'Draf',
      diajukan: 'Menunggu editor',
      disunting: 'Menunggu redaktur',
      ditinjau: 'Menunggu pemred',
      revisi: 'Perlu revisi',
      terbit: 'Terbit'
    };
    const ST_CHIP = { draf: '', diajukan: 'wr', disunting: 'bl', ditinjau: 'bl', revisi: 'ex', terbit: 'ok' };
    const RET = ['editor', 'redaktur', 'pemred'];
    const TR = {
      draf: [{ to: 'diajukan', l: 'Ajukan ke editor', w: ['author'] }],
      revisi: [{ to: 'diajukan', l: 'Ajukan ulang', w: ['author'] }],
      diajukan: [
        { to: 'disunting', l: 'Selesai disunting', w: ['editor'] },
        { to: 'revisi', l: 'Kembalikan', w: RET, r: 1 }
      ],
      disunting: [
        { to: 'ditinjau', l: 'Teruskan ke pemred', w: ['redaktur'] },
        { to: 'revisi', l: 'Kembalikan', w: RET, r: 1 }
      ],
      ditinjau: [
        { to: 'terbit', l: 'Setujui dan terbitkan', w: ['pemred'] },
        { to: 'revisi', l: 'Kembalikan', w: RET, r: 1 }
      ]
    };

    function toast(t) {
      const e = $('ts');
      e.textContent = t;
      e.classList.add('on');
      clearTimeout(toast.k);
      toast.k = setTimeout(() => e.classList.remove('on'), 3400);
    }

    const eff = () => (me && me.r === 'direktur' ? view : me.r);
    const pn = (id) => {
      const p = D.profs.find((x) => x.id === id);
      return p ? p.full_name : '-';
    };

    function updateSeoMeta({ title, description, image, url, type = 'website', jsonLd = null }) {
      document.title = title;
      const setMeta = (selector, attr, val) => {
        const el = document.querySelector(selector);
        if (el && val) el.setAttribute(attr, val);
      };
      setMeta('meta[name="description"]', 'content', description);
      setMeta('meta[property="og:title"]', 'content', title);
      setMeta('meta[property="og:description"]', 'content', description);
      setMeta('meta[property="og:image"]', 'content', image || `${location.origin}/logo.png`);
      setMeta('meta[property="og:type"]', 'content', type);
      setMeta('link[rel="canonical"]', 'href', url || location.href);
      const ldEl = $('ld-json');
      if (ldEl) ldEl.textContent = jsonLd ? JSON.stringify(jsonLd) : '{}';
    }

    function setupNotice() {
      return `<div class="wrap"><div class="notice"><b>Supabase belum tersambung.</b><br>Periksa <code>config.js</code> dan pastikan Publishable Key utuh sudah diisi.</div></div>`;
    }

    /* ---------- ROUTER ---------- */
    function route() {
      const p = location.hash.replace(/^#\/?/, '').split('/');
      $('dlg').classList.remove('on');
      if (p[0] === 'baca') return showArticle(decodeURIComponent(p[1] || ''));
      if (p[0] === 'masuk') return showLogin();
      if (p[0] === 'redaksi') return showNewsroom();
      if (['about-us', 'redaksi-info', 'pt', 'info-iklan'].includes(p[0])) return showStaticPage(p[0]);
      return showHome();
    }
    addEventListener('hashchange', route);

    /* ---------- HELPER IKLAN KONDISIONAL ---------- */
    async function loadPublicExtras() {
      if (!ready) return;
      const [adsRes, setRes] = await Promise.all([
        sb.from('ads').select('*').eq('is_active', true),
        sb.from('site_settings').select('key,value')
      ]);
      activeAds = adsRes.data || [];
      siteSettings = {};
      (setRes.data || []).forEach((row) => { siteSettings[row.key] = row.value; });
    }

    function renderAdSlot(slotName, extraClass = '') {
      const ad = activeAds.find((x) => x.slot === slotName);
      if (!ad) return ''; // Prinsip: jika kosong, tidak dirender sama sekali (0px height)
      if (ad.ad_type === 'adsense' && ad.adsense_slot_id) {
        const client = ad.adsense_client || siteSettings.adsense_client || '';
        if (!client) return '';
        return `
          <div class="ad-slot ${extraClass}">
            <span class="ad-badge">Iklan</span>
            <ins class="adsbygoogle" style="display:block" data-ad-client="${esc(client)}" data-ad-slot="${esc(ad.adsense_slot_id)}" data-ad-format="auto" data-full-width-responsive="true"></ins>
          </div>
        `;
      }
      if (ad.image_url) {
        const img = `<img src="${esc(ad.image_url)}" alt="${esc(ad.title || 'Iklan Langkatalk')}" loading="lazy">`;
        return `
          <div class="ad-slot ${extraClass}">
            <span class="ad-badge">Iklan</span>
            ${ad.link_url ? `<a href="${esc(ad.link_url)}" target="_blank" rel="noopener noreferrer">${img}</a>` : img}
          </div>
        `;
      }
      return '';
    }

    /* ---------- PORTAL SHELL & HEADER ---------- */
    function toggleDrawer(open) {
      $('drawer-bg')?.classList.toggle('on', open);
      $('drawer')?.classList.toggle('on', open);
    }

    function pub(inner, breakingItems = []) {
      const tickerHtml = breakingItems.length
        ? `<div class="ticker"><div class="wrap"><span class="ticker-tag">BREAKING</span><div class="ticker-track"><div class="ticker-move">${breakingItems.map((b) => `<a href="#/baca/${encodeURIComponent(b.slug || b.id)}" style="margin-right:36px">• ${esc(b.title)}</a>`).join('')}</div></div></div></div>`
        : '';

      return `
        <header class="ph">
          <div class="wrap">
            <button class="hamb" type="button" aria-label="Menu" onclick="toggleDrawer(true)">☰</button>
            <a class="logo-link" href="#/" onclick="resetFilters()"><img src="logo.png" alt="Langkatalk"></a>
            <nav class="cats">
              <button class="${!cat && !activeTag ? 'on' : ''}" onclick="setCat('')">Beranda</button>
              ${CATS.map((c) => `<button class="${cat === c ? 'on' : ''}" onclick="setCat('${c}')">${c}</button>`).join('')}
              <button class="${cat === '__saved' ? 'on' : ''}" onclick="setCat('__saved')">Disimpan (${savedIds.size})</button>
            </nav>
            <div class="srch-box">
              <span>🔍</span>
              <input type="text" placeholder="Cari berita..." value="${esc(searchQuery)}" oninput="onSearchInput(this.value)">
            </div>
            <a class="go sm" href="#/${me ? 'redaksi' : 'masuk'}">${me ? 'Redaksi' : 'Masuk'}</a>
          </div>
        </header>
        ${tickerHtml}
        <div class="drawer-bg" id="drawer-bg" onclick="toggleDrawer(false)"></div>
        <aside class="drawer" id="drawer">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <img src="logo.png" alt="Langkatalk" style="height:36px">
            <button type="button" onclick="toggleDrawer(false)" style="width:auto;padding:4px 10px">✕</button>
          </div>
          <button class="${!cat ? 'on' : ''}" onclick="toggleDrawer(false);setCat('')">Beranda</button>
          ${CATS.map((c) => `<button class="${cat === c ? 'on' : ''}" onclick="toggleDrawer(false);setCat('${c}')">${c}</button>`).join('')}
          <button class="${cat === '__saved' ? 'on' : ''}" onclick="toggleDrawer(false);setCat('__saved')">Disimpan (${savedIds.size})</button>
          <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:6px 0">
          <a href="#/about-us" onclick="toggleDrawer(false)">Tentang Kami</a>
          <a href="#/redaksi-info" onclick="toggleDrawer(false)">Susunan Redaksi</a>
          <a href="#/pt" onclick="toggleDrawer(false)">Legalitas PT</a>
          <a href="#/info-iklan" onclick="toggleDrawer(false)">Info Iklan</a>
        </aside>
        <main>${inner}</main>
        <footer class="pf">
          <div class="wrap pf-grid">
            <div>
              <b style="color:var(--ink)">Langkatalk</b> • Menghubungkan Cerita Langkat — <i>Bongkar Atraksi Ruang Gelap</i>
            </div>
            <div class="pf-links">
              <a href="#/about-us">Tentang Kami</a>
              <a href="#/redaksi-info">Redaksi</a>
              <a href="#/pt">PT / Legalitas</a>
              <a href="#/info-iklan">Info Iklan</a>
            </div>
          </div>
        </footer>
      `;
    }

    function resetFilters() {
      cat = '';
      activeTag = '';
      searchQuery = '';
    }

    function setCat(c) {
      cat = c;
      activeTag = '';
      if (location.hash.replace('#', '').length > 1) location.hash = '#/';
      else renderFeedView();
    }

    function setTag(t) {
      activeTag = activeTag === t ? '' : t;
      if (location.hash.replace('#', '').length > 1) location.hash = '#/';
      else renderFeedView();
    }

    function onSearchInput(val) {
      searchQuery = val.trim();
      if (location.hash.replace('#', '').length > 1) location.hash = '#/';
      else renderFeedView();
    }

    /* ---------- INTERAKSI SOSIAL MEDIA (LIKE, SHARE, SIMPAN, KOMEN MODAL) ---------- */
    async function handleLike(ev, articleId) {
      if (ev) ev.stopPropagation();
      if (!ready) return;

      const btn = document.querySelector(`[data-like-btn="${articleId}"]`);
      if (btn) {
        btn.classList.remove('pop');
        void btn.offsetWidth;
        btn.classList.add('pop');
      }

      const res = await sb.rpc('toggle_like', { p_article_id: articleId, p_device_id: DEVICE_ID });
      if (res.error) {
        toast(res.error.message);
        return;
      }
      const { liked, like_count } = res.data || {};
      if (liked) likedIds.add(articleId);
      else likedIds.delete(articleId);
      setJsonStore('lk_liked_ids', Array.from(likedIds));

      const art = feedArticles.find((a) => a.id === articleId);
      if (art) art.like_count = like_count;

      document.querySelectorAll(`[data-like-btn="${articleId}"]`).forEach((el) => {
        el.classList.toggle('liked', !!liked);
        el.innerHTML = `${liked ? '♥' : '♡'} <span>${like_count ?? 0}</span>`;
      });
    }

    function handleSave(ev, articleId) {
      if (ev) ev.stopPropagation();
      if (savedIds.has(articleId)) {
        savedIds.delete(articleId);
        toast('Dihapus dari daftar simpan');
      } else {
        savedIds.add(articleId);
        toast('Berita disimpan');
      }
      setJsonStore('lk_saved_ids', Array.from(savedIds));
      document.querySelectorAll(`[data-save-btn="${articleId}"]`).forEach((el) => {
        const isSaved = savedIds.has(articleId);
        el.classList.toggle('saved', isSaved);
        el.innerHTML = `🔖 <span>${isSaved ? 'Tersimpan' : 'Simpan'}</span>`;
      });
    }

    function openShareModal(ev, slugOrId, title) {
      if (ev) ev.stopPropagation();
      const shareUrl = `${location.origin}/#/baca/${encodeURIComponent(slugOrId)}?utm_source=share`;
      const encUrl = encodeURIComponent(shareUrl);
      const encText = encodeURIComponent(`${title} — Langkatalk`);

      $('box').innerHTML = `
        <h3 style="font-size:20px;font-weight:800;margin-bottom:6px">Bagikan Berita</h3>
        <p class="mt" style="margin-bottom:12px">${esc(title)}</p>
        <input type="text" readonly value="${esc(shareUrl)}" onclick="this.select()">
        <div class="share-grid">
          <button type="button" class="go sm" onclick="copyShareLink('${esc(shareUrl)}')">Salin Link</button>
          <a class="gh" href="https://wa.me/?text=${encText}%20${encUrl}" target="_blank" rel="noopener">WhatsApp</a>
          <a class="gh" href="https://www.facebook.com/sharer/sharer.php?u=${encUrl}" target="_blank" rel="noopener">Facebook</a>
          <a class="gh" href="https://twitter.com/intent/tweet?text=${encText}&url=${encUrl}" target="_blank" rel="noopener">X / Twitter</a>

    function copyShareLink(url) {

    function openCommentModal(ev, slugOrId) {
      if (ev) ev.stopPropagation();
      location.hash = `#/baca/${encodeURIComponent(slugOrId)}`;
      setTimeout(() => {
        document.getElementById('section-komentar')?.scrollIntoView({ behavior: 'smooth' });

    /* ---------- PORTAL FEED UTAMA ---------- */
    async function showHome() {
      updateSeoMeta({
        title: 'Langkatalk – Menghubungkan Cerita Langkat',
        description: 'Bongkar Atraksi Ruang Gelap. Portal berita investigasi dan cerita Langkat.',
        image: `${location.origin}/logo.png`,
        url: `${location.origin}/`
      });

      $('root').innerHTML = pub(ready ? '<div class="wrap"><div class="empty" style="margin-top:30px">Memuat feed berita…</div></div>' : setupNotice());
      if (!ready) return;

      await Promise.all([loadMe(), loadPublicExtras()]);
      const r = await sb.from('articles')
        .select('id,title,slug,category,body,description,tags,author_name,published_at,is_exclusive,evidence_level,cover_image,like_count,comment_count,view_count,show_on_home')
        .eq('status', 'terbit')
        .order('published_at', { ascending: false })
        .limit(60);

      if (r.error) {
        $('root').innerHTML = pub(`<div class="wrap"><div class="notice">Gagal memuat berita: ${esc(r.error.message)}</div></div>`);
        return;
      }

      feedArticles = r.data || [];
      renderFeedView();

    function renderFeedView() {
      const breakingList = feedArticles.filter((a) => a.is_exclusive).slice(0, 5);
      let list = [...feedArticles];

      if (cat === '__saved') {
        list = list.filter((a) => savedIds.has(a.id));
      } else if (cat) {
        list = list.filter((a) => a.category === cat);
      }

      if (activeTag) {
        list = list.filter((a) => Array.isArray(a.tags) && a.tags.includes(activeTag));
      }

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter((a) =>
          (a.title || '').toLowerCase().includes(q) ||
          (a.description || '').toLowerCase().includes(q) ||
          (a.body || '').toLowerCase().includes(q)
        );
      }

      // Kumpulkan tag & terpopuler untuk sidebar
      const tagMap = {};
      feedArticles.forEach((a) => (a.tags || []).forEach((t) => { tagMap[t] = (tagMap[t] || 0) + 1; }));
      const topTags = Object.keys(tagMap).sort((a, b) => tagMap[b] - tagMap[a]).slice(0, 12);
      const popularList = [...feedArticles]
        .sort((a, b) => (b.like_count || 0) - (a.like_count || 0) || (b.view_count || 0) - (a.view_count || 0))
        .slice(0, 10);

      const getExcerpt = (a) => esc(a.description || (a.body || '').replace(/\s+/g, ' ').slice(0, 150));

      let heroHtml = '';
      let gridItems = list;

      if (list.length > 0 && !searchQuery && !activeTag && cat !== '__saved') {
        const h = list[0];
        const hSlug = h.slug || h.id;
        heroHtml = `
          <article class="hero" onclick="location.hash='#/baca/${encodeURIComponent(hSlug)}'">
            <div class="hero-bg">
              ${h.cover_image ? `<img src="${esc(h.cover_image)}" alt="${esc(h.title)}" width="1200" height="600">` : ''}
            </div>
            <div class="hero-body">
              <div class="hero-subtag">Bongkar Atraksi Ruang Gelap</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                ${h.is_exclusive ? '<span class="chip ex">EKSKLUSIF</span>' : ''}
                <span class="chip glass-dark">${esc(h.category)}</span>
                <span class="chip glass-dark">Bukti: ${esc(h.evidence_level || 'Kuat')}</span>
              </div>
              <h1>${esc(h.title)}</h1>
              <p>${getExcerpt(h)}</p>
              <div class="hero-meta">
                <span>Oleh <b>${esc(h.author_name || 'Redaksi')}</b></span>
                <span>•</span>
                <span>${fmt(h.published_at)}</span>
                <span>•</span>
                <span>${readMins(h.body)} menit baca</span>
                <span>•</span>
                <span>♥ ${h.like_count || 0} • 💬 ${h.comment_count || 0}</span>
              </div>
            </div>
          </article>
        `;
        gridItems = list.slice(1);
      }

      const cardsHtml = gridItems.map((a, idx) => {
        const slugOrId = a.slug || a.id;
        const isLiked = likedIds.has(a.id);
        const isSaved = savedIds.has(a.id);
        const initial = (a.author_name || 'L').trim().charAt(0).toUpperCase();

        const card = `
          <article class="fc" onclick="location.hash='#/baca/${encodeURIComponent(slugOrId)}'">
            <div class="fc-cover">
              ${a.cover_image
                ? `<img class="real-cov" src="${esc(a.cover_image)}" alt="${esc(a.title)}" width="1200" height="600" loading="lazy">`
                : `<div class="ph-logo"><img src="logo.png" alt="Langkatalk"></div>`}
            </div>
            <div class="fc-body">
              <div class="fc-chips">
                <span class="chip">${esc(a.category)}</span>
                ${a.is_exclusive ? '<span class="chip ex">EKSKLUSIF</span>' : ''}
                <span class="chip wr">Bukti: ${esc(a.evidence_level || 'Kuat')}</span>
              </div>
              <h3 class="fc-title">${esc(a.title)}</h3>
              <p class="fc-desc">${getExcerpt(a)}</p>
              <div class="fc-meta">
                <span class="av">${esc(initial)}</span>
                <span><b>${esc(a.author_name || 'Redaksi')}</b> • ${fmt(a.published_at)} • ${readMins(a.body)} mnt baca</span>
              </div>
            </div>
            <div class="act-bar" onclick="event.stopPropagation()">
              <button type="button" class="act-btn like-btn ${isLiked ? 'liked' : ''}" data-like-btn="${a.id}" onclick="handleLike(event, ${a.id})">
                ${isLiked ? '♥' : '♡'} <span>${a.like_count || 0}</span>
              </button>
              <button type="button" class="act-btn" onclick="openCommentModal(event, '${esc(slugOrId)}')">
                💬 <span>${a.comment_count || 0}</span>
              </button>
              <button type="button" class="act-btn" onclick="openShareModal(event, '${esc(slugOrId)}', '${esc(a.title)}')">
                ↗ <span>Share</span>
              </button>
              <button type="button" class="act-btn save-btn ${isSaved ? 'saved' : ''}" data-save-btn="${a.id}" onclick="handleSave(event, ${a.id})">
                🔖 <span>${isSaved ? 'Tersimpan' : 'Simpan'}</span>
              </button>
            </div>
          </article>
        `;

        // Sisipkan iklan feed_middle setelah kartu ke-4 jika ada iklan aktif
        if (idx === 3) {
          return card + renderAdSlot('feed_middle', 'in-feed');
        }
        return card;
      }).join('');

      const filterBanner = (activeTag || searchQuery || cat === '__saved')
        ? `<div class="glass-box" style="margin:20px 0;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <span>Menampilkan: <b>${cat === '__saved' ? 'Berita Disimpan' : activeTag ? `#${esc(activeTag)}` : `Pencarian "${esc(searchQuery)}"`}</b> (${list.length} berita)</span>
            <button type="button" class="gh" onclick="resetFilters();renderFeedView()">Reset Filter</button>
          </div>`
        : '';

      const feedContent = list.length === 0
        ? `<div class="empty">Belum ada berita yang sesuai filter saat ini.</div>`
        : `<div class="feed-grid">${cardsHtml}</div>`;

      const sidebarHtml = `
        <aside class="side-col">
          ${renderAdSlot('sidebar')}
          <div class="glass-box">
            <h3>Terpopuler</h3>
            ${popularList.length
              ? `<div class="pop-list">
                  ${popularList.map((p, i) => `
                    <div class="pop-item" onclick="location.hash='#/baca/${encodeURIComponent(p.slug || p.id)}'">
                      <span class="pop-num">${String(i + 1).padStart(2, '0')}</span>
                      <div>
                        <b>${esc(p.title)}</b>
                        <span class="mt">♥ ${p.like_count || 0} suka • ${esc(p.category)}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>`
              : '<p class="mt">Belum ada data populer.</p>'}
          </div>

          ${topTags.length ? `
            <div class="glass-box">
              <h3>Tag Terpopuler</h3>
              <div class="tag-cloud">
                ${topTags.map((t) => `<button type="button" class="tag-chip ${activeTag === t ? 'on' : ''}" onclick="setTag('${esc(t)}')">#${esc(t)}</button>`).join('')}
              </div>
            </div>
          ` : ''}

          <div class="glass-box">
            <h3>Kabar Investigasi</h3>
            <p class="mt" style="margin-bottom:12px">Dapatkan ringkasan laporan investigasi Langkatalk langsung ke emailmu.</p>
            <form onsubmit="event.preventDefault();toast('Terima kasih! Email terdaftar untuk kabar Langkatalk.');this.reset()">
              <div class="f" style="margin-bottom:10px"><input type="email" placeholder="email@contoh.com" required></div>
              <button type="submit" class="go sm" style="width:100%">Daftar Newsletter</button>
            </form>
          </div>
        </aside>
      `;

      $('root').innerHTML = pub(`
        <div class="wrap">
          ${heroHtml}
          ${renderAdSlot('feed_top')}
          ${filterBanner}
          <div class="main-layout" style="margin-top:${heroHtml ? '8px' : '24px'}">
            <div>${feedContent}</div>
            ${sidebarHtml}
          </div>
        </div>
      `, breakingList);
    }

    /* ---------- HALAMAN DETAIL BERITA & MODERASI KOMENTAR ---------- */
    async function showArticle(slug) {
      $('root').innerHTML = pub('<div class="wrap"><div class="empty" style="margin-top:30px">Memuat berita…</div></div>');
      if (!ready) {
        $('root').innerHTML = pub(setupNotice());
        return;
      }

      await Promise.all([loadMe(), loadPublicExtras()]);
      let query = sb.from('articles').select('*').eq('status', 'terbit');
      if (/^\d+$/.test(slug)) query = query.eq('id', Number(slug));
      else query = query.eq('slug', slug);

      const r = await query.maybeSingle();
      const a = r.data;
      if (!a) {
        $('root').innerHTML = pub('<div class="wrap"><div class="empty" style="margin-top:30px">Berita tidak ditemukan atau belum terbit. <a href="#/" style="color:var(--violet);font-weight:700">Kembali ke beranda</a></div></div>');
        return;
      }

      // Hitung view sekali per jam per perangkat
      const viewCache = getJsonStore('lk_views', {});
      const now = Date.now();
      if (!viewCache[a.id] || now - viewCache[a.id] > 3600000) {
        viewCache[a.id] = now;
        setJsonStore('lk_views', viewCache);
        sb.rpc('increment_view', { p_article_id: a.id });
      }

      const seoDesc = a.description || (a.body || '').replace(/\s+/g, ' ').slice(0, 155);
      const canonicalUrl = `${location.origin}/#/baca/${encodeURIComponent(a.slug || a.id)}`;
      updateSeoMeta({
        title: `${a.title} – Langkatalk`,
        description: seoDesc,
        image: a.cover_image || `${location.origin}/logo.png`,
        url: canonicalUrl,
        type: 'article',
        jsonLd: {
          '@context': 'https://schema.org',
          '@type': 'NewsArticle',
          headline: a.title,
          image: [a.cover_image || `${location.origin}/logo.png`],
          datePublished: a.published_at,
          dateModified: a.updated_at || a.published_at,
          author: [{ '@type': 'Person', name: a.author_name || 'Redaksi Langkatalk' }],
          publisher: {
            '@type': 'Organization',
            name: 'Langkatalk',
            logo: { '@type': 'ImageObject', url: `${location.origin}/logo.png` }
          }
        }
      });

      // Ambil komentar yang sudah DISETUJUI lewat view aman public_comments (tanpa no HP)
      const [cmtRes, relRes] = await Promise.all([
        sb.from('public_comments').select('*').eq('article_id', a.id).order('created_at', { ascending: false }),
        sb.from('articles')
          .select('id,title,slug,category,body,description,author_name,published_at,is_exclusive,evidence_level,cover_image,like_count,comment_count')
          .eq('status', 'terbit')
          .eq('category', a.category)
          .neq('id', a.id)
          .order('published_at', { ascending: false })
          .limit(3)
      ]);

      const approvedComments = cmtRes.data || [];
      const relatedArticles = relRes.data || [];
      const isLiked = likedIds.has(a.id);
      const isSaved = savedIds.has(a.id);
      const slugOrId = a.slug || a.id;

      // Format paragraf rapi
      const paragraphs = String(a.body || '').split(/\n{2,}/).filter(Boolean).map((p) => `<p>${esc(p)}</p>`).join('');

      $('root').innerHTML = pub(`
        <div class="wrap detail-wrap">
          <nav class="crumb">
            <a href="#/">Beranda</a> <span>/</span>
            <a href="#/" onclick="setCat('${esc(a.category)}')">${esc(a.category)}</a> <span>/</span>
            <span>${esc(a.title.slice(0, 48))}…</span>
          </nav>

          ${renderAdSlot('detail_top')}

          <article class="art-card">
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              ${a.is_exclusive ? '<span class="chip ex">EKSKLUSIF</span>' : ''}
              <span class="chip">${esc(a.category)}</span>
              <span class="chip wr">Bukti: ${esc(a.evidence_level || 'Kuat')}</span>
            </div>

            <h1>${esc(a.title)}</h1>

            <div class="art-meta-row">
              <div class="mt">
                Oleh <b style="color:var(--ink)">${esc(a.author_name || 'Redaksi')}</b> • ${fmt(a.published_at)} • ${readMins(a.body)} menit baca
                ${a.source ? ` • Sumber: ${esc(a.source)}` : ''}
              </div>
              <button type="button" class="gh" onclick="openShareModal(event, '${esc(slugOrId)}', '${esc(a.title)}')">↗ Bagikan</button>
            </div>

            <div class="art-cover">
              ${a.cover_image
                ? `<img src="${esc(a.cover_image)}" alt="${esc(a.title)}" width="1200" height="600">`
                : `<div style="background:rgba(255,255,255,.92);padding:16px 24px;border-radius:18px"><img src="logo.png" alt="Langkatalk" style="height:54px"></div>`}
            </div>

            <div class="art-tx">${paragraphs}</div>

            ${a.right_of_reply ? '<div class="hak-jawab-box">✓ Hak jawab pihak terkait telah dicatat dan dimuat sesuai pedoman redaksi Langkatalk.</div>' : ''}

            ${Array.isArray(a.tags) && a.tags.length ? `
              <div class="tag-cloud" style="margin-top:22px">
                ${a.tags.map((t) => `<button type="button" class="tag-chip" onclick="setTag('${esc(t)}')">#${esc(t)}</button>`).join('')}
              </div>
            ` : ''}

            <div class="act-bar" style="margin-top:24px;border-radius:14px;border:1px solid var(--line)">
              <button type="button" class="act-btn like-btn ${isLiked ? 'liked' : ''}" data-like-btn="${a.id}" onclick="handleLike(event, ${a.id})">
                ${isLiked ? '♥' : '♡'} <span>${a.like_count || 0}</span>
              </button>
              <button type="button" class="act-btn" onclick="document.getElementById('cmt-name')?.focus()">
                💬 <span>${approvedComments.length} Komentar</span>
              </button>
              <button type="button" class="act-btn" onclick="openShareModal(event, '${esc(slugOrId)}', '${esc(a.title)}')">
                ↗ <span>Share</span>
              </button>
              <button type="button" class="act-btn save-btn ${isSaved ? 'saved' : ''}" data-save-btn="${a.id}" onclick="handleSave(event, ${a.id})">
                🔖 <span>${isSaved ? 'Tersimpan' : 'Simpan'}</span>
              </button>
            </div>
          </article>

          ${renderAdSlot('detail_bottom')}

          <!-- BAGIAN KOMENTAR PUBLIK (WAJIB NAMA + NO HP + ISI KOMEN) -->
          <section class="glass-box cmt-box" id="section-komentar">
            <h3>Komentar Pembaca (${approvedComments.length})</h3>
            ${a.allow_comment === false
              ? '<p class="mt">Komentar ditutup untuk artikel ini.</p>'
              : `
                <form id="f-cmt" style="margin-bottom:22px" novalidate>
                  <div class="row2">
                    <div class="f">
                      <label for="cmt-name">Nama Lengkap *</label>
                      <input type="text" id="cmt-name" placeholder="Nama kamu (min. 3 karakter)" required>
                    </div>
                    <div class="f">
                      <label for="cmt-phone">No. HP / WhatsApp * <span class="mt">(tidak ditampilkan ke publik)</span></label>
                      <input type="tel" id="cmt-phone" placeholder="08xxxxxxxxxx" required>
                    </div>
                  </div>
                  <div class="f">
                    <div style="display:flex;justify-content:space-between">
                      <label for="cmt-body">Isi Komentar *</label>
                      <span class="mt" id="cmt-cnt">0/500</span>
                    </div>
                    <textarea id="cmt-body" maxlength="500" placeholder="Tulis tanggapanmu secara sopan dan konstruktif..." oninput="$('cmt-cnt').textContent=this.value.length+'/500'" required></textarea>
                  </div>
                  <label class="tog" style="margin-bottom:12px">
                    <input type="checkbox" id="cmt-agree" required>
                    <span>Saya setuju komentar ditampilkan publik setelah moderasi redaksi.</span>
                  </label>
                  <p class="err" id="cmt-err"></p>
                  <p class="ok-msg" id="cmt-ok"></p>
                  <button type="submit" class="go sm">Kirim Komen</button>
                </form>
              `}

            <div>
              ${approvedComments.length
                ? approvedComments.map((c) => `
                  <div class="cmt-item">
                    <span class="av">${esc((c.guest_name || 'P').charAt(0).toUpperCase())}</span>
                    <div class="cmt-content">
                      <b>${esc(c.guest_name)}</b> <span class="mt">• ${fmtT(c.created_at)}</span>
                      <p>${esc(c.body)}</p>
                    </div>
                  </div>
                `).join('')
                : '<p class="mt">Belum ada komentar yang tampil. Jadilah yang pertama berkomentar!</p>'}
            </div>
          </section>

          ${relatedArticles.length ? `
            <section style="margin-top:30px">
              <h3 style="font-size:20px;font-weight:800;margin-bottom:14px">Berita Terkait</h3>
              <div class="feed-grid">
                ${relatedArticles.map((rel) => {
                  const rSlug = rel.slug || rel.id;
                  return `
                    <article class="fc" onclick="location.hash='#/baca/${encodeURIComponent(rSlug)}'">
                      <div class="fc-cover" style="height:175px">
                        ${rel.cover_image
                          ? `<img class="real-cov" src="${esc(rel.cover_image)}" alt="${esc(rel.title)}" loading="lazy">`
                          : `<div class="ph-logo"><img src="logo.png" alt="Langkatalk"></div>`}
                      </div>
                      <div class="fc-body">
                        <span class="chip">${esc(rel.category)}</span>
                        <h4 class="fc-title" style="font-size:16.5px">${esc(rel.title)}</h4>
                        <span class="mt">${esc(rel.author_name || 'Redaksi')} • ${fmt(rel.published_at)}</span>
                      </div>
                    </article>
                  `;
                }).join('')}
              </div>
            </section>
          ` : ''}
        </div>
      `);

      if ($('f-cmt')) {
        $('f-cmt').onsubmit = async (e) => {
          e.preventDefault();
          const btn = e.currentTarget.querySelector('button[type="submit"]');
          const name = $('cmt-name').value.trim();
          const rawPhone = $('cmt-phone').value.replace(/[\s\-()]/g, '');
          const body = $('cmt-body').value.trim();
          const agreed = $('cmt-agree').checked;
          $('cmt-err').textContent = '';
          $('cmt-ok').textContent = '';

          if (name.length < 3) {
            $('cmt-err').textContent = 'Nama wajib diisi minimal 3 karakter.';
            return;
          }
          if (!/^(08|\+62)[0-9]{8,13}$/.test(rawPhone) || rawPhone.length < 10 || rawPhone.length > 15) {
            $('cmt-err').textContent = 'No. HP wajib valid (10–15 digit angka, diawali 08 atau +62).';
            return;
          }
          if (body.length < 3 || body.length > 500) {
            $('cmt-err').textContent = 'Isi komentar wajib 3 hingga 500 karakter.';
            return;
          }
          if (!agreed) {
            $('cmt-err').textContent = 'Centang persetujuan terlebih dahulu.';
            return;
          }

          // Rate limit 30 detik per device per artikel
          const rateKey = `lk_cmt_rate_${a.id}`;
          const lastSent = Number(localStorage.getItem(rateKey) || 0);
          if (Date.now() - lastSent < 30000) {
            $('cmt-err').textContent = 'Tunggu 30 detik sebelum mengirim komentar lagi di berita ini.';
            return;
          }

          btn.disabled = true;
          const ins = await sb.from('comments').insert({
            article_id: a.id,
            guest_name: name,
            guest_phone: rawPhone,
            body,
            device_id: DEVICE_ID,
            status: 'menunggu'
          });
          btn.disabled = false;

          if (ins.error) {
            $('cmt-err').textContent = ins.error.message;
            return;

    /* ---------- AUTH (WAJIB EMAIL + LUPA SANDI) ---------- */
    function buildAuthErrorHint(err) {
      const msg = (err && err.message) ? String(err.message) : 'Terjadi kesalahan saat autentikasi.';
      const low = msg.toLowerCase();
      if (low.includes('invalid login credentials')) {
        return `${msg} — Periksa kembali alamat email dan kata sandi, atau klik "Lupa kata sandi? Reset lewat email".`;
      }
      if (low.includes('email not confirmed')) {
        return `${msg} — Email belum dikonfirmasi. Cek inbox/spam atau matikan Confirm email di Supabase saat uji coba.`;
      }
      if (low.includes('failed to fetch') || low.includes('network')) {
        return `${msg} — Koneksi atau proxy /supabase bermasalah. Periksa config.js dan vercel.json.`;
      }
      return msg;
    }
