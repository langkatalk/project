<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Tulis Berita – Langkatalk</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .t-wrap{max-width:900px;margin:24px auto 72px;padding:0 16px}
    .t-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .t-brand{display:flex;align-items:center;gap:11px}
    .t-brand img{width:38px;height:38px;border-radius:12px;object-fit:cover;box-shadow:0 6px 16px rgba(124,63,224,.18)}
    .t-brand h1{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;margin:0}
    .t-brand .sub{font-size:12px;color:var(--mute)}
    .t-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .t-card{background:rgba(255,255,255,.78);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(255,255,255,.92);border-radius:24px;padding:22px;box-shadow:0 16px 42px rgba(22,17,51,.07);margin-bottom:16px}
    .t-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .t-field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .t-field.full{grid-column:1 / -1}
    .t-field label.lbl{font-size:12px;font-weight:800;color:var(--ink)}
    .t-field input[type="text"],
    .t-field input[type="url"],
    .t-field select,
    .t-field textarea{width:100%;padding:11px 13px;border:1px solid rgba(22,17,51,.12);border-radius:12px;background:rgba(255,255,255,.88);color:var(--ink);font-family:inherit;font-size:13px;outline:none;transition:.15s}
    .t-field input:focus,.t-field select:focus,.t-field textarea:focus{border-color:var(--violet);background:#fff;box-shadow:0 0 0 3px rgba(124,63,224,.14)}

    .t-img-box{border:1.5px dashed rgba(124,63,224,.32);border-radius:16px;padding:14px;background:rgba(255,255,255,.65)}
    .t-img-info{font-size:12px;color:var(--mute);line-height:1.55;margin-top:8px}
    .t-img-preview{margin-top:12px;display:none}
    .t-img-preview img{max-width:100%;max-height:240px;border-radius:12px;object-fit:cover;display:block}

    .ql-wrapper{border:1px solid rgba(22,17,51,.12);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.92)}
    .ql-toolbar.ql-snow{border:0;border-bottom:1px solid rgba(22,17,51,.1);background:rgba(255,255,255,.78);padding:10px;font-family:'Plus Jakarta Sans',sans-serif}
    .ql-container.ql-snow{border:0;min-height:300px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;line-height:1.75;color:var(--ink)}
    .ql-editor{min-height:300px;padding:16px}
    .ql-editor.ql-blank::before{color:var(--mute);font-style:normal}
    .ql-editor blockquote{border-left:4px solid var(--violet);background:rgba(124,63,224,.06);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}

    .t-check-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
    .t-check{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.72);border:1px solid rgba(22,17,51,.1);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
    .t-check input[type="checkbox"]{width:16px;height:16px;margin:0;accent-color:var(--violet);cursor:pointer;flex-shrink:0}

    .t-foot-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(22,17,51,.08)}
    .t-foot-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto}
    .t-msg-err{color:var(--err);font-size:12px;font-weight:700;margin-top:10px}
    .t-msg-ok{color:#15803D;background:rgba(220,252,231,.85);border:1px solid #BBF7D0;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700;margin-top:10px}

    @media (max-width:720px){
      .t-grid{grid-template-columns:1fr}
      .t-check{white-space:normal}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const tulisState = {
      user: null,
      profile: null,
      coverUrl: '',
      quill: null
    };

    function getClient() {
      if (typeof getSupabase === 'function') {
        const client = getSupabase();
        if (client) return client;
      }
      const cfg = window.APP_CONFIG || {};
      if (window.supabase && cfg.SUPABASE_URL && cfg.SUPABASE_PUBLISHABLE_KEY) {
        return window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
      }
      return null;
    }

    function slugify(text) {
      return (text || '')
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .slice(0, 80) + '-' + Date.now().toString().slice(-4);
    }

    async function compressImageFile(file, maxWidth = 1280, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob(
              (blob) => {
                if (!blob) return reject(new Error('Gagal mengompres gambar.'));
                const outName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
                resolve(new File([blob], outName, { type: 'image/jpeg' }));
              },
              'image/jpeg',
              quality
            );
          };
          img.onerror = () => reject(new Error('File gambar tidak valid.'));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
        reader.readAsDataURL(file);
      });
    }

    async function handleCoverUpload(ev) {
      const file = ev.target.files?.[0];
      const infoEl = document.getElementById('tImgInfo');
      const errEl = document.getElementById('tErr');
      if (errEl) errEl.textContent = '';
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        if (errEl) errEl.textContent = 'Pilih file gambar (JPG, PNG, atau WebP).';
        return;
      }

      const rawKb = Math.round(file.size / 1024);
      if (infoEl) infoEl.textContent = `Memproses gambar (${rawKb} KB)...`;

      try {
        const compressed = await compressImageFile(file, 1280, 0.8);
        const compKb = Math.round(compressed.size / 1024);
        const sb = getClient();
        if (!sb) throw new Error('Koneksi Supabase belum siap.');

        const path = `covers/${Date.now()}-${compressed.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
        const { error: upErr } = await sb.storage
          .from('articles')
          .upload(path, compressed, { cacheControl: '3600', upsert: false });

        if (upErr) {
          throw new Error('Upload ke Storage gagal: ' + upErr.message);
        }

        const { data: pubData } = sb.storage.from('articles').getPublicUrl(path);
        const publicUrl = pubData?.publicUrl || '';
        tulisState.coverUrl = publicUrl;
        const urlInput = document.getElementById('tCoverUrl');
        if (urlInput) urlInput.value = publicUrl;

        const prevWrap = document.getElementById('tImgPreview');
        const prevImg = document.getElementById('tImgEl');
        if (prevWrap && prevImg && publicUrl) {
          prevImg.src = publicUrl;
          prevWrap.style.display = 'block';
        }
        if (infoEl) {
          infoEl.textContent = `Terunggah & terkompresi: ${rawKb} KB → ${compKb} KB (lebar maks 1280px, rasio 16:9 atau 4:3 disarankan).`;
        }
      } catch (err) {
        if (errEl) errEl.textContent = err.message;
        if (infoEl) {
          infoEl.textContent = 'Rasio disarankan 16:9 atau 4:3 • Ukuran file otomatis dikompresi maks lebar 1280px (kualitas 80%) sebelum diunggah.';
        }
      }
    }

    function initQuillEditor() {
      const container = document.getElementById('tQuillEditor');
      if (!container || !window.Quill) return;

      tulisState.quill = new Quill('#tQuillEditor', {
        theme: 'snow',
        placeholder: 'Tulis naskah berita lengkap di sini, gunakan toolbar di atas untuk heading, kutipan, daftar, warna, atau tautan...',
        modules: {
          toolbar: [
            [{ header: [1, 2, 3, false] }],
            [{ size: ['small', false, 'large', 'huge'] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ color: [] }, { background: [] }],
            [{ align: [] }],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['blockquote', 'code-block'],
            ['link', 'image'],
            ['clean']
          ]
        }
      });
    }

    async function handleSaveArticle(ev) {
      ev.preventDefault();
      const errEl = document.getElementById('tErr');
      const okEl = document.getElementById('tOk');
      if (errEl) errEl.textContent = '';
      if (okEl) { okEl.style.display = 'none'; okEl.textContent = ''; }

      const title = document.getElementById('tTitle').value.trim();
      const category = document.getElementById('tCategory').value;
      const authorName = document.getElementById('tAuthor').value.trim() || tulisState.profile?.full_name || tulisState.user?.email || 'Redaksi';
      const status = document.getElementById('tStatus').value;
      const description = document.getElementById('tDesc').value.trim();
      const coverUrl = document.getElementById('tCoverUrl').value.trim() || tulisState.coverUrl || null;
      const isExclusive = document.getElementById('tExclusive').checked;
      const isHeadline = document.getElementById('tHeadline').checked;

      const plainText = tulisState.quill ? tulisState.quill.getText().trim() : '';
      const bodyHtml = tulisState.quill ? tulisState.quill.root.innerHTML.trim() : '';

      if (!title) {
        if (errEl) errEl.textContent = 'Judul berita wajib diisi.';
        return;
      }
      if (!plainText) {
        if (errEl) errEl.textContent = 'Isi berita belum ditulis.';
        return;
      }

      const sb = getClient();
      if (!sb) {
        if (errEl) errEl.textContent = 'Koneksi Supabase belum siap.';
        return;
      }

      const payload = {
        title,
        slug: slugify(title),
        category,
        author_name: authorName,
        author_id: tulisState.user?.id || null,
        status,
        description: description || null,
        cover_url: coverUrl,
        body: bodyHtml,
        is_exclusive: isExclusive,
        is_headline: isHeadline,
        published_at: status === 'terbit' ? new Date().toISOString() : null
      };

      const { error } = await sb.from('articles').insert(payload);
      if (error) {
        if (errEl) errEl.textContent = 'Gagal menyimpan berita: ' + error.message;
        return;
      }

      if (okEl) {
        okEl.style.display = 'block';
        okEl.textContent = status === 'terbit'
          ? 'Berita berhasil diterbitkan ke database Supabase!'
          : 'Berita berhasil disimpan sebagai draft ke database Supabase!';
      }
    }

    function renderTulisPage() {
      const root = document.getElementById('root');
      if (!tulisState.user) {
        root.innerHTML = `
          <div class="t-wrap">
            <div class="t-card" style="max-width:440px;margin:48px auto;text-align:center">
              <h1 style="font-family:'Sora',sans-serif;font-size:20px;margin:0 0 8px">Akses Terbatas Redaksi</h1>
              <p style="font-size:13px;color:var(--mute);margin:0 0 18px">Silakan masuk terlebih dahulu melalui Ruang Redaksi untuk menulis atau menerbitkan berita.</p>
              <a class="go" href="redaksi.html">Masuk ke Ruang Redaksi</a>
            </div>
          </div>
        `;
        return;
      }

      const defaultAuthor = tulisState.profile?.full_name || tulisState.user.email || '';

      root.innerHTML = `
        <div class="t-wrap">
          <div class="t-top">
            <div class="t-brand">
              <img src="favicon.png" alt="Langkatalk">
              <div>
                <h1>Tulis Berita</h1>
                <div class="sub">Masuk sebagai ${esc(defaultAuthor)}</div>
              </div>
            </div>
            <div class="t-actions">
              <a class="pill" href="index.html">Beranda</a>
              <a class="pill" href="redaksi.html">Ruang Redaksi</a>
            </div>
          </div>

          <form class="t-card" onsubmit="handleSaveArticle(event)">
            <div class="t-grid">
              <div class="t-field full">
                <label class="lbl" for="tTitle">Judul Berita</label>
                <input id="tTitle" type="text" required placeholder="Tulis judul berita yang kuat dan jelas">
              </div>

              <div class="t-field">
                <label class="lbl" for="tCategory">Kategori</label>
                <select id="tCategory">
                  <option value="Investigasi">Investigasi</option>
                  <option value="Ruang Gelap">Ruang Gelap</option>
                  <option value="Politik">Politik</option>
                  <option value="Panggung">Panggung</option>
                  <option value="Ekonomi Gelap">Ekonomi Gelap</option>
                  <option value="Opini">Opini</option>
                </select>
              </div>

              <div class="t-field">
                <label class="lbl" for="tStatus">Status Publikasi</label>
                <select id="tStatus">
                  <option value="terbit">Terbitkan Langsung</option>
                  <option value="draft">Simpan sebagai Draft</option>
                </select>
              </div>

              <div class="t-field">
                <label class="lbl" for="tAuthor">Nama Penulis</label>
                <input id="tAuthor" type="text" value="${esc(defaultAuthor)}" placeholder="Nama penulis">
              </div>

              <div class="t-field">
                <label class="lbl" for="tCoverUrl">URL Gambar Sampul (Opsional)</label>
                <input id="tCoverUrl" type="url" placeholder="https://... atau isi otomatis dari unggahan">
              </div>

              <div class="t-field full">
                <label class="lbl" for="tDesc">Ringkasan / Lead Singkat</label>
                <textarea id="tDesc" rows="2" style="min-height:64px" placeholder="Ringkasan singkat 1-2 kalimat untuk kartu feed dan pratinjau"></textarea>
              </div>

              <div class="t-field full">
                <label class="lbl">Gambar Sampul &amp; Kompresi Otomatis</label>
                <div class="t-img-box">
                  <input id="tCoverFile" type="file" accept="image/*" onchange="handleCoverUpload(event)">
                  <div id="tImgInfo" class="t-img-info">
                    Rasio disarankan 16:9 atau 4:3 • Ukuran file otomatis dikompresi maks lebar 1280px (kualitas 80%) sebelum diunggah.
                  </div>
                  <div id="tImgPreview" class="t-img-preview">
                    <img id="tImgEl" alt="Pratinjau Sampul">
                  </div>
                </div>
              </div>

              <div class="t-field full">
                <label class="lbl">Isi Berita (Editor Lengkap)</label>
                <div class="ql-wrapper">
                  <div id="tQuillEditor"></div>
                </div>
              </div>

              <div class="t-field full">
                <div class="t-check-row">
                  <label class="t-check">
                    <input id="tHeadline" type="checkbox">
                    <span>Jadikan Berita Utama (Hero)</span>
                  </label>
                  <label class="t-check">
                    <input id="tExclusive" type="checkbox">
                    <span>Tandai Eksklusif</span>
                  </label>
                </div>
              </div>
            </div>

            <div id="tErr" class="t-msg-err"></div>
            <div id="tOk" class="t-msg-ok" style="display:none"></div>

            <div class="t-foot-bar">
              <a class="pill" href="redaksi.html">Batal</a>
              <div class="t-foot-right">
                <button type="submit" class="go">Simpan Berita</button>
              </div>
            </div>
          </form>
        </div>
      `;

      initQuillEditor();
    }

    (async function initTulis() {
      const sb = getClient();
      if (sb && sb.auth) {
        try {
          const { data } = await sb.auth.getSession();
          tulisState.user = data?.session?.user || null;
          if (tulisState.user) {
            const { data: prof } = await sb
              .from('profiles')
              .select('*')
              .eq('id', tulisState.user.id)
              .single();
            tulisState.profile = prof || null;
          }
        } catch (_) {}
      }
      renderTulisPage();
    })();
  </script>
</body>
</html>
