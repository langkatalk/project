<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Ruang Redaksi – Langkatalk</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <header class="rd-header">
    <a class="rd-logo" href="index.html">
      <img src="favicon.png" alt="" width="28" height="28">
      <span><b>Ruang Redaksi</b><small>Langkatalk</small></span>
    </a>
    <div class="rd-aksi-kanan" id="aksiKanan" hidden>
      <a class="btn btn-utama btn-kecil" href="tulis.html">+ Tulis</a>
      <button type="button" class="btn btn-keluar btn-kecil" id="btnKeluar">Keluar</button>
    </div>
  </header>

  <!-- Halaman masuk -->
  <main class="rd-masuk" id="layarMasuk">
    <section class="rd-kartu">
      <h1 class="rd-judul">Masuk Redaksi</h1>
      <p class="rd-catatan">Masuk dengan akun tim Langkatalk.</p>
      <form id="formMasuk" novalidate>
        <label class="rd-label">Email
          <input id="mEmail" type="email" autocomplete="username" placeholder="nama@email.com" required>
        </label>
        <label class="rd-label">Kata sandi
          <input id="mSandi" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </label>
        <p class="rd-err" id="mErr"></p>
        <button type="submit" class="btn btn-utama rd-tombol-lebar" id="mKirim">Masuk</button>
      </form>
      <button type="button" class="rd-tautan" id="btnLupaSandi">Lupa kata sandi?</button>
    </section>
  </main>

  <!-- Dashboard (diisi setelah masuk) -->
  <main class="rd-app" id="layarApp" hidden>
    <section class="rd-profil" id="profil"></section>
    <nav class="rd-tab" id="tabs" aria-label="Menu redaksi"></nav>
    <section class="rd-isi" id="isi"></section>
  </main>

  <div id="toast" class="lk-toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
