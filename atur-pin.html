<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atur Zona PIN | Langkatalk</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/siaga.css">
<style>
  .pn-wrap { max-width: 820px; margin: 0 auto; padding: 16px; font-family: 'Plus Jakarta Sans', sans-serif; color: #1d1640; }
  .pn-kaca { background: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.95); border-radius: 22px; padding: 20px; margin-top: 14px; box-shadow: 0 14px 34px rgba(45,30,110,.08); }
  .pn-judul { font: 800 24px/1.2 'Sora', sans-serif; margin: 0 0 6px; }
  .pn-catatan { font-size: 13px; color: #5b5478; margin: 4px 0 0; line-height: 1.6; }
  .pn-kartu { border: 1px solid #ECE8FF; border-radius: 18px; padding: 14px; margin-top: 12px; background: #fff; }
  .pn-atas { display: flex; gap: 12px; align-items: center; }
  .pn-gambar { width: 120px; aspect-ratio: 2 / 1; border-radius: 12px; overflow: hidden; background: #EEF3FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pn-gambar img { width: 100%; height: 100%; object-fit: cover; }
  .pn-gambar span { font-size: 11px; color: #5b5478; }
  .pn-info { flex: 1; min-width: 0; }
  .pn-info b { display: block; font-size: 15px; }
  .pn-info small { font-size: 12px; color: #5b5478; }
  .pn-urut button { min-width: 34px; min-height: 34px; border-radius: 10px; border: 1.5px solid #E4DEFF; background: #fff; cursor: pointer; }
  .pn-urut button:disabled { opacity: .4; cursor: default; }
  .pn-label { display: block; font-weight: 700; font-size: 13px; margin-top: 10px; }
  .pn-input { width: 100%; min-height: 40px; margin-top: 4px; padding: 8px 10px; border-radius: 12px; border: 1.5px solid #E4DEFF; background: #fff; font: inherit; box-sizing: border-box; }
  .pn-baris { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  .pn-cek { font-weight: 700; font-size: 13px; display: flex; gap: 6px; align-items: center; min-height: 40px; }
  .pn-aksi { display: flex; gap: 8px; margin-top: 12px; }
  .pn-tombol { min-height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: linear-gradient(135deg,#5A2FCF,#2D5CF0); color: #fff; font: 800 14px 'Sora', sans-serif; cursor: pointer; }
  .pn-hapus { min-height: 40px; padding: 0 14px; border: 1.5px solid #FECACA; border-radius: 12px; background: #fff; color: #B91C1C; font: 700 13px 'Plus Jakarta Sans', sans-serif; cursor: pointer; }
  .pn-err { color: #B91C1C; font-weight: 700; min-height: 20px; }
  .pn-ok { color: #047857; font-weight: 700; min-height: 20px; }
  @media (max-width: 600px) { .pn-baris { grid-template-columns: 1fr; } .pn-gambar { width: 90px; } }
</style>
</head>
<body style="margin:0;background:#F3F0FF">
<main class="pn-wrap">
  <section class="pn-kaca" id="pnAkses"><p>Memuat…</p></section>

  <section class="pn-kaca" id="pnPanel" hidden>
    <h1 class="pn-judul">Atur Zona PIN</h1>
    <p class="pn-catatan">Ini kartu yang tampil di atas feed beranda. Urutan ▲ ▼ menentukan letaknya. Masa aktif "24 jam" atau "7 hari" dihitung dari saat disimpan, lalu kartu hilang otomatis.</p>
    <p class="pn-err" id="pnErr"></p>
    <p class="pn-ok" id="pnOk"></p>
    <div id="pnDaftar"></div>

    <details class="pn-kaca" style="margin-top:18px">
      <summary style="font-weight:800;cursor:pointer">+ Tambah PIN baru</summary>
      <label class="pn-label">Judul<input class="pn-input" id="pnBaruJudul" maxlength="60"></label>
      <label class="pn-label">Deskripsi singkat<input class="pn-input" id="pnBaruDeskripsi" maxlength="140"></label>
      <label class="pn-label">Tujuan saat diklik<input class="pn-input" id="pnBaruTujuan" placeholder="contoh: halaman-saya.html atau https://..."></label>
      <label class="pn-label">Gambar (akan dipotong 2:1)<input class="pn-input" type="file" id="pnBaruFoto" accept="image/*"></label>
      <div class="pn-baris" style="margin-top:10px">
        <label class="pn-label">Ukuran<select class="pn-input" id="pnBaruUkuran"><option value="besar">Besar</option><option value="sedang" selected>Sedang</option><option value="kecil">Kecil</option></select></label>
        <label class="pn-label">Masa aktif<select class="pn-input" id="pnBaruMasa"><option value="selamanya" selected>Selamanya</option><option value="24jam">24 jam dari sekarang</option><option value="7hari">7 hari dari sekarang</option></select></label>
        <label class="pn-cek"><input type="checkbox" id="pnBaruAktif" checked> Tampilkan</label>
      </div>
      <div class="pn-aksi"><button type="button" class="pn-tombol" id="pnBaruSimpan">Tambahkan PIN</button></div>
    </details>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/sesi.js"></script>
<script src="js/atur-pin.js"></script>
</body>
</html>
