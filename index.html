</div>

  <div class="dlg" id="dlg" role="dialog" aria-modal="true">

  <button type="button" class="fab-top hide" id="fab-top" aria-label="Kembali ke atas" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <div class="toast" id="ts" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let allPublished = [];
    let visibleCount = 10;
    let loadingMore = false;
    let currentDetailArticle = null;

    function parseIndexRoute() {
      const hash = location.hash || '#/';
      const m = hash.match(/^#\/baca\/(.+)$/);
      if (m) return { mode: 'detail', slug: decodeURIComponent(m[1]) };
      if (hash.startsWith('#/artikel-')) return { mode: 'detail', slug: decodeURIComponent(hash.replace('#/artikel-', '')) };
      return { mode: 'feed', slug: '' };
    }

    async function renderIndexRoute() {
      $('root').classList.remove('page-enter');
      void $('root').offsetWidth;
      $('root').classList.add('page-enter');

      const rt = parseIndexRoute();
      if (rt.mode === 'detail') return renderDetailPage(rt.slug);
      return renderFeedPage();
    }
    addEventListener('hashchange', renderIndexRoute);

    function skeletonFeed(n = 2) {
      return Array.from({ length: n }).map(() => `
        <div class="sk-card">
          <div class="sk-img"></div>
          <div class="sk-line" style="width:72%"></div>
          <div class="sk-line" style="width:45%"></div>
        </div>
      `).join('');
    }

    async function renderFeedPage() {
      updateSeoMeta({
        title: 'Langkatalk – Menghubungkan Cerita Langkat',
        description: 'Bongkar Atraksi Ruang Gelap. Portal berita investigasi dan cerita Langkat.',
        image: `${location.origin}/logo.png`,
        url: `${location.origin}/`
      });

      $('root').innerHTML = renderPublicShell(`<div class="wrap" style="margin-top:14px">${skeletonFeed(2)}</div>`);
      if (!ltReady) {
        $('root').innerHTML = renderPublicShell(`<div class="wrap"><div class="empty" style="margin-top:16px">Supabase belum tersambung. Cek <code>config.js</code>.</div></div>`);
        return;
      }

      await Promise.all([loadCurrentUser(), loadSiteExtras()]);
      allPublished = await fetchPublishedArticles(60);
      visibleCount = 10;
      paintFeedList();
    }

    function getFilteredFeed() {
      let list = [...allPublished];
      if (ltState.cat === '__saved') list = list.filter((a) => ltState.savedIds.has(a.id));
      else if (ltState.cat) list = list.filter((a) => a.category === ltState.cat);

      if (ltState.tag) {
        list = list.filter((a) => Array.isArray(a.tags) && a.tags.includes(ltState.tag));
      }
      if (ltState.q) {
        const q = ltState.q.toLowerCase();
        list = list.filter((a) =>
          (a.title || '').toLowerCase().includes(q) ||
          (a.description || '').toLowerCase().includes(q) ||
          (a.body || '').toLowerCase().includes(q)
        );
      }
      return list;
    }

    function paintFeedList() {
      const filtered = getFilteredFeed();
      const hasFilter = Boolean(ltState.cat || ltState.tag || ltState.q);
      const heroArt = (!hasFilter && filtered.length > 0) ? filtered[0] : null;
      const pool = heroArt ? filtered.slice(1) : filtered;
      const items = pool.slice(0, visibleCount);
      const hasMore = pool.length > visibleCount;

      const heroHtml = heroArt ? `
        <article class="hero" onclick="location.hash='#/baca/${encodeURIComponent(heroArt.slug || heroArt.id)}'">
          <div class="hero-bg">
            ${heroArt.cover_image
              ? `<img src="${esc(heroArt.cover_image)}" srcset="${esc(heroArt.cover_image)} 1200w" sizes="(max-width:767px) 100vw, 1000px" alt="${esc(heroArt.title)}" width="1200" height="600" decoding="async">`
              : ''}
          </div>
          <div class="hero-body">
            <div class="hero-subtag">Bongkar Atraksi Ruang Gelap</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${heroArt.is_exclusive ? '<span class="chip ex">EKSKLUSIF</span>' : ''}
              <span class="chip glass-dark">${esc(heroArt.category)}</span>
            </div>
            <h1>${esc(heroArt.title)}</h1>
            <p>${esc(heroArt.description || stripHtmlText(heroArt.body).slice(0, 140))}</p>
            <div class="hero-meta">
              <span><b>${esc(heroArt.author_name || 'Redaksi')}</b></span>
              <span>• ${fmtDate(heroArt.published_at)}</span>
              <span>• ${readMinutes(heroArt.body)} mnt baca</span>
            </div>
          </div>
        </article>
      ` : '';

      const cardsHtml = items.map((a, idx) => {
        const slugOrId = a.slug || a.id;
        const isLiked = ltState.likedIds.has(a.id);
        const isSaved = ltState.savedIds.has(a.id);
        const initial = (a.author_name || 'L').trim().charAt(0).toUpperCase();
        const excerpt = esc(a.description || stripHtmlText(a.
