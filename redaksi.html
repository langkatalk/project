<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Ruang Redaksi – Langkatalk</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .r-wrap{max-width:1120px;margin:22px auto 64px;padding:0 18px}
    .r-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
    .r-brand{display:flex;align-items:center;gap:12px}
    .r-brand img{width:40px;height:40px;border-radius:12px;object-fit:cover;box-shadow:var(--shadow-sm)}
    .r-brand h1{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;margin:0}
    .r-brand .sub{font-size:12px;color:var(--mute)}
    .r-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .btn-grad-dark{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:9px 16px;border-radius:999px;border:0;
      background:linear-gradient(135deg,#1E293B 0%,#0F172A 100%);
      color:#fff !important;text-decoration:none;
      font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;
      cursor:pointer;box-shadow:0 8px 20px rgba(15,23,42,.26);transition:.15s
    }
    .btn-grad-dark:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .r-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .r-tab{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
    .r-tab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(95,111,238,.28)}
    .r-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
    .r-stat{background:rgba(255,255,255,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.85);border-radius:18px;padding:14px 16px;box-shadow:0 10px 30px rgba(22,17,51,.06)}
    .r-stat .k{font-size:12px;color:var(--mute);font-weight:700}
    .r-stat .v{font-family:'Sora',sans-serif;font-size:24px;font-weight:800;margin-top:4px;color:var(--ink)}
    .r-card{background:rgba(255,255,255,.76);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.88);border-radius:22px;padding:18px;box-shadow:0 14px 36px rgba(22,17,51,.07);margin-bottom:16px}
    .r-card h2{font-family:'Sora',sans-serif;font-size:16px;margin:0 0 12px}
    .r-table-wrap{overflow-x:auto}
    table.r-tbl{width:100%;border-collapse:collapse;font-size:13px}
    table.r-tbl th,table.r-tbl td{padding:10px 10px;border-bottom:1px solid rgba(22,17,51,.08);text-align:left;vertical-align:top}
    table.r-tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:800}
    .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
    .b-terbit{background:#DCFCE7;color:#166534}
    .b-draft{background:#FEF9C3;color:#854D0E}
    .b-arsip{background:#E2E8F0;color:#334155}
    .b-pending{background:#FFEDD5;color:#9A3412}
    .r-row-act{display:flex;flex-wrap:wrap;gap:6px}
    .btn-xs{border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
    .btn-xs:hover{border-color:var(--violet)}
    .btn-xs.pri{background:var(--grad);color:#fff;border:0}
    .btn-xs.del{background:#FEE2E2;color:#991B1B;border-color:#FECACA}
    .r-notice{margin-bottom:12px;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:700;display:none}
    .r-notice.err{display:block;background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}
    .r-notice.ok{display:block;background:#DCFCE7;color:#166534;border:1px solid #BBF7D0}
    .r-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .r-field{display:flex;flex-direction:column;gap:6px}
    .r-field.full{grid-column:1 / -1}
    .r-field label{font-size:12px;font-weight:700;color:var(--ink)}
    .r-field input,.r-field select,.r-field textarea{width:100%;padding:11px 13px;border:1px solid rgba(22,17,51,.12);border-radius:12px;background:rgba(255,255,255,.86);color:var(--ink);font-family:inherit;font-size:13px;outline:none;transition:.15s}
    .r-field input:focus,.r-field select:focus,.r-field textarea:focus{border-color:var(--violet);background:#fff;box-shadow:0 0 0 3px rgba(124,63,224,.14)}
    .r-field textarea{min-height:84px;resize:vertical}

    .glass-auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    .glass-auth-card{width:100%;max-width:410px;background:rgba(255,255,255,.78);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.92);border-radius:26px;padding:28px 24px;box-shadow:0 20px 50px rgba(22,17,51,.09)}
    .glass-auth-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .glass-brand{display:flex;align-items:center;gap:11px}
    .glass-brand img{width:40px;height:40px;border-radius:13px;object-fit:cover;box-shadow:0 6px 16px rgba(124,63,224,.18)}
    .glass-auth-card h1{font-family:'Sora',sans-serif;font-size:21px;font-weight:800;margin:0 0 6px;color:var(--ink)}
    .glass-auth-card p.lead{font-size:13px;color:var(--mute);margin:0 0 18px;line-height:1.5}
    .auth-row-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;margin-bottom:14px}
    .link-btn{background:none;border:0;padding:0;font-family:inherit;font-size:12px;font-weight:700;color:var(--violet);cursor:pointer}
    .link-btn:hover{text-decoration:underline}
    .auth-msg-err{color:var(--err);font-size:12px;font-weight:700;margin-bottom:12px}
    .auth-msg-ok{color:#15803D;background:rgba(220,252,231,.8);border:1px solid #BBF7D0;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;margin-bottom:12px}

    @media (max-width:820px){
      .r-grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .r-form-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const redaksiState = {
      user: null,
      profile: null,
      authMode: 'login',
      tab: 'artikel',
      articles: [],
      comments: [],
      ads: [],
      settings: {},
      notice: null
    };

    function rEsc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function rFmtDate(d) {
      if (!d) return '-';
      const dt = new Date(d);
      if (Number.isNaN(dt.getTime())) return String(d);
      return dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function setNotice(type, text) {
      redaksiState.notice = { type, text };
      renderRedaksiPage();
    }

    function isDirectorOrEditor() {
      const role = (redaksiState.profile?.role || '').toLowerCase();
      return ['direktur', 'pemred', 'admin', 'owner'].includes(role);
    }

    function getClient() {
      if (typeof getSupabase === 'function') {
        const client = getSupabase();
        if (client) return client;
      }
      const cfg = window.APP_CONFIG || {};
      if (window.supabase && cfg.SUPABASE_URL && cfg.SUPABASE_PUBLISHABLE_KEY) {
        return window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
      }
      return null;
    }

    async function loadRedaksiSession() {
      const sb = getClient();
      if (!sb || !sb.auth) {
        redaksiState.user = null;
        redaksiState.profile = null;
        return;
      }
      try {
        const { data } = await sb.auth.getSession();
        redaksiState.user = data?.session?.user || null;
        if (redaksiState.user) {
          const { data: prof } = await sb
            .from('profiles')
            .select('*')
            .eq('id', redaksiState.user.id)
            .maybeSingle();
          redaksiState.profile = prof || {
            id: redaksiState.user.id,
            full_name: redaksiState.user.email,
            role: 'penulis'
          };
        } else {
          redaksiState.profile = null;
        }
      } catch (_) {
        redaksiState.user = null;
        redaksiState.profile = null;
      }
    }

    async function loadRedaksiData() {
      const sb = getClient();
      if (!sb) return;
      const [artRes, comRes, adRes, setRes] = await Promise.all([
        sb.from('articles').select('*').order('created_at', { ascending: false }),
        sb.from('comments').select('*').order('created_at', { ascending: false }),
        sb.from('ads').select('*').order('created_at', { ascending: false }),
        sb.from('site_settings').select('*')
      ]);

      redaksiState.articles = artRes.data || [];
      redaksiState.comments = comRes.data || [];
      redaksiState.ads = adRes.data || [];

      const settingsMap = {};
      (setRes.data || []).forEach(row => {
        settingsMap[row.key] = row.value;
      });
      redaksiState.settings = settingsMap;
    }

    async function handleRedaksiLogin(ev) {
      ev.preventDefault();
      const email = document.getElementById('rEmail').value.trim();
      const password = document.getElementById('rPassword').value;
      const errEl = document.getElementById('rAuthErr');
      if (errEl) errEl.textContent = '';

      const sb = getClient();
      if (!sb) {
        if (errEl) errEl.textContent = 'Koneksi Supabase belum siap. Periksa config.js.';
        return;
      }

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        if (errEl) errEl.textContent = 'Gagal masuk: ' + error.message;
        return;
      }
      redaksiState.authMode = 'login';
      await loadRedaksiSession();
      await loadRedaksiData();
      renderRedaksiPage();
    }

    async function handleForgotPassword(ev) {
      ev.preventDefault();
      const email = document.getElementById('rResetEmail').value.trim();
      const errEl = document.getElementById('rAuthErr');
      const okEl = document.getElementById('rAuthOk');
      if (errEl) errEl.textContent = '';
      if (okEl) { okEl.style.display = 'none'; okEl.textContent = ''; }

      const sb = getClient();
      if (!sb) {
        if (errEl) errEl.textContent = 'Koneksi Supabase belum siap. Periksa config.js.';
        return;
      }

      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/redaksi.html'
      });

      if (error) {
        if (errEl) errEl.textContent = 'Gagal mengirim tautan reset: ' + error.message;
        return;
      }

      if (okEl) {
        okEl.style.display = 'block';
        okEl.textContent = 'Tautan reset kata sandi telah dikirim ke ' + email + '.';
      }
    }

    async function handleUpdateRecoveredPassword(ev) {
      ev.preventDefault();
      const newPassword = document.getElementById('rNewPassword').value;
      const confirmPassword = document.getElementById('rConfirmPassword').value;
      const errEl = document.getElementById('rAuthErr');
      if (errEl) errEl.textContent = '';

      if (newPassword.length < 6) {
        if (errEl) errEl.textContent = 'Kata sandi baru minimal 6 karakter.';
        return;
      }
      if (newPassword !== confirmPassword) {
        if (errEl) errEl.textContent = 'Konfirmasi kata sandi belum sama.';
        return;
      }

      const sb = getClient();
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if (error) {
        if (errEl) errEl.textContent = 'Gagal memperbarui kata sandi: ' + error.message;
        return;
      }

      redaksiState.authMode = 'login';
      await loadRedaksiSession();
      await loadRedaksiData();
      renderRedaksiPage();
    }

    async function handleRedaksiLogout() {
      const sb = getClient();
      if (sb) await sb.auth.signOut();
      redaksiState.user = null;
      redaksiState.profile = null;
      redaksiState.authMode = 'login';
      renderRedaksiPage();
    }

    async function setArticleStatus(id, status) {
      const sb = getClient();
      if (!sb) return setNotice('err', 'Koneksi Supabase tidak tersedia.');
      const payload = { status };
      if (status === 'terbit') {
        payload.published_at = new Date().toISOString();
      }
      const { error } = await sb.from('articles').update(payload).eq('id', id);
      if (error) {
        return setNotice('err', 'Gagal mengubah status (' + status + '): ' + error.message);
      }
      await loadRedaksiData();
      setNotice('ok', 'Status artikel diubah menjadi "' + status + '".');
    }

    async function deleteArticleRow(id) {
      if (!confirm('Hapus artikel ini secara permanen?')) return;
      const sb = getClient();
      if (!sb) return setNotice('err', 'Koneksi Supabase tidak tersedia.');
      const { error } = await sb.from('articles').delete().eq('id', id);
      if (error) {
        return setNotice('err', 'Gagal menghapus artikel: ' + error.message);
      }
      await loadRedaksiData();
      setNotice('ok', 'Artikel berhasil dihapus.');
    }

    async function setCommentStatus(id, status) {
      const sb = getClient();
      if (!sb) return;
      const { error } = await sb.from('comments').update({ status }).eq('id', id);
      if (error) return setNotice('err', 'Gagal memoderasi komentar: ' + error.message);
      await loadRedaksiData();
      setNotice('ok', 'Status komentar diperbarui.');
    }

    async function deleteCommentRow(id) {
      if (!confirm('Hapus komentar ini?')) return;
      const sb = getClient();
      if (!sb) return;
      const { error } = await sb.from('comments').delete().eq('id', id);
      if (error) return setNotice('err', 'Gagal menghapus komentar: ' + error.message);
      await loadRedaksiData();
      setNotice('ok', 'Komentar dihapus.');
    }

    async function saveAdRow(ev) {
      ev.preventDefault();
      const sb = getClient();
      if (!sb) return;
      const { error } = await sb.from('ads').insert({
        title: document.getElementById('adTitle').value.trim(),
        placement: document.getElementById('adPlacement').value,
        image_url: document.getElementById('adImageUrl').value.trim() || null,
        target_url: document.getElementById('adTargetUrl').value.trim() || null,
        ad_code: document.getElementById('adCode').value.trim() || null,
        is_active: document.getElementById('adActive').checked
      });
      if (error) return setNotice('err', 'Gagal menyimpan iklan: ' + error.message);
      ev.target.reset();
      await loadRedaksiData();
      setNotice('ok', 'Iklan tersimpan.');
    }

    async function toggleAdActive(id, currentActive) {
      const sb = getClient();
      if (!sb) return;
      const { error } = await sb.from('ads').update({ is_active: !currentActive }).eq('id', id);
      if (error) return setNotice('err', 'Gagal mengubah status iklan: ' + error.message);
      await loadRedaksiData();
      setNotice('ok', 'Status iklan diperbarui.');
    }

    async function deleteAdRow(id) {
      if (!confirm('Hapus slot iklan ini?')) return;
      const sb = getClient();
      if (!sb) return;
      const { error } = await sb.from('ads').delete().eq('id', id);
      if (error) return setNotice('err', 'Gagal menghapus iklan: ' + error.message);
      await loadRedaksiData();
      setNotice('ok', 'Iklan dihapus.');
    }

    async function saveSiteSettings(ev) {
      ev.preventDefault();
      const sb = getClient();
      if (!sb) return;
      const pairs = [
        { key: 'site_title', value: document.getElementById('setTitle').value.trim() },
        { key: 'tagline', value: document.getElementById('setTagline').value.trim() },
        { key: 'subtag', value: document.getElementById('setSubtag').value.trim() }
      ];
      for (const item of pairs) {
        const { error } = await sb.from('site_settings').upsert({ key: item.key, value: item.value }, { onConflict: 'key' });
        if (error) return setNotice('err', 'Gagal menyimpan pengaturan: ' + error.message);
      }
      await loadRedaksiData();
      setNotice('ok', 'Pengaturan situs tersimpan.');
    }

    function renderLoginView() {
      const isForgot = redaksiState.authMode === 'forgot';
      const isRecovery = redaksiState.authMode === 'recovery';

      let formHtml = '';
      if (isRecovery) {
        formHtml = `
          <h1>Atur Kata Sandi Baru</h1>
          <p class="lead">Masukkan kata sandi baru untuk akun redaksi kamu.</p>
          <form onsubmit="handleUpdateRecoveredPassword(event)">
            <div class="r-field" style="margin-bottom:12px">
              <label for="rNewPassword">Kata Sandi Baru</label>
              <input id="rNewPassword" type="password" required minlength="6" placeholder="Minimal 6 karakter">
            </div>
            <div class="r-field" style="margin-bottom:14px">
              <label for="rConfirmPassword">Konfirmasi Kata Sandi Baru</label>
              <input id="rConfirmPassword" type="password" required minlength="6" placeholder="Ulangi kata sandi baru">
            </div>
            <div id="rAuthErr" class="auth-msg-err"></div>
            <button type="submit" class="go" style="width:100%;justify-content:center">Simpan Kata Sandi</button>
          </form>
        `;
      } else if (isForgot) {
        formHtml = `
          <h1>Lupa Kata Sandi</h1>
          <p class="lead">Masukkan email akun redaksi yang terdaftar di Supabase.</p>
          <form onsubmit="handleForgotPassword(event)">
            <div class="r-field" style="margin-bottom:14px">
              <label for="rResetEmail">Email Redaksi</label>
              <input id="rResetEmail" type="email" required placeholder="nama@email.com">
            </div>
            <div id="rAuthErr" class="auth-msg-err"></div>
            <div id="rAuthOk" class="auth-msg-ok" style="display:none"></div>
            <button type="submit" class="go" style="width:100%;justify-content:center">Kirim Link Reset ke Email</button>
          </form>
          <div style="margin-top:14px;text-align:center">
            <button type="button" class="link-btn" onclick="redaksiState.authMode='login';renderRedaksiPage()">← Kembali ke Halaman Masuk</button>
          </div>
        `;
      } else {
        formHtml = `
          <h1>Masuk Redaksi</h1>
          <p class="lead">Masuk menggunakan akun tim redaksi yang terhubung dengan Supabase.</p>
          <form onsubmit="handleRedaksiLogin(event)">
            <div class="r-field" style="margin-bottom:12px">
              <label for="rEmail">Email</label>
              <input id="rEmail" type="email" required placeholder="redaksi@langkatalk.id">
            </div>
            <div class="r-field" style="margin-bottom:6px">
              <label for="rPassword">Kata Sandi</label>
              <input id="rPassword" type="password" required placeholder="••••••••">
            </div>
            <div class="auth-row-meta">
              <span style="font-size:11px;color:var(--mute)">Supabase Auth</span>
              <button type="button" class="link-btn" onclick="redaksiState.authMode='forgot';renderRedaksiPage()">Lupa kata sandi?</button>
            </div>
            <div id="rAuthErr" class="auth-msg-err"></div>
            <button type="submit" class="go" style="width:100%;justify-content:center">Masuk ke Ruang Redaksi</button>
          </form>
        `;
      }

      document.getElementById('root').innerHTML = `
        <div class="glass-auth-wrap">
          <div class="glass-auth-card">
            <div class="glass-auth-head">
              <div class="glass-brand">
                <img src="favicon.png" alt="Langkatalk">
                <div>
                  <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:15px">Langkatalk</div>
                  <div style="font-size:12px;color:var(--mute)">Ruang Redaksi</div>
                </div>
              </div>
              <a href="index.html" style="font-size:12px;font-weight:700;color:var(--mute)">← Beranda</a>
            </div>
            ${formHtml}
          </div>
        </div>
      `;
    }

    function renderArticlesTab() {
      const rows = redaksiState.articles.map(a => {
        const st = (a.status || 'draft').toLowerCase();
        const badgeCls = st === 'terbit' ? 'b-terbit' : (st === 'arsip' ? 'b-arsip' : 'b-draft');
        const idAttr = rEsc(a.id);
        return `
          <tr>
            <td>
              <div style="font-weight:700">${rEsc(a.title || '(Tanpa judul)')}</div>
              <div style="font-size:11px;color:var(--mute)">${rEsc(a.category || 'Umum')} • ${rEsc(a.author_name || 'Redaksi')}</div>
            </td>
            <td><span class="badge ${badgeCls}">${rEsc(st)}</span></td>
            <td>${Number(a.views || 0)}</td>
            <td style="font-size:12px;color:var(--mute)">${rFmtDate(a.created_at)}</td>
            <td>
              <div class="r-row-act">
                <button type="button" class="btn-xs pri" data-art-act="status" data-art-id="${idAttr}" data-art-status="terbit">Terbitkan</button>
                <button type="button" class="btn-xs" data-art-act="status" data-art-id="${idAttr}" data-art-status="draft">Draft</button>
                <button type="button" class="btn-xs" data-art-act="status" data-art-id="${idAttr}" data-art-status="arsip">Arsip</button>
                <button type="button" class="btn-xs del" data-art-act="delete" data-art-id="${idAttr}">Hapus</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <div class="r-card">
          <h2>Daftar Artikel &amp; Status</h2>
          <div class="r-table-wrap">
            <table class="r-tbl">
              <thead>
                <tr>
                  <th>Judul</th>
                  <th>Status</th>
                  <th>Dibaca</th>
                  <th>Tanggal</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${rows || '<tr><td colspan="5">Belum ada artikel.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderCommentsTab() {
      const canSeePhone = isDirectorOrEditor();
      const rows = redaksiState.comments.map(c => {
        const st = (c.status || 'pending').toLowerCase();
        const badgeCls = st === 'approved' || st === 'terbit' ? 'b-terbit' : 'b-pending';
        const phoneDisplay = canSeePhone
          ? (c.phone || c.no_hp || '-')
          : 'Terkunci (Direktur/Pemred)';
        const cid = rEsc(c.id);
        return `
          <tr>
            <td>
              <div style="font-weight:700">${rEsc(c.author_name || 'Pembaca')}</div>
              <div style="font-size:12px;margin-top:3px">${rEsc(c.body || c.content || '')}</div>
            </td>
            <td style="font-size:12px">${rEsc(phoneDisplay)}</td>
            <td><span class="badge ${badgeCls}">${rEsc(st)}</span></td>
            <td style="font-size:12px;color:var(--mute)">${rFmtDate(c.created_at)}</td>
            <td>
              <div class="r-row-act">
                <button type="button" class="btn-xs pri" data-com-act="approve" data-com-id="${cid}">Setujui</button>
                <button type="button" class="btn-xs del" data-com-act="delete" data-com-id="${cid}">Hapus</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <div class="r-card">
          <h2>Moderasi Komentar</h2>
          <div class="r-table-wrap">
            <table class="r-tbl">
              <thead>
                <tr>
                  <th>Komentar</th>
                  <th>No. HP</th>
                  <th>Status</th>
                  <th>Tanggal</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${rows || '<tr><td colspan="5">Belum ada komentar.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderAdsTab() {
      const rows = redaksiState.ads.map(ad => {
        const aid = rEsc(ad.id);
        return `
          <tr>
            <td>
              <div style="font-weight:700">${rEsc(ad.title || 'Slot Iklan')}</div>
              <div style="font-size:11px;color:var(--mute)">${rEsc(ad.target_url || (ad.ad_code ? 'Kode AdSense/Script' : '-'))}</div>
            </td>
            <td>${rEsc(ad.placement || 'feed')}</td>
            <td><span class="badge ${ad.is_active ? 'b-terbit' : 'b-arsip'}">${ad.is_active ? 'Aktif' : 'Nonaktif'}</span></td>
            <td>
              <div class="r-row-act">
                <button type="button" class="btn-xs" data-ad-act="toggle" data-ad-id="${aid}" data-ad-active="${Boolean(ad.is_active)}">${ad.is_active ? 'Nonaktifkan' : 'Aktifkan'}</button>
                <button type="button" class="btn-xs del" data-ad-act="delete" data-ad-id="${aid}">Hapus</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      return `
        <div class="r-card">
          <h2>Tambah Iklan / AdSense</h2>
          <form onsubmit="saveAdRow(event)" class="r-form-grid">
            <div class="r-field">
              <label for="adTitle">Judul / Label Iklan</label>
              <input id="adTitle" type="text" required placeholder="Promo Partner Lokal">
            </div>
            <div class="r-field">
              <label for="adPlacement">Posisi Penempatan</label>
              <select id="adPlacement">
                <option value="feed">Di Sela Feed</option>
                <option value="header">Banner Atas</option>
                <option value="detail">Halaman Baca</option>
              </select>
            </div>
            <div class="r-field">
              <label for="adImageUrl">URL Gambar Banner (Opsional)</label>
              <input id="adImageUrl" type="url" placeholder="https://...">
            </div>
            <div class="r-field">
              <label for="adTargetUrl">URL Tujuan Klik (Opsional)</label>
              <input id="adTargetUrl" type="url" placeholder="https://...">
            </div>
            <div class="r-field full">
              <label for="adCode">Kode HTML / AdSense (Opsional)</label>
              <textarea id="adCode" placeholder="Tempel potongan kode iklan jika memakai AdSense atau script banner"></textarea>
            </div>
            <div class="r-field full" style="flex-direction:row;align-items:center;justify-content:space-between">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input id="adActive" type="checkbox" checked style="width:auto">
                <span>Aktifkan langsung</span>
              </label>
              <button type="submit" class="go sm">Simpan Iklan</button>
            </div>
          </form>
        </div>

        <div class="r-card">
          <h2>Daftar Iklan Terpasang</h2>
          <div class="r-table-wrap">
            <table class="r-tbl">
              <thead>
                <tr>
                  <th>Judul</th>
                  <th>Posisi</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${rows || '<tr><td colspan="4">Belum ada data iklan.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSettingsTab() {
      const s = redaksiState.settings || {};
      return `
        <div class="r-card">
          <h2>Pengaturan Situs</h2>
          <form onsubmit="saveSiteSettings(event)" class="r-form-grid">
            <div class="r-field">
              <label for="setTitle">Nama Situs</label>
              <input id="setTitle" type="text" value="${rEsc(s.site_title || 'Langkatalk')}">
            </div>
            <div class="r-field">
              <label for="setTagline">Tagline Utama</label>
              <input id="setTagline" type="text" value="${rEsc(s.tagline || 'Menghubungkan Cerita Langkat')}">
            </div>
            <div class="r-field full">
              <label for="setSubtag">Sub-tagline / Deskripsi Singkat</label>
              <input id="setSubtag" type="text" value="${rEsc(s.subtag || 'Bongkar Atraksi Ruang Gelap')}">
            </div>
            <div class="r-field full" style="align-items:flex-end">
              <button type="submit" class="go sm">Simpan Pengaturan</button>
            </div>
          </form>
        </div>
      `;
    }

    function bindRedaksiActions() {
      const root = document.getElementById('root');
      if (!root) return;

      root.querySelectorAll('[data-art-act]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const act = btn.getAttribute('data-art-act');
          const id = btn.getAttribute('data-art-id');
          if (!id) return;
          if (act === 'status') {
            await setArticleStatus(id, btn.getAttribute('data-art-status'));
          } else if (act === 'delete') {
            await deleteArticleRow(id);
          }
        });
      });

      root.querySelectorAll('[data-com-act]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const act = btn.getAttribute('data-com-act');
          const id = btn.getAttribute('data-com-id');
          if (!id) return;
          if (act === 'approve') {
            await setCommentStatus(id, 'approved');
          } else if (act === 'delete') {
            await deleteCommentRow(id);
          }
        });
      });

      root.querySelectorAll('[data-ad-act]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const act = btn.getAttribute('data-ad-act');
          const id = btn.getAttribute('data-ad-id');
          if (!id) return;
          if (act === 'toggle') {
            await toggleAdActive(id, btn.getAttribute('data-ad-active') === 'true');
          } else if (act === 'delete') {
            await deleteAdRow(id);
          }
        });
      });
    }

    function renderRedaksiPage() {
      if (!redaksiState.user || redaksiState.authMode === 'recovery') {
        renderLoginView();
        return;
      }

      const totalArt = redaksiState.articles.length;
      const terbitArt = redaksiState.articles.filter(a => (a.status || '').toLowerCase() === 'terbit').length;
      const draftArt = redaksiState.articles.filter(a => (a.status || '').toLowerCase() !== 'terbit').length;
      const pendingCom = redaksiState.comments.filter(c => !['approved', 'terbit'].includes((c.status || '').toLowerCase())).length;

      const noticeHtml = redaksiState.notice
        ? `<div class="r-notice ${redaksiState.notice.type === 'err' ? 'err' : 'ok'}">${rEsc(redaksiState.notice.text)}</div>`
        : '';

      let tabContent = '';
      if (redaksiState.tab === 'artikel') tabContent = renderArticlesTab();
      else if (redaksiState.tab === 'komentar') tabContent = renderCommentsTab();
      else if (redaksiState.tab === 'iklan') tabContent = renderAdsTab();
      else if (redaksiState.tab === 'pengaturan') tabContent = renderSettingsTab();

      document.getElementById('root').innerHTML = `
        <div class="r-wrap">
          <div class="r-top">
            <div class="r-brand">
              <img src="favicon.png" alt="Langkatalk">
              <div>
                <h1>Ruang Redaksi</h1>
                <div class="sub">${rEsc(redaksiState.profile?.full_name || redaksiState.user.email)} • Peran: <b>${rEsc(redaksiState.profile?.role || 'penulis')}</b></div>
              </div>
            </div>
            <div class="r-actions">
              <a class="pill" href="index.html">Beranda</a>
              <a class="go sm" href="tulis.html">+ Tulis Berita</a>
              <button type="button" class="btn-grad-dark" onclick="handleRedaksiLogout()">Keluar</button>
            </div>
          </div>

          <div class="r-grid4">
            <div class="r-stat"><div class="k">Total Artikel</div><div class="v">${totalArt}</div></div>
            <div class="r-stat"><div class="k">Terbit</div><div class="v">${terbitArt}</div></div>
            <div class="r-stat"><div class="k">Draft / Arsip</div><div class="v">${draftArt}</div></div>
            <div class="r-stat"><div class="k">Komentar Menunggu</div><div class="v">${pendingCom}</div></div>
          </div>

          <div class="r-tabs">
            <button type="button" class="r-tab ${redaksiState.tab === 'artikel' ? 'on' : ''}" onclick="redaksiState.notice=null;redaksiState.tab='artikel';renderRedaksiPage()">Artikel &amp; Status</button>
            <button type="button" class="r-tab ${redaksiState.tab === 'komentar' ? 'on' : ''}" onclick="redaksiState.notice=null;redaksiState.tab='komentar';renderRedaksiPage()">Moderasi Komentar</button>
            <button type="button" class="r-tab ${redaksiState.tab === 'iklan' ? 'on' : ''}" onclick="redaksiState.notice=null;redaksiState.tab='iklan';renderRedaksiPage()">Iklan &amp; AdSense</button>
            <button type="button" class="r-tab ${redaksiState.tab === 'pengaturan' ? 'on' : ''}" onclick="redaksiState.notice=null;redaksiState.tab='pengaturan';renderRedaksiPage()">Pengaturan Situs</button>
          </div>

          ${noticeHtml}
          ${tabContent}
        </div>
      `;

      bindRedaksiActions();
    }

    (async function initRedaksi() {
      const sb = getClient();
      if (sb && sb.auth && sb.auth.onAuthStateChange) {
        sb.auth.onAuthStateChange(async (event) => {
          if (event === 'PASSWORD_RECOVERY') {
            redaksiState.authMode = 'recovery';
            renderRedaksiPage();
          }
        });
      }

      if (window.location.hash && window.location.hash.includes('type=recovery')) {
        redaksiState.authMode = 'recovery';
      }

      renderRedaksiPage();
      await loadRedaksiSession();
      if (redaksiState.user && redaksiState.authMode !== 'recovery') {
        await loadRedaksiData();
      }
      renderRedaksiPage();
    })();
  </script>
</body>
</html>
