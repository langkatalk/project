<!doctype html>
<html lang="id">
<head>

  <style>
    .nf-wrap {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .nf-kartu {
      max-width: 460px;
      width: 100%;
      text-align: center;
      padding: 34px 26px;
      border-radius: 26px;
      background: var(--lk-kaca);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid var(--lk-kaca-garis);
      box-shadow: var(--lk-bayangan);
      animation: munculNaik 360ms ease both;
    }
    .nf-kode {
      font-family: 'Sora', 'Plus Jakarta Sans', sans-serif;
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      background: var(--lk-grad-brand);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0 0 10px;
    }
    .nf-judul {
      font-family: 'Sora', 'Plus Jakarta Sans', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--lk-teks);
      margin: 0 0 8px;
    }
    .nf-teks { font-size: 14px; color: var(--lk-muted); margin: 0 0 22px; line-height: 1.6; }
    .nf-tombol { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    @media (prefers-reduced-motion: reduce) {
      .nf-kartu { animation: none; }
    }
  </style>

  <header class="lk-header">

      <p class="nf-teks">Alamat yang kamu buka mungkin sudah berubah, atau berita itu sudah dipindahkan ke arsip.</p>
      <div class="nf-tombol">
        <a class="btn btn-utama" href="index.html">Kembali ke beranda</a>
      </div>

  <footer class="lk-footer">
