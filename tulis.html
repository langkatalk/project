<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Tulis Berita – Langkatalk</title>
  <meta name="description" content="Ruang penulisan berita Langkatalk – Portal berita investigasi, cerita lokal, dan jurnalisme sosial.">
  <meta name="robots" content="noindex,nofollow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Langkatalk">
  <meta property="og:title" content="Tulis Berita – Langkatalk">
  <meta property="og:description" content="Ruang penulisan berita Langkatalk – Portal berita investigasi, cerita lokal, dan jurnalisme sosial.">
  <link id="canonicalTag" rel="canonical" href="https://langkatalk.vercel.app/tulis.html">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script id="newsArticleSchema" type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NewsArticle",
    "headline": "Tulis Berita – Langkatalk",
    "publisher": {
      "@type": "Organization",
      "name": "Langkatalk",
      "logo": {
        "@type": "ImageObject",
        "url": "https://langkatalk.vercel.app/favicon.png"
      }
    }
  }
  </script>
  <style>
    :root{
      --brand-grad:linear-gradient(135deg,#7C3FE0 0%,#5F6FEE 55%,#1CC8C8 100%);
      --glass-w:rgba(255,255,255,.78);
      --glass-w-strong:rgba(255,255,255,.9);
      --glass-border:rgba(255,255,255,.92);
    }
    .t-shell{max-width:1240px;margin:20px auto 80px;padding:0 16px}
    .t-topbar{
      display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
      background:var(--glass-w);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
      border:1px solid var(--glass-border);border-radius:20px;padding:12px 16px;
      box-shadow:0 12px 34px rgba(22,17,51,.07);margin-bottom:18px
    }
    .t-brand{display:flex;align-items:center;gap:11px}
    .t-brand img{width:38px;height:38px;border-radius:12px;object-fit:cover;box-shadow:0 6px 16px rgba(124,63,224,.22)}
    .t-brand h1{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;margin:0;color:var(--ink)}
    .t-brand .sub{font-size:12px;color:var(--mute)}
    .t-nav-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .btn-grad-purple{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:9px 16px;border-radius:999px;border:0;
      background:var(--brand-grad);color:#fff !important;text-decoration:none;
      font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;
      cursor:pointer;box-shadow:0 8px 20px rgba(124,63,224,.28);transition:.15s
    }
    .btn-grad-purple:hover{transform:translateY(-1px);filter:brightness(1.04)}

    .t-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:18px;align-items:start}
    .t-col{display:flex;flex-direction:column;gap:16px;min-width:0}
    .t-panel{
      background:var(--glass-w);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
      border:1px solid var(--glass-border);border-radius:22px;padding:18px;
      box-shadow:0 14px 36px rgba(22,17,51,.07)
    }
    .t-panel-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;margin:0 0 12px;color:var(--ink)}
    .t-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
    .t-field:last-child{margin-bottom:0}
    .t-lbl{font-size:12px;font-weight:800;color:var(--ink)}
    .t-input,.t-select,.t-textarea{
      width:100%;padding:10px 13px;border:1px solid rgba(22,17,51,.13);border-radius:12px;
      background:var(--glass-w-strong);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;
      font-size:13px;outline:none;transition:.15s
    }
    .t-input:focus,.t-select:focus,.t-textarea:focus{
      border-color:#7C3FE0;background:#fff;box-shadow:0 0 0 3px rgba(124,63,224,.15)
    }
    .t-counter{
      display:inline-block;margin-top:4px;padding:2px 8px;border-radius:6px;
      background:rgba(124,63,224,.12);color:#5B21B6;font-size:11px;font-weight:800;width:fit-content
    }

    .editor-frame{border:1px solid rgba(22,17,51,.13);border-radius:14px;overflow:hidden;background:#fff}
    .ql-toolbar.ql-snow{
      border:0;border-bottom:1px solid rgba(22,17,51,.1);
      background:rgba(248,249,255,.92);padding:8px 10px;
      font-family:'Plus Jakarta Sans',sans-serif
    }
    .ql-container.ql-snow{border:0;min-height:320px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;line-height:1.75;color:var(--ink)}
    .ql-editor{min-height:320px;padding:15px}
    .ql-editor blockquote{border-left:4px solid #7C3FE0;background:rgba(124,63,224,.06);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
    .editor-statusbar{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:7px 12px;background:rgba(241,245,249,.9);border-top:1px solid rgba(22,17,51,.1);
      font-size:11px;font-weight:700;color:var(--mute)
    }
    .btn-mini-ghost{
      border:1px solid rgba(124,63,224,.28);background:#fff;color:#5B21B6;
      padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer
    }
    .btn-mini-ghost:hover{background:rgba(124,63,224,.08)}

    .t-img-box{border:1.5px dashed rgba(124,63,224,.35);border-radius:14px;padding:12px;background:rgba(255,255,255,.68)}
    .t-img-info{font-size:11px;color:var(--mute);line-height:1.5;margin-top:8px}
    .t-img-preview{margin-top:10px;display:none}
    .t-img-preview img{width:100%;max-height:190px;border-radius:10px;object-fit:cover;display:block}

    .tag-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .tag-chip{
      display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
      background:rgba(124,63,224,.12);color:#4C1D95;font-size:12px;font-weight:700
    }
    .tag-chip button{border:0;background:none;color:inherit;font-weight:800;cursor:pointer;padding:0;line-height:1}

    .t-checks{display:flex;flex-direction:column;gap:10px;margin-top:6px}
    .t-check-item{
      display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:12px;
      background:rgba(255,255,255,.72);border:1px solid rgba(22,17,51,.09);
      font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)
    }
    .t-check-item input[type="checkbox"]{width:16px;height:16px;margin:0;accent-color:#7C3FE0;flex-shrink:0;cursor:pointer}
    .schedule-box{display:none;margin-top:10px;padding:12px;border-radius:12px;background:rgba(28,200,200,.1);border:1px solid rgba(28,200,200,.35)}
    .schedule-box.show{display:block}

    .t-bottom-bar{
      display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
      margin-top:18px;padding-top:14px;border-top:1px solid rgba(22,17,51,.1)
    }
    .t-msg-err{color:#B91C1C;background:rgba(254,226,226,.85);border:1px solid #FECACA;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700;margin-top:12px;display:none}
    .t-msg-ok{color:#166534;background:rgba(220,252,231,.88);border:1px solid #BBF7D0;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700;margin-top:12px;display:none}

    .preview-modal-backdrop{
      position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);
      display:none;align-items:center;justify-content:center;padding:16px;z-index:999
    }
    .preview-modal-backdrop.open{display:flex}
    .preview-modal-card{
      width:100%;max-width:760px;max-height:85vh;overflow:auto;
      background:#fff;border-radius:22px;padding:22px;box-shadow:0 24px 60px rgba(15,23,42,.28)
    }

    @media (max-width:920px){
      .t-layout{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="previewModal" class="preview-modal-backdrop" onclick="if(event.target===this)closePreviewModal()">
    <div class="preview-modal-card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">
        <strong style="font-family:'Sora',sans-serif;font-size:16px">Pratinjau Artikel &amp; SEO</strong>
        <button type="button" class="btn-mini-ghost" onclick="closePreviewModal()">Tutup</button>
      </div>
      <div id="previewModalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const tulisState = {
      user: null,
      profile: null,
      quill: null,
      coverUrl: '',
      tags: [],
      relatedIds: [],
      existingArticles: []
    };

    function getClient() {
      if (typeof getSupabase === 'function') {
        const c = getSupabase();
        if (c) return c;
      }
      const cfg = window.APP_CONFIG || {};
      if (window.supabase && cfg.SUPABASE_URL && cfg.SUPABASE_PUBLISHABLE_KEY) {
        return window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
      }
      return null;
    }

    function escHtml(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function slugify(text) {
      const base = (text || '')
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-')
        .slice(0, 75) || 'berita-langkatalk';
      return `${base}-${Date.now().toString().slice(-4)}`;
    }

    function updateCounters() {
      const titleEl = document.getElementById('tTitle');
      const descEl = document.getElementById('tDesc');
      const tCnt = document.getElementById('titleCounter');
      const dCnt = document.getElementById('descCounter');
      if (titleEl && tCnt) {
        const left = Math.max(0, 150 - titleEl.value.length);
        tCnt.textContent = `${left} characters left`;
      }
      if (descEl && dCnt) {
        const left = Math.max(0, 160 - descEl.value.length);
        dCnt.textContent = `${left} characters left (SEO ideal <= 160)`;
      }
      syncSeoAndSchema();
    }

    function syncSeoAndSchema() {
      const title = (document.getElementById('tTitle')?.value || '').trim() || 'Tulis Berita – Langkatalk';
      const metaTitle = (document.getElementById('tMetaTitle')?.value || '').trim() || title;
      const desc = (document.getElementById('tDesc')?.value || '').trim();
      const metaDesc = (document.getElementById('tMetaDesc')?.value || '').trim() || desc || 'Portal berita Langkatalk.';
      const author = (document.getElementById('tAuthor')?.value || '').trim() || 'Redaksi Langkatalk';
      const cover = (document.getElementById('tCoverUrl')?.value || '').trim() || tulisState.coverUrl || 'https://langkatalk.vercel.app/favicon.png';

      document.title = `${metaTitle} – Langkatalk`;
      const metaDescTag = document.querySelector('meta[name="description"]');
      if (metaDescTag) metaDescTag.setAttribute('content', metaDesc);

      const ogTitle = document.querySelector('meta[property="og:title"]');
      if (ogTitle) ogTitle.setAttribute('content', metaTitle);

      const ogDesc = document.querySelector('meta[property="og:description"]');
      if (ogDesc) ogDesc.setAttribute('content', metaDesc);

      const schemaEl = document.getElementById('newsArticleSchema');
      if (schemaEl) {
        schemaEl.textContent = JSON.stringify({
          '@context': 'https://schema.org',
          '@type': 'NewsArticle',
          headline: metaTitle,
          description: metaDesc,
          image: [cover],
          author: { '@type': 'Person', name: author },
          publisher: {
            '@type': 'Organization',
            name: 'Langkatalk',
            logo: { '@type': 'ImageObject', url: 'https://langkatalk.vercel.app/favicon.png' }
          }
        }, null, 2);
      }
    }

    function renderTagChips() {
      const box = document.getElementById('tTagChips');
      if (!box) return;
      box.innerHTML = tulisState.tags.map((tag, idx) => `
        <span class="tag-chip">
          #${escHtml(tag)}
          <button type="button" onclick="removeTag(${idx})" title="Hapus tag">×</button>
        </span>
      `).join('');
    }

    function addTagFromInput() {
      const inp = document.getElementById('tTagInput');
      if (!inp) return;
      const parts = inp.value.split(',').map(s => s.trim().replace(/^#/, '')).filter(Boolean);
      parts.forEach(p => {
        if (!tulisState.tags.includes(p)) tulisState.tags.push(p);
      });
      inp.value = '';
      renderTagChips();
    }

    function removeTag(idx) {
      tulisState.tags.splice(idx, 1);
      renderTagChips();
    }

    function toggleScheduleInput() {
      const checked = Boolean(document.getElementById('tScheduleCheck')?.checked);
      const box = document.getElementById('tScheduleBox');
      if (box) box.classList.toggle('show', checked);
    }

    function addRelatedArticle() {
      const sel = document.getElementById('tRelatedSelect');
      if (!sel || !sel.value) return;
      if (!tulisState.relatedIds.includes(sel.value)) {
        tulisState.relatedIds.push(sel.value);
        renderRelatedChips();
      }
      sel.value = '';
    }

    function removeRelatedArticle(id) {
      tulisState.relatedIds = tulisState.relatedIds.filter(x => x !== id);
      renderRelatedChips();
    }

    function renderRelatedChips() {
      const box = document.getElementById('tRelatedChips');
      if (!box) return;
      box.innerHTML = tulisState.relatedIds.map(id => {
        const found = tulisState.existingArticles.find(a => String(a.id) === String(id));
        const label = found ? found.title : `Artikel #${id}`;
        return `
          <span class="tag-chip">
            ${escHtml(label)}
            <button type="button" onclick="removeRelatedArticle('${escHtml(id)}')">×</button>
          </span>
        `;
      }).join('');
    }

    function initQuillEditor() {
      if (!window.Quill || !document.getElementById('tQuill')) return;
      tulisState.quill = new Quill('#tQuill', {
        theme: 'snow',
        placeholder: 'Mulai tulis isi berita secara lengkap...',
        modules: {
          toolbar: [
            [{ header: [1, 2, 3, false] }],
            [{ font: [] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ color: [] }, { background: [] }],
            [{ align: [] }],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['blockquote', 'code-block'],
            ['link', 'image'],
            ['clean']
          ]
        }
      });

      const updatePathBar = () => {
        const sel = tulisState.quill.getSelection();
        const pathEl = document.getElementById('editorPathBar');
        if (!pathEl) return;
        if (!sel) {
          pathEl.textContent = 'p';
          return;
        }
        const [line] = tulisState.quill.getLine(sel.index);
        const tagName = line?.domNode?.tagName ? line.domNode.tagName.toLowerCase() : 'p';
        pathEl.textContent = tagName;
      };

      tulisState.quill.on('selection-change', updatePathBar);
      tulisState.quill.on('text-change', updatePathBar);
    }

    function openPreviewModal() {
      const title = (document.getElementById('tTitle')?.value || '').trim() || '(Tanpa Judul)';
      const category = document.getElementById('tCategory')?.value || 'Umum';
      const author = (document.getElementById('tAuthor')?.value || '').trim() || 'Redaksi';
      const source = (document.getElementById('tSource')?.value || '').trim();
      const topic = (document.getElementById('tTopic')?.value || '').trim();
      const cover = (document.getElementById('tCoverUrl')?.value || '').trim() || tulisState.coverUrl;
      const bodyHtml = tulisState.quill ? tulisState.quill.root.innerHTML : '';

      document.getElementById('previewModalBody').innerHTML = `
        <div style="font-size:12px;color:#64748B;font-weight:700;margin-bottom:6px">
          ${escHtml(category)}${topic ? ' • Topik: ' + escHtml(topic) : ''} • Oleh ${escHtml(author)}${source ? ' • Sumber: ' + escHtml(source) : ''}
        </div>
        <h2 style="font-family:'Sora',sans-serif;font-size:22px;margin:0 0 12px">${escHtml(title)}</h2>
        ${cover ? `<img src="${escHtml(cover)}" alt="${escHtml(title)}" style="width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin-bottom:14px">` : ''}
        <div style="font-size:14px;line-height:1.75">${bodyHtml}</div>
      `;
      document.getElementById('previewModal').classList.add('open');
    }

    function closePreviewModal() {
      document.getElementById('previewModal').classList.remove('open');
    }

    async function compressImageFile(file, maxWidth = 1280, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            canvas.toBlob(
              (blob) => {
                if (!blob) return reject(new Error('Gagal mengompres gambar.'));
                const safeName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
                resolve(new File([blob], safeName, { type: 'image/jpeg' }));
              },
              'image/jpeg',
              quality
            );
          };
          img.onerror = () => reject(new Error('File gambar tidak valid.'));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
        reader.readAsDataURL(file);
      });
    }

    async function handleCoverUpload(ev) {
      const file = ev.target.files?.[0];
      const infoEl = document.getElementById('tImgInfo');
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showErr('Pilih file gambar (JPG, PNG, atau WebP).');
        return;
      }

      const rawKb = Math.round(file.size / 1024);
      if (infoEl) infoEl.textContent = `Mengompres gambar (${rawKb} KB)...`;

      try {
        const compressed = await compressImageFile(file, 1280, 0.8);
        const compKb = Math.round(compressed.size / 1024);
        const sb = getClient();
        if (!sb) throw new Error('Koneksi Supabase belum siap.');

        const path = `covers/${Date.now()}-${compressed.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
        const { error: upErr } = await sb.storage.from('articles').upload(path, compressed, {
          cacheControl: '3600',
          upsert: false
        });
        if (upErr) throw new Error('Upload ke Storage gagal: ' + upErr.message);

        const { data: pub } = sb.storage.from('articles').getPublicUrl(path);
        const url = pub?.publicUrl || '';
        tulisState.coverUrl = url;
        const inp = document.getElementById('tCoverUrl');
        if (inp) inp.value = url;

        const prevWrap = document.getElementById('tImgPreview');
        const prevImg = document.getElementById('tImgEl');
        if (prevWrap && prevImg && url) {
          prevImg.src = url;
          prevWrap.style.display = 'block';
        }
        if (infoEl) {
          infoEl.textContent = `Terunggah: ${rawKb} KB → ${compKb} KB • Disarankan lebar >= 1200px (16:9 / 4:3) untuk Google Discover.`;
        }
        syncSeoAndSchema();
      } catch (err) {
        showErr(err.message);
      }
    }

    function showErr(msg) {
      const errEl = document.getElementById('tErr');
      const okEl = document.getElementById('tOk');
      if (okEl) okEl.style.display = 'none';
      if (errEl) {
        errEl.style.display = 'block';
        errEl.textContent = msg;
      }
    }

    function showOk(msg) {
      const errEl = document.getElementById('tErr');
      const okEl = document.getElementById('tOk');
      if (errEl) errEl.style.display = 'none';
      if (okEl) {
        okEl.style.display = 'block';
        okEl.textContent = msg;
      }
    }

    async function persistArticle(mode) {
      addTagFromInput();
      const title = (document.getElementById('tTitle')?.value || '').trim();
      const category = document.getElementById('tCategory')?.value || 'Investigasi';
      const description = (document.getElementById('tDesc')?.value || '').trim();
      const source = (document.getElementById('tSource')?.value || '').trim();
      const authorName = (document.getElementById('tAuthor')?.value || '').trim() || tulisState.profile?.full_name || tulisState.user?.email || 'Redaksi';
      const topic = (document.getElementById('tTopic')?.value || '').trim();
      const allowComment = Boolean(document.getElementById('tAllowComment')?.checked);
      const viewInWelcome = Boolean(document.getElementById('tViewWelcome')?.checked);
      const isScheduled = Boolean(document.getElementById('tScheduleCheck')?.checked);
      const scheduleVal = document.getElementById('tScheduleAt')?.value || '';
      const coverUrl = (document.getElementById('tCoverUrl')?.value || '').trim() || tulisState.coverUrl || null;
      const metaTitle = (document.getElementById('tMetaTitle')?.value || '').trim() || title;
      const metaDescription = (document.getElementById('tMetaDesc')?.value || '').trim() || description;

      const plainText = tulisState.quill ? tulisState.quill.getText().trim() : '';
      const bodyHtml = tulisState.quill ? tulisState.quill.root.innerHTML.trim() : '';

      if (!title) return showErr('Judul (Title) wajib diisi.');
      if (!plainText) return showErr('Isi berita (Content) belum ditulis.');

      let finalStatus = mode === 'draft' ? 'draft' : 'terbit';
      let scheduledIso = null;
      let publishedIso = finalStatus === 'terbit' ? new Date().toISOString() : null;

      if (isScheduled && scheduleVal && mode !== 'draft') {
        const dt = new Date(scheduleVal);
        if (!Number.isNaN(dt.getTime())) {
          scheduledIso = dt.toISOString();
          if (dt.getTime() > Date.now()) {
            finalStatus = 'scheduled';
            publishedIso = null;
          } else {
            publishedIso = scheduledIso;
          }
        }
      }

      const sb = getClient();
      if (!sb) return showErr('Koneksi Supabase belum siap.');

      const slug = slugify(title);
      const payload = {
        title,
        slug,
        category,
        description: description || null,
        body: bodyHtml,
        cover_url: coverUrl,
        tags: tulisState.tags,
        source: source || null,
        author_name: authorName,
        author_id: tulisState.user?.id || null,
        topic: topic || null,
        allow_comment: allowComment,
        view_in_welcome: viewInWelcome,
        scheduled_at: scheduledIso,
        published_at: publishedIso,
        status: finalStatus,
        related_ids: tulisState.relatedIds,
        meta_title: metaTitle || null,
        meta_description: metaDescription || null,
        canonical_url: `https://langkatalk.vercel.app/index.html#/berita/${slug}`
      };

      const { error } = await sb.from('articles').insert(payload);
      if (error) {
        return showErr('Gagal menyimpan berita: ' + error.message);
      }

      showOk(
        finalStatus === 'terbit'
          ? 'Berita berhasil diterbitkan ke database Supabase!'
          : finalStatus === 'scheduled'
            ? `Berita berhasil dijadwalkan tayang (${scheduleVal}) di database Supabase!`
            : 'Berita berhasil disimpan sebagai draft ke database Supabase!'
      );
    }

    function renderTulisPage() {
      const root = document.getElementById('root');
      if (!tulisState.user) {
        root.innerHTML = `
          <div class="t-shell">
            <div class="t-topbar">
              <div class="t-brand">
                <img src="favicon.png" alt="Langkatalk">
                <div>
                  <h1>Langkatalk</h1>
                  <div class="sub">Tulis Berita</div>
                </div>
              </div>
              <div class="t-nav-group">
                <a class="btn-grad-purple" href="index.html">Beranda</a>
                <a class="btn-grad-purple" href="redaksi.html">Ruang Redaksi</a>
              </div>
            </div>
            <div class="t-panel" style="max-width:440px;margin:36px auto;text-align:center">
              <h2 class="t-panel-title">Akses Terbatas Redaksi</h2>
              <p style="font-size:13px;color:var(--mute);margin:0 0 16px">Silakan masuk ke Ruang Redaksi terlebih dahulu untuk menulis atau menerbitkan berita.</p>
              <a class="btn-grad-purple" href="redaksi.html">Masuk Ruang Redaksi</a>
            </div>
          </div>
        `;
        return;
      }

      const defaultAuthor = tulisState.profile?.full_name || tulisState.user.email || '';
      const relatedOptions = tulisState.existingArticles
        .map(a => `<option value="${escHtml(a.id)}">${escHtml(a.title || '(Tanpa Judul)')}</option>`)
        .join('');

      root.innerHTML = `
        <div class="t-shell">
          <div class="t-topbar">
            <div class="t-brand">
              <img src="favicon.png" alt="Langkatalk">
              <div>
                <h1>Editorial – Create Article</h1>
                <div class="sub">Penulis aktif: <b>${escHtml(defaultAuthor)}</b></div>
              </div>
            </div>
            <div class="t-nav-group">
              <a class="btn-grad-purple" href="index.html">Beranda</a>
              <a class="btn-grad-purple" href="redaksi.html">Ruang Redaksi</a>
            </div>
          </div>

          <form id="tulisForm" onsubmit="event.preventDefault(); persistArticle('publish');">
            <div class="t-layout">
              <!-- KOLOM KIRI: TITLE, CONTENT, RELATED, SEO -->
              <div class="t-col">
                <div class="t-panel">
                  <div class="t-field">
                    <label class="t-lbl" for="tTitle">Title</label>
                    <input id="tTitle" class="t-input" type="text" maxlength="150" required placeholder="Enter Title..." oninput="updateCounters()">
                    <span id="titleCounter" class="t-counter">150 characters left</span>
                  </div>

                  <div class="t-field">
                    <label class="t-lbl">Content</label>
                    <div class="editor-frame">
                      <div id="tQuill"></div>
                      <div class="editor-statusbar">
                        <span>Elemen aktif: <b id="editorPathBar">p</b></span>
                        <button type="button" class="btn-mini-ghost" onclick="openPreviewModal()">👁 Preview</button>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="t-panel">
                  <h2 class="t-panel-title">Related</h2>
                  <div class="t-field">
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                      <select id="tRelatedSelect" class="t-select" style="flex:1;min-width:200px">
                        <option value="">Select a related article...</option>
                        ${relatedOptions}
                      </select>
                      <button type="button" class="btn-grad-purple" onclick="addRelatedArticle()">+ Add/Select more</button>
                    </div>
                    <div id="tRelatedChips" class="tag-chips"></div>
                  </div>
                </div>

                <div class="t-panel">
                  <h2 class="t-panel-title">SEO &amp; Google Discover</h2>
                  <div class="t-field">
                    <label class="t-lbl" for="tMetaTitle">SEO Meta Title (Opsional)</label>
                    <input id="tMetaTitle" class="t-input" type="text" maxlength="70" placeholder="Judul khusus SEO (maks. 60-70 karakter)" oninput="syncSeoAndSchema()">
                  </div>
                  <div class="t-field">
                    <label class="t-lbl" for="tMetaDesc">SEO Meta Description (Opsional)</label>
                    <textarea id="tMetaDesc" class="t-textarea" rows="2" maxlength="160" placeholder="Ringkasan SEO untuk hasil pencarian & Discover" oninput="syncSeoAndSchema()"></textarea>
                  </div>
                  <div style="font-size:11px;color:var(--mute);line-height:1.5">
                    Tips Google Discover: gunakan gambar sampul beresolusi tinggi (lebar disarankan <b>&ge; 1200px</b>, rasio <b>16:9</b> atau <b>4:3</b>), judul informatif tanpa clickbait berlebihan, dan ringkasan yang jelas.
                  </div>
                </div>
              </div>

              <!-- KOLOM KANAN: CATEGORY, DESCRIPTION, TAG, SOURCE, AUTHOR, TOPIC, CHECKBOXES -->
              <div class="t-col">
                <div class="t-panel">
                  <div class="t-field">
                    <label class="t-lbl" for="tCategory">Category / Rubrik</label>
                    <select id="tCategory" class="t-select">
                      <option value="Investigasi">Investigasi</option>
                      <option value="Ruang Gelap">Ruang Gelap</option>
                      <option value="Politik">Politik</option>
                      <option value="Panggung">Panggung</option>
                      <option value="Ekonomi Gelap">Ekonomi Gelap</option>
                      <option value="Opini">Opini</option>
                      <option value="Kilas Info">Kilas Info</option>
                    </select>
                  </div>

                  <div class="t-field">
                    <label class="t-lbl" for="tDesc">Description</label>
                    <textarea id="tDesc" class="t-textarea" rows="3" maxlength="160" placeholder="Ringkasan singkat berita..." oninput="updateCounters()"></textarea>
                    <span id="descCounter" class="t-counter">160 characters left (SEO ideal &lt;= 160)</span>
                  </div>

                  <div class="t-field">
                    <label class="t-lbl" for="tTagInput">Tag</label>
                    <div style="display:flex;gap:6px">
                      <input id="tTagInput" class="t-input" type="text" placeholder="Ketik tag lalu tekan Enter atau koma" onkeydown="if(event.key==='Enter'||event.key===','){event.preventDefault();addTagFromInput();}">
                      <button type="button" class="btn-mini-ghost" onclick="addTagFromInput()">+ Add</button>
                    </div>
                    <div id="tTagChips" class="tag-chips"></div>
                  </div>

                  <div class="t-field">
                    <label class="t-lbl" for="tSource">Source</label>
                    <input id="tSource" class="t-input" type="text" placeholder="Sumber berita / wawancara / rilis">
                  </div>

                  <div class="t-field">
                    <label class="t-lbl" for="tAuthor">Author</label>
                    <input id="tAuthor" class="t-input" type="text" value="${escHtml(defaultAuthor)}" placeholder="Nama penulis" oninput="syncSeoAndSchema()">
                  </div>

                  <div class="t-field">
                    <label class="t-lbl" for="tTopic">Topic</label>
                    <input id="tTopic" class="t-input" type="text" placeholder="Topik khusus (misal: Infrastruktur Langkat)">
                  </div>

                  <div class="t-field">
                    <label class="t-lbl">Cover Image (Supabase Storage)</label>
                    <div class="t-img-box">
                      <input id="tCoverFile" type="file" accept="image/*" onchange="handleCoverUpload(event)">
                      <input id="tCoverUrl" class="t-input" type="url" style="margin-top:8px" placeholder="https://... URL gambar sampul" oninput="syncSeoAndSchema()">
                      <div id="tImgInfo" class="t-img-info">Otomatis dikompresi maks lebar 1280px (kualitas 80%) saat diunggah.</div>
                      <div id="tImgPreview" class="t-img-preview">
                        <img id="tImgEl" alt="Preview Cover">
                      </div>
                    </div>
                  </div>

                  <div class="t-checks">
                    <label class="t-check-item">
                      <input id="tAllowComment" type="checkbox" checked>
                      <span>Allow Comment</span>
                    </label>
                    <label class="t-check-item">
                      <input id="tViewWelcome" type="checkbox" checked>
                      <span>View in welcome page</span>
                    </label>
                    <label class="t-check-item">
                      <input id="tScheduleCheck" type="checkbox" onchange="toggleScheduleInput()">
                      <span>Schedule</span>
                    </label>
                  </div>

                  <div id="tScheduleBox" class="schedule-box">
                    <label class="t-lbl" for="tScheduleAt">Waktu Jadwal Tayang</label>
                    <input id="tScheduleAt" class="t-input" type="datetime-local" style="margin-top:6px">
                  </div>
                </div>
              </div>
            </div>

            <div id="tErr" class="t-msg-err"></div>
            <div id="tOk" class="t-msg-ok"></div>

            <div class="t-panel t-bottom-bar">
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button type="submit" class="btn-grad-purple">Publish</button>
                <button type="button" class="btn-grad-purple" onclick="persistArticle('draft')">Save Draft</button>
              </div>
              <a class="btn-grad-purple" href="redaksi.html">Close</a>
            </div>
          </form>
        </div>
      `;

      initQuillEditor();
      updateCounters();
    }

    (async function initTulis() {
      const sb = getClient();
      if (sb) {
        try {
          if (sb.auth) {
            const { data } = await sb.auth.getSession();
            tulisState.user = data?.session?.user || null;
            if (tulisState.user) {
              const { data: prof } = await sb
                .from('profiles')
                .select('*')
                .eq('id', tulisState.user.id)
                .single();
              tulisState.profile = prof || null;
            }
          }
          const { data: arts } = await sb
            .from('articles')
            .select('id, title')
            .order('created_at', { ascending: false })
            .limit(30);
          tulisState.existingArticles = arts || [];
        } catch (_) {}
      }
      renderTulisPage();
    })();
  </script>
</body>
</html>
