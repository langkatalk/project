            </div>
            <div class="acts">
              <button class="gh" onclick="saveA(0)">Simpan draf</button>
              <button class="go sm" onclick="saveA(1)">Ajukan ke editor</button>
            </div>
          </div>
        `;
      },
      komen: () => {
        const canSeePhone = ['direktur', 'pemred'].includes(me.r);
        const artTitle = (aid) => (D.arts.find((x) => x.id === aid) || {}).title || `Artikel #${aid}`;
        return `
          <h2>Moderasi Komentar</h2>
          <p class="lead">Komentar baru berstatus <b>menunggu</b> sebelum tampil ke publik. ${canSeePhone ? 'No. HP hanya terlihat oleh Direktur & Pemred.' : 'No. HP disembunyikan untuk privasi.'}</p>
          <div class="panel tw">
            <table>
              <tr><th>Nama</th>${canSeePhone ? '<th>No. HP</th>' : ''}<th>Artikel</th><th>Komentar</th><th>Status</th><th>Aksi</th></tr>
              ${D.comments.map((c) => `
                <tr>
                  <td><b>${esc(c.guest_name)}</b><br><span class="mt">${fmtT(c.created_at)}</span></td>
                  ${canSeePhone ? `<td><code>${esc(c.guest_phone)}</code></td>` : ''}
                  <td style="max-width:200px">${esc(artTitle(c.article_id))}</td>
                  <td style="max-width:280px;white-space:pre-wrap">${esc(c.body)}</td>
                  <td><span class="chip ${c.status === 'disetujui' ? 'ok' : c.status === 'ditolak' ? 'ex' : 'wr'}">${esc(c.status)}</span></td>
                  <td>
                    <div class="acts" style="margin:0">
                      ${c.status !== 'disetujui' ? `<button type="button" class="go sm" onclick="modComment(${c.id}, true)">Setujui</button>` : ''}
                      ${c.status !== 'ditolak' ? `<button type="button" class="gh rd" onclick="modComment(${c.id}, false)">Tolak</button>` : ''}
                    </div>
                  </td>
                </tr>
              `).join('') || `<tr><td colspan="${canSeePhone ? 6 : 5}" class="c mt">Belum ada komentar masuk.</td></tr>`}
            </table>
          </div>
        `;
      },
      iklan: () => `
        <h2>Kelola Iklan</h2>
        <p class="lead">Jika tidak ada iklan aktif pada suatu slot, ruang iklan otomatis disembunyikan total di portal.</p>
        <form class="panel" onsubmit="addAdItem(event)">
          <h3 style="margin-bottom:14px">Tambah Slot Iklan</h3>
          <div class="row2">
            <div class="f">
              <label for="ad-slot">Posisi Slot</label>
              <select id="ad-slot">
                <option value="feed_top">feed_top (Bawah Hero)</option>
                <option value="feed_middle">feed_middle (Setelah Feed ke-4)</option>
                <option value="sidebar">sidebar (Sidebar Kanan)</option>
                <option value="detail_top">detail_top (Atas Detail Berita)</option>
                <option value="detail_bottom">detail_bottom (Bawah Detail Berita)</option>
              </select>
            </div>
            <div class="f">
              <label for="ad-type">Tipe Iklan</label>
              <select id="ad-type">
                <option value="image">Gambar Banner Manual</option>
                <option value="adsense">Google AdSense Slot</option>
              </select>
            </div>
          </div>
          <div class="row2">
            <div class="f"><label for="ad-title">Nama / Judul Kampanye</label><input type="text" id="ad-title" placeholder="Contoh: Banner Mitra Lokal"></div>
            <div class="f"><label for="ad-link">URL Tujuan Klik (Banner Manual)</label><input type="url" id="ad-link" placeholder="https://..."></div>
          </div>
          <div class="row2">
            <div class="f"><label for="ad-img">URL Gambar Banner (Banner Manual)</label><input type="url" id="ad-img" placeholder="https://..."></div>
            <div class="f"><label for="ad-gs">AdSense Slot ID (Jika tipe AdSense)</label><input type="text" id="ad-gs" placeholder="1234567890"></div>
          </div>
          <label class="tog" style="margin-bottom:14px"><input type="checkbox" id="ad-act" checked> Aktifkan iklan ini sekarang</label>
          <button type="submit" class="go sm">Simpan Iklan</button>
        </form>

        <div class="panel tw">
          <table>
            <tr><th>Slot</th><th>Tipe</th><th>Judul</th><th>Status</th><th>Aksi</th></tr>
            ${D.adsAll.map((ad) => `
              <tr>
                <td><b>${esc(ad.slot)}</b></td>
                <td>${esc(ad.ad_type)}</td>
                <td>${esc(ad.title || ad.adsense_slot_id || '-')}</td>
                <td><span class="chip ${ad.is_active ? 'ok' : 'wr'}">${ad.is_active ? 'Aktif' : 'Nonaktif'}</span></td>
                <td>
                  <div class="acts" style="margin:0">
                    <button type="button" class="gh" onclick="toggleAdActive(${ad.id}, ${ad.is_active})">${ad.is_active ? 'Matikan' : 'Aktifkan'}</button>
                    <button type="button" class="gh rd" onclick="deleteAdItem(${ad.id})">Hapus</button>
                  </div>
                </td>
              </tr>
            `).join('') || '<tr><td colspan="5" class="c mt">Belum ada data iklan (slot di portal otomatis tersembunyi).</td></tr>'}
          </table>
        </div>
      `,
      settings: () => `
        <h2>Pengaturan Situs</h2>
        <p class="lead">Edit konten halaman Tentang Kami, Redaksi, PT, Info Iklan, dan ID AdSense tanpa mengubah kode.</p>
        <form class="panel" onsubmit="saveSiteSettings(event)">
          <div class="f"><label for="set-about">Tentang Kami (#/about-us)</label><textarea id="set-about">${esc(siteSettings.about_us || '')}</textarea></div>
          <div class="f"><label for="set-redaksi">Susunan Redaksi (#/redaksi-info)</label><textarea id="set-redaksi">${esc(siteSettings.redaksi || '')}</textarea></div>
          <div class="f"><label for="set-pt">Legalitas & PT (#/pt)</label><textarea id="set-pt">${esc(siteSettings.pt_info || '')}</textarea></div>
          <div class="f"><label for="set-iklan">Info Pemasangan Iklan (#/info-iklan)</label><textarea id="set-iklan">${esc(siteSettings.info_iklan || '')}</textarea></div>
          <div class="row2">
            <div class="f"><label for="set-email">Email Redaksi</label><input type="email" id="set-email" value="${esc(siteSettings.contact_email || '')}"></div>
            <div class="f"><label for="set-wa">No. WhatsApp Redaksi</label><input type="text" id="set-wa" value="${esc(siteSettings.contact_wa || '')}" placeholder="08xxxxxxxxxx"></div>
          </div>
          <div class="f"><label for="set-adsense">Google AdSense Publisher ID (opsional)</label><input type="text" id="set-adsense" value="${esc(siteSettings.adsense_client || '')}" placeholder="ca-pub-xxxxxxxxxxxxxxxx"></div>
          <button type="submit" class="go sm">Simpan Semua Pengaturan</button>
        </form>
      `,
      usul: () => {
        const e = eff();
        const pr = ['direktur', 'pemred', 'redaktur', 'reporter'].includes(e);
        const as = ['direktur', 'pemred', 'redaktur'].includes(e);
        return `
          <h2>Usulan dan penugasan</h2>
          <p class="lead">Ide dibahas dulu, lalu ditugaskan ke penulis.</p>
          ${pr ? '<div class="panel"><label for="it">Usulkan ide liputan</label><div style="display:flex;gap:8px"><input type="text" id="it"><button class="go sm" style="height:44px" onclick="addIdea()">Usulkan</button></div></div>' : ''}
          ${D.ideas.length ? D.ideas.map((i) => `
            <div class="rw">
              <b>${esc(i.title)}</b>
              <span class="mt">Diusulkan ${esc(pn(i.proposed_by))}</span>
              ${i.assigned_to ? `<span class="chip ok">Ditugaskan: ${esc(pn(i.assigned_to))}</span>` : '<span class="chip wr">Belum ditugaskan</span>'}
              ${as && !i.assigned_to
                ? `<select style="width:auto;height:36px" onchange="assign(${i.id},this.value)"><option value="">Tugaskan ke…</option>${D.profs.filter((u) => u.role !== 'editor').map((u) => `<option value="${u.id}">${esc(u.full_name)}</option>`).join('')}</select>`
                : ''}
              ${(i.assigned_to === me.id || (e === 'direktur' && i.assigned_to))
                ? `<button class="go sm" onclick="startIdea(${i.id})">Mulai menulis</button>`
                : ''}
            </div>
          `).join('') : '<div class="empty">Belum ada usulan.</div>'}
        `;
      },
      user: () => `
        <h2>Pengguna dan peran</h2>
        <p class="lead">Hanya direktur yang bisa mengatur peran staf. Pendaftar baru otomatis kontributor.</p>
        <div class="panel tw">
          <table>
            <tr><th>Nama</th><th>Pengguna</th><th>Peran</th></tr>
            ${D.profs.map((u) => `
              <tr>
                <td>${esc(u.full_name)}</td>
                <td>${esc(u.username)}</td>
                <td>${u.id === me.id
                  ? `<span class="chip">${ROLES[u.role]} (kamu)</span>`
                  : `<select style="height:36px" onchange="setRole('${u.id}',this.value)">${Object.keys(ROLES).map((r) => `<option value="${r}"${r === u.role ? ' selected' : ''}>${ROLES[r]}</option>`).join('')}</select>`}</td>
              </tr>
            `).join('')}
          </table>
        </div>
      `,
      matrix: () => {
        const cols = Object.keys(CAN);
        const R = Object.keys(ROLES);
        const ck = (b) => (b ? '<span style="color:var(--ok);font-weight:700">✓</span>' : '<span class="mt">–</span>');
        return `
          <h2>Matriks akses</h2>
          <p class="lead">Batasan peran di sistem redaksi Langkatalk.</p>
          <div class="panel tw">
            <table>
              <tr><th>Peran</th>${cols.map((c) => `<th class="c">${c}</th>`).join('')}</tr>
              ${R.map((r) => `<tr><td><b>${ROLES[r]}</b></td>${cols.map((c) => `<td class="c">${ck(CAN[c].includes(r))}</td>`).join('')}</tr>`).join('')}
            </table>
          </div>
        `;
      }
    };

    async function saveA(sub) {
      const title = $('wt').value.trim();
      const body = $('wb').value.trim();
      const tags = $('wtags').value.split(',').map((x) => x.trim().toLowerCase()).filter(Boolean);
      if (title.length < 5) { toast('Judul minimal 5 karakter'); return; }
      if (!body) { toast('Isi naskah wajib diisi'); return; }

      const r = await sb.from('articles').insert({
        title,
        category: $('wc').value,
        source: $('ws').value.trim() || null,
        cover_image: $('wcov').value.trim() || null,
        description: $('wdesc').value.trim() || null,
        tags,
        body,
        evidence_level: $('wl').value,
        is_exclusive: $('wx').checked,
        right_of_reply: $('wh').checked,
        allow_comment: $('wcmt').checked,
        status: sub ? 'diajukan' : 'draf',
        author_id: me.id
      }).select().single();

      if (r.error) { toast(r.error.message); return; }
      await refresh();
      page = 'antre';
      draw();
      toast(sub ? 'Naskah diajukan ke editor' : 'Draf disimpan');
    }

    async function addIdea() {
      const t = $('it').value.trim();
      if (t.length < 5) { toast('Usulan minimal 5 karakter'); return; }
      const r = await sb.from('ideas').insert({ title: t, proposed_by: me.id });
      if (r.error) { toast(r.error.message); return; }
      await refresh();
      draw();
      toast('Ide diusulkan');
    }

    async function assign(id, uid) {
      if (!uid) return;
      const r = await sb.from('ideas').update({ assigned_to: uid }).eq('id', id);
      if (r.error) { toast(r.error.message); return; }
      await refresh();
      draw();
      toast('Penugasan disimpan');
    }

    function startIdea(id) {
      const i = D.ideas.find((x) => x.id === id);
      pre = { title: i ? i.title : '' };
      page = 'tulis';
      draw();
    }

    async function setRole(uid, r) {
      const res = await sb.rpc('set_user_role', { target: uid, new_role: r });
      if (res.error) { toast(res.error.message); await refresh(); draw(); return; }
      await refresh();
      toast('Peran diperbarui');
    }

    function draw(keep) {
      const menuList = ACC[me.r] || ['home'];
      if (!menuList.includes(page)) page = menuList[0] || 'home';
      const tCount = tasks().length;
      const pendingCmt = D.comments.filter((c) => c.status === 'menunggu').length;

      if (!keep) {
        $('root').innerHTML = `
          <div class="shell">
            <aside class="sb">
              <img src="logo.png" alt="Langkatalk">
              <nav id="nav">
                ${MENUS.filter((m) => menuList.includes(m[0])).map((m) => {
                  const badgeNum = m[0] === 'antre' ? tCount : (m[0] === 'komen' ? pendingCmt : 0);
                  return `<button data-p="${m[0]}" class="${m[0] === page ? 'on' : ''}">${m[1]}${badgeNum ? ` <span class="badge">${badgeNum}</span>` : ''}</button>`;
                }).join('')}
              </nav>
            </aside>
            <div>
              <header class="tp">
                <span class="chip">${ROLES[me.r]}</span>
                <b>${esc(me.n)}</b>
                <span class="sp"></span>
                ${me.r === 'direktur'
                  ? `<label for="vw" class="mt" style="margin:0">Lihat sebagai:</label><select id="vw">${Object.keys(ROLES).map((r) => `<option value="${r}"${r === view ? ' selected' : ''}>${ROLES[r]}</option>`).join('')}</select>`
                  : ''}
                <a class="gh" href="#/">Portal</a>
                <button class="gh" onclick="logout()">Keluar</button>
              </header>
              <main class="ct" id="ct"></main>
            </div>
          </div>
        `;

        document.querySelectorAll('#nav button').forEach((b) => {
          b.onclick = () => { page = b.dataset.p; draw(); };
        });

        if ($('vw')) {
          $('vw').onchange = function () { view = this.value; draw(); };
        }
      }

      if ($('ct')) $('ct').innerHTML = (V[page] || V.home)();
    }

    route();
  </script>
</body>
</html>
