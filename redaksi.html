<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Ruang Redaksi – Langkatalk</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .r-wrap{max-width:1160px;margin:22px auto 64px;padding:0 18px}
    .r-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
    .r-brand{display:flex;align-items:center;gap:12px}
    .r-brand img{width:40px;height:40px;border-radius:12px;object-fit:cover;box-shadow:var(--shadow-sm)}
    .r-brand h1{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;margin:0}
    .r-brand .sub{font-size:12px;color:var(--mute)}
    .r-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .btn-grad-dark{
      display:inline-flex;align-items:center;justify-content:center;gap:6px;
      padding:9px 16px;border-radius:999px;border:0;
      background:linear-gradient(135deg,#1E293B 0%,#0F172A 100%);
      color:#fff !important;text-decoration:none;
      font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;
      cursor:pointer;box-shadow:0 8px 20px rgba(15,23,42,.26);transition:.15s
    }
    .btn-grad-dark:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .r-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .r-tab{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
    .r-tab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(95,111,238,.28)}
    .r-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
    .r-stat{background:rgba(255,255,255,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.85);border-radius:18px;padding:14px 16px;box-shadow:0 10px 30px rgba(22,17,51,.06)}
    .r-stat .k{font-size:12px;color:var(--mute);font-weight:700}
    .r-stat .v{font-family:'Sora',sans-serif;font-size:24px;font-weight:800;margin-top:4px;color:var(--ink)}
    .r-card{background:rgba(255,255,255,.76);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.88);border-radius:22px;padding:18px;box-shadow:0 14px 36px rgba(22,17,51,.07);margin-bottom:16px}
    .r-card h2{font-family:'Sora',sans-serif;font-size:16px;margin:0 0 12px}
    .r-table-wrap{overflow-x:auto}
    table.r-tbl{width:100%;border-collapse:collapse;font-size:13px}
    table.r-tbl th,table.r-tbl td{padding:10px;border-bottom:1px solid rgba(22,17,51,.08);text-align:left;vertical-align:top}
    table.r-tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:800}
    .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;margin-right:4px;margin-bottom:2px}
    .b-terbit{background:#DCFCE7;color:#166534}
    .b-draft{background:#FEF9C3;color:#854D0E}
    .b-arsip{background:#E2E8F0;color:#334155}
    .b-pending{background:#FFEDD5;color:#9A3412}
    .b-excl{background:#F3E8FF;color:#6B21A8}
    .b-brk{background:#FEE2E2;color:#991B1B}
    .r-row-act{display:flex;flex-wrap:wrap;gap:6px}
    .btn-xs{border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
    .btn-xs:hover{border-color:var(--violet)}
    .btn-xs.pri{background:var(--grad);color:#fff;border:0}
    .btn-xs.del{background:#FEE2E2;color:#991B1B;border-color:#FECACA}
    .r-notice{margin-bottom:12px;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:700;display:none}
    .r-notice.err{display:block;background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}
    .r-notice.ok{display:block;background:#DCFCE7;color:#166534;border:1px solid #BBF7D0}
    .r-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .r-field{display:flex;flex-direction:column;gap:6px}
    .r-field.full{grid-column:1 / -1}
    .r-field label{font-size:12px;font-weight:700;color:var(--ink)}
    .r-field input,.r-field select,.r-field textarea{width:100%;padding:11px 13px;border:1px solid rgba(22,17,51,.12);border-radius:12px;background:rgba(255,255,255,.86);color:var(--ink);font-family:inherit;font-size:13px;outline:none;transition:.15s}
    .r-field input:focus,.r-field select:focus,.r-field textarea:focus{border-color:var(--violet);background:#fff;box-shadow:0 0 0 3px rgba(124,63,224,.14)}
    .r-field textarea{min-height:80px;resize:vertical}

    .glass-auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
    .glass-auth-card{width:100%;max-width:410px;background:rgba(255,255,255,.78);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.92);border-radius:26px;padding:28px 24px;box-shadow:0 20px 50px rgba(22,17,51,.09)}
    .glass-auth-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .glass-brand{display:flex;align-items:center;gap:11px}
    .glass-brand img{width:40px;height:40px;border-radius:13px;object-fit:cover;box-shadow:0 6px 16px rgba(124,63,224,.18)}
    .glass-auth-card h1{font-family:'Sora',sans-serif;font-size:21px;font-weight:800;margin:0 0 6px;color:var(--ink)}
    .glass-auth-card p.lead{font-size:13px;color:var(--mute);margin:0 0 18px;line-height:1.5}
    .auth-row-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;margin-bottom:14px}
    .link-btn{background:none;border:0;padding:0;font-family:inherit;font-size:12px;font-weight:700;color:var(--violet);cursor:pointer}
    .link-btn:hover{text-decoration:underline}
    .auth-msg-err{color:var(--err);font-size:12px;font-weight:700;margin-bottom:12px}
    .auth-msg-ok{color:#15803D;background:rgba(220,252,231,.8);border:1px solid #BBF7D0;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;margin-bottom:12px}

    @media (max-width:820px){
      .r-grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .r-form-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const redaksiState = {
      user: null,
      profile: null,
      authMode: 'login',
      tab: null,
      articles: [],
      comments: [],
      ads: [],
      profilesList: [],
      logs: [],
      settings: {},
      notice: null
    };

    const ROLE_PERMS = {
      direktur: {
        label: 'Direktur',
        canWrite: true,
        canViewAllArticles: true,
        canEditAnyArticle: true,
        canApprovePublish: true,
        canPullPublished: true,
        canTrashAny: true,
        canRestoreTrash: true,
        canFlagExclusiveBreaking: true,
        canModerateComments: true,
        canSeePhone: true,
        canManageAdsFull: true,
        canSuggestAds: true,
        canManageSettingsFull: true,
        canManageAboutEditorialOnly: true,
        canManageUsersFull: true,
        canInviteJuniorOnly: false,
        canResetPasswordEmail: true,
        canViewStatsFull: true,
        canUseBuilderLevel1: true,
        canViewTechDashboard: true,
        canViewLogs: true
      },
      pemred: {
        label: 'Pemred',
        canWrite: true,
        canViewAllArticles: true,
        canEditAnyArticle: true,
        canApprovePublish: true,
        canPullPublished: true,
        canTrashAny: true,
        canRestoreTrash: true,
        canFlagExclusiveBreaking: true,
        canModerateComments: true,
        canSeePhone: true,
        canManageAdsFull: false,
        canSuggestAds: true,
        canManageSettingsFull: false,
        canManageAboutEditorialOnly: true,
        canManageUsersFull: false,
        canInviteJuniorOnly: true,
        canResetPasswordEmail: false,
        canViewStatsFull: true,
        canUseBuilderLevel1: false,
        canViewTechDashboard: false,
        canViewLogs: true
      },
      redaktur: {
        label: 'Redaktur',
        canWrite: true,
        canViewAllArticles: false,
        canEditAnyArticle: false,
        canApprovePublish: false,
        canPullPublished: false,
        canTrashAny: false,
        canRestoreTrash: false,
        canFlagExclusiveBreaking: false,
        canModerateComments: true,
        canSeePhone: false,
        canManageAdsFull: false,
        canSuggestAds: false,
        canManageSettingsFull: false,
        canManageAboutEditorialOnly: false,
        canManageUsersFull: false,
        canInviteJuniorOnly: false,
        canResetPasswordEmail: false,
        canViewStatsFull: false,
        canUseBuilderLevel1: false,
        canViewTechDashboard: false,
        canViewLogs: false
      },
      editor: {
        label: 'Editor',
        canWrite: true,
        canViewAllArticles: false,
        canEditAnyArticle: false,
        canApprovePublish: false,
        canPullPublished: false,
        canTrashAny: false,
        canRestoreTrash: false,
        canFlagExclusiveBreaking: false,
        canModerateComments: true,
        canSeePhone: false,
        canManageAdsFull: false,
        canSuggestAds: false,
        canManageSettingsFull: false,
        canManageAboutEditorialOnly: false,
        canManageUsersFull: false,
        canInviteJuniorOnly: false,
        canResetPasswordEmail: false,
        canViewStatsFull: false,
        canUseBuilderLevel1: false,
        canViewTechDashboard: false,
        canViewLogs: false
      },
      reporter: {
        label: 'Reporter',
        canWrite: true,
        canViewAllArticles: false,
        canEditAnyArticle: false,
        canApprovePublish: false,
        canPullPublished: false,
        canTrashAny: false,
        canRestoreTrash: false,
        canFlagExclusiveBreaking: false,
        canModerateComments: false,
        canSeePhone: false,
        canManageAdsFull: false,
        canSuggestAds: false,
        canManageSettingsFull: false,
        canManageAboutEditorialOnly: false,
        canManageUsersFull: false,
        canInviteJuniorOnly: false,
        canResetPasswordEmail: false,
        canViewStatsFull: false,
        canUseBuilderLevel1: false,
        canViewTechDashboard: false,
        canViewLogs: false
      },
      kontributor: {
        label: 'Kontributor',
        canWrite: true,
        canViewAllArticles: false,
        canEditAnyArticle: false,
        canApprovePublish: false,
        canPullPublished: false,
        canTrashAny: false,
        canRestoreTrash: false,
        canFlagExclusiveBreaking: false,
        canModerateComments: false,
        canSeePhone: false,
        canManageAdsFull: false,
        canSuggestAds: false,
        canManageSettingsFull: false,
        canManageAboutEditorialOnly: false,
        canManageUsersFull: false,
        canInviteJuniorOnly: false,
        canResetPasswordEmail: false,
        canViewStatsFull: false,
        canUseBuilderLevel1: false,
        canViewTechDashboard: false,
        canViewLogs: false
      },
      admin_it: {
        label: 'Admin IT',
        canWrite: false,
        canViewAllArticles: false,
        canEditAnyArticle: false,
        canApprovePublish: false,
        canPullPublished: false,
        canTrashAny: false,
        canRestoreTrash: false,
        canFlagExclusiveBreaking: false,
        canModerateComments: false,
        canSeePhone: false,
        canManageAdsFull: false,
        canSuggestAds: false,
        canManageSettingsFull: false,
        canManageAboutEditorialOnly: false,
        canManageUsersFull: false,
        canInviteJuniorOnly: false,
        canResetPasswordEmail: true,
        canViewStatsFull: false,
        canUseBuilderLevel1: false,
        canViewTechDashboard: true,
        canViewLogs: true
      }
    };

    function currentRole() {
      const raw = (redaksiState.profile?.role || 'kontributor').toLowerCase().replace(/\s+/g, '_');
      return ROLE_PERMS[raw] ? raw : 'kontributor';
    }

    function perms() {
      return ROLE_PERMS[currentRole()];
    }

    function rEsc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function rFmtDate(d) {
      if (!d) return '-';
      const dt = new Date(d);
      if (Number.isNaN(dt.getTime())) return String(d);
      return dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function setNotice(type, text) {
      redaksiState.notice = { type, text };
      renderRedaksiPage();
    }

    function getClient() {
      try {
        if (typeof getSupabase === 'function') {
          const client = getSupabase();
          if (client) return client;
        }
      } catch (_) {}
      const cfg = window.APP_CONFIG || {};
      if (window.supabase && cfg.SUPABASE_URL && cfg.SUPABASE_PUBLISHABLE_KEY) {
        return window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
      }
      return null;
    }

    async function writeAuditLog(targetType, targetId, action, detail = {}) {
      const sb = getClient();
      if (!sb) return;
      try {
        await sb.from('audit_logs').insert({
          actor_id: redaksiState.user?.id || null,
          actor_name: redaksiState.profile?.full_name || redaksiState.user?.email || 'Sistem',
          actor_role: currentRole(),
          target_type: targetType,
          target_id: targetId ? String(targetId) : null,
          action,
          detail
        });
      } catch (_) {}
    }

    async function loadRedaksiSession() {
      const sb = getClient();
      if (!sb || !sb.auth) {
        redaksiState.user = null;
        redaksiState.profile = null;
        return;
      }
      try {
        const { data } = await sb.auth.getSession();
        redaksiState.user = data?.session?.user || null;
        if (redaksiState.user) {
          const { data: prof } = await sb
            .from('profiles')
            .select('*')
            .eq('id', redaksiState.user.id)
            .maybeSingle();

          if (!prof) {
            const defaultProf = {
              id: redaksiState.user.id,
              full_name: redaksiState.user.user_metadata?.full_name || redaksiState.user.email,
              email: redaksiState.user.email,
              role: 'kontributor',
              is_active: true
            };
            await sb.from('profiles').upsert(defaultProf, { onConflict: 'id' });
            redaksiState.profile = defaultProf;
          } else {
            redaksiState.profile = prof;
          }

          if (redaksiState.profile?.is_active === false) {
            await sb.auth.signOut();
            redaksiState.user = null;
            redaksiState.profile = null;
            setNotice('err', 'Akun kamu sedang dinonaktifkan.');
          }
        } else {
          redaksiState.profile = null;
        }
      } catch (_) {
        redaksiState.user = null;
        redaksiState.profile = null;
      }
    }

    async function loadRedaksiData() {
      const sb = getClient();
      if (!sb) return;
      const p = perms();
      try {
        const [artRes, comRes, adRes, setRes, profRes, logRes] = await Promise.all([
          sb.from('articles').select('*').order('created_at', { ascending: false }),
          p.canModerateComments ? sb.from('comments').select('*').order('created_at', { ascending: false }) : Promise.resolve({ data: [] }),
          (p.canManageAdsFull || p.canSuggestAds) ? sb.from('ads').select('*').order('created_at', { ascending: false }) : Promise.resolve({ data: [] }),
          (p.canManageSettingsFull || p.canManageAboutEditorialOnly || p.canUseBuilderLevel1) ? sb.from('site_settings').select('*') : Promise.resolve({ data: [] }),
          (p.canManageUsersFull || p.canInviteJuniorOnly) ? sb.from('profiles').select('*') : Promise.resolve({ data: [] }),
          p.canViewLogs ? sb.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(50) : Promise.resolve({ data: [] })
        ]);

        redaksiState.articles = artRes.data || [];
        redaksiState.comments = comRes.data || [];
        redaksiState.ads = adRes.data || [];
        redaksiState.profilesList = profRes.data || [];
        redaksiState.logs = logRes.data || [];

        const settingsMap = {};
        (setRes.data || []).forEach(row => {
          settingsMap[row.key] = row.value;
        });
        redaksiState.settings = settingsMap;
      } catch (err) {
        setNotice('err', 'Gagal memuat data: ' + (err?.message || err));
      }
    }

    async function handleRedaksiLogin(ev) {
      ev.preventDefault();
      const email = document.getElementById('rEmail').value.trim();
      const password = document.getElementById('rPassword').value;
      const errEl = document.getElementById('rAuthErr');
      if (errEl) errEl.textContent = '';

      const sb = getClient();
      if (!sb) {
        if (errEl) errEl.textContent = 'Koneksi Supabase belum siap. Periksa config.js.';
        return;
      }

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        if (errEl) errEl.textContent = 'Gagal masuk: ' + error.message;
        return;
      }
      redaksiState.authMode = 'login';
      redaksiState.tab = null;
      await loadRedaksiSession();
      await loadRedaksiData();
      renderRedaksiPage();
    }

    async function handleForgotPassword(ev) {
      ev.preventDefault();
      const email = document.getElementById('rResetEmail').value.trim();
      const errEl = document.getElementById('rAuthErr');
      const okEl = document.getElementById('rAuthOk');
      if (errEl) errEl.textContent = '';
      if (okEl) { okEl.style.display = 'none'; okEl.textContent = ''; }

      const sb = getClient();
      if (!sb) {
        if (errEl) errEl.textContent = 'Koneksi Supabase belum siap. Periksa config.js.';
        return;
      }

      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/redaksi.html'
      });

      if (error) {
        if (errEl) errEl.textContent = 'Gagal mengirim tautan reset: ' + error.message;
        return;
      }

      if (okEl) {
        okEl.style.display = 'block';
        okEl.textContent = 'Tautan reset kata sandi telah dikirim ke ' + email + '.';
      }
    }

    async function handleUpdateRecoveredPassword(ev) {
      ev.preventDefault();
      const newPassword = document.getElementById('rNewPassword').value;
      const confirmPassword = document.getElementById('rConfirmPassword').value;
      const errEl = document.getElementById('rAuthErr');
      if (errEl) errEl.textContent = '';

      if (newPassword.length < 6) {
        if (errEl) errEl.textContent = 'Kata sandi baru minimal 6 karakter.';
        return;
      }
      if (newPassword !== confirmPassword) {
        if (errEl) errEl.textContent = 'Konfirmasi kata sandi belum sama.';
        return;
      }

      const sb = getClient();
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if (error) {
        if (errEl) errEl.textContent = 'Gagal memperbarui kata sandi: ' + error.message;
        return;
      }

      redaksiState.authMode = 'login';
      await loadRedaksiSession();
      await loadRedaksiData();
      renderRedaksiPage();
    }

    async function handleRedaksiLogout() {
      const sb = getClient();
      if (sb) await sb.auth.signOut();
      redaksiState.user = null;
      redaksiState.profile = null;
      redaksiState.authMode = 'login';
      redaksiState.tab = null;
      renderRedaksiPage();
    }

    function getVisibleArticles() {
      const p = perms();
      const role = currentRole();
      const uid = redaksiState.user?.id;
      const uEmail = (redaksiState.user?.email || '').toLowerCase();
      const uName = (redaksiState.profile?.full_name || '').toLowerCase();
      const uDesk = (redaksiState.profile?.desk || '').toLowerCase();

      return redaksiState.articles.filter(a => {
        if (p.canViewAllArticles) return true;
        const isOwn = (uid && a.author_id === uid)
          || (uName && (a.author_name || '').toLowerCase() === uName)
          || (uEmail && (a.author_email || '').toLowerCase() === uEmail);

        if (role === 'reporter' || role === 'kontributor') return isOwn && !a.deleted_at;
        if (role === 'redaktur') {
          const sameDesk = uDesk && ((a.desk || '').toLowerCase() === uDesk || (a.category || '').toLowerCase() === uDesk);
          return (isOwn || sameDesk) && !a.deleted_at;
        }
        if (role === 'editor') {
          const assigned = uid && (a.assigned_to === uid || (a.assigned_to || '').toLowerCase() === uEmail || (a.assigned_to || '').toLowerCase() === uName);
          return (isOwn || assigned) && !a.deleted_at;
        }
        return false;
      });
    }

    async function handleArticleAction(id, actionType, nextStatus) {
      const sb = getClient();
      if (!sb) return setNotice('err', 'Koneksi Supabase tidak tersedia.');
      const p = perms();
      const role = currentRole();
      const art = redaksiState.articles.find(x => String(x.id) === String(id));
      if (!art) return setNotice('err', 'Artikel tidak ditemukan.');

      const uid = redaksiState.user?.id;
      const isOwn = (uid && art.author_id === uid)
        || ((art.author_name || '').toLowerCase() === (redaksiState.profile?.full_name || '').toLowerCase());
      const curStatus = (art.status || 'draft').toLowerCase();

      if (actionType === 'status') {
        if (nextStatus === 'terbit' || nextStatus === 'published') {
          if (!p.canApprovePublish) return setNotice('err', 'Peran kamu tidak memiliki izin menerbitkan naskah.');
          if (art.is_exclusive && !String(art.right_of_reply || '').trim()) {
            return setNotice('err', 'Naskah EKSKLUSIF wajib memiliki Hak Jawab sebelum dapat diterbitkan.');
          }
          const { error } = await sb.from('articles').update({
            status: nextStatus,
            deleted_at: null,
            published_at: new Date().toISOString()
          }).eq('id', id);
          if (error) return setNotice('err', 'Gagal menerbitkan: ' + error.message);
          await writeAuditLog('article', id, 'publish_article', { from: curStatus, to: nextStatus, title: art.title });
          await loadRedaksiData();
          return setNotice('ok', 'Naskah diterbitkan.');
        }

        if (curStatus === 'terbit' && !p.canPullPublished) {
          return setNotice('err', 'Peran kamu tidak boleh menarik berita yang sudah terbit.');
        }

        if (!p.canEditAnyArticle && !isOwn) {
          return setNotice('err', 'Kamu tidak memiliki izin mengubah status naskah orang lain.');
        }

        const { error } = await sb.from('articles').update({ status: nextStatus }).eq('id', id);
        if (error) return setNotice('err', 'Gagal mengubah status: ' + error.message);
        await writeAuditLog('article', id, 'change_status', { from: curStatus, to: nextStatus, title: art.title });
        await loadRedaksiData();
        return setNotice('ok', 'Status naskah diubah menjadi "' + nextStatus + '".');
      }

      if (actionType === 'trash') {
        const canTrash = p.canTrashAny || ((role === 'reporter' || role === 'kontributor') && isOwn && curStatus === 'draft');
        if (!canTrash) {
          return setNotice('err', 'Kamu tidak memiliki izin membuang naskah ini ke Trash.');
        }
        const { error } = await sb.from('articles').update({ deleted_at: new Date().toISOString() }).eq('id', id);
        if (error) return setNotice('err', 'Gagal memindahkan ke Trash: ' + error.message);
        await writeAuditLog('article', id, 'move_to_trash', { title: art.title });
        await loadRedaksiData();
        return setNotice('ok', 'Naskah dipindahkan ke Trash.');
      }

      if (actionType === 'restore') {
        if (!p.canRestoreTrash) return setNotice('err', 'Peran kamu tidak boleh memulihkan naskah dari Trash.');
        const { error } = await sb.from('articles').update({ deleted_at: null }).eq('id', id);
        if (error) return setNotice('err', 'Gagal memulihkan dari Trash: ' + error.message);
        await writeAuditLog('article', id, 'restore_from_trash', { title: art.title });
        await loadRedaksiData();
        return setNotice('ok', 'Naskah dipulihkan dari Trash.');
      }

      if (actionType === 'toggle_exclusive' || actionType === 'toggle_breaking') {
        if (!p.canFlagExclusiveBreaking) {
          return setNotice('err', 'Hanya Direktur dan Pemred yang dapat mengatur label EKSKLUSIF / BREAKING.');
        }
        if (actionType === 'toggle_exclusive') {
          const nextVal = !Boolean(art.is_exclusive);
          if (nextVal && curStatus === 'terbit' && !String(art.right_of_reply || '').trim()) {
            return setNotice('err', 'Artikel terbit berlabel EKSKLUSIF wajib memiliki Hak Jawab.');
          }
          const { error } = await sb.from('articles').update({ is_exclusive: nextVal }).eq('id', id);
          if (error) return setNotice('err', 'Gagal mengubah label EKSKLUSIF: ' + error.message);
          await writeAuditLog('article', id, 'toggle_exclusive', { is_exclusive: nextVal, title: art.title });
          await loadRedaksiData();
          return setNotice('ok', 'Label EKSKLUSIF diperbarui.');
        } else {
          const nextVal = !Boolean(art.is_breaking);
          const { error } = await sb.from('articles').update({ is_breaking: nextVal }).eq('id', id);
          if (error) return setNotice('err', 'Gagal mengubah label BREAKING: ' + error.message);
          await writeAuditLog('article', id, 'toggle_breaking', { is_breaking: nextVal, title: art.title });
          await loadRedaksiData();
          return setNotice('ok', 'Label BREAKING diperbarui.');
        }
      }

      if (actionType === 'save_right_of_reply') {
        if (!p.canFlagExclusiveBreaking) {
          return setNotice('err', 'Hanya Direktur dan Pemred yang dapat mengisi Hak Jawab.');
        }
        const inputEl = document.getElementById('ror-' + id);
        const val = inputEl ? inputEl.value.trim() : '';
        const { error } = await sb.from('articles').update({ right_of_reply: val || null }).eq('id', id);
        if (error) return setNotice('err', 'Gagal menyimpan Hak Jawab: ' + error.message);
        await writeAuditLog('article', id, 'update_right_of_reply', { has_reply: Boolean(val), title: art.title });
        await loadRedaksiData();
        return setNotice('ok', 'Hak Jawab disimpan.');
      }
    }

    async function handleAddMember(ev) {
      ev.preventDefault();
      const p = perms();
      if (!p.canManageUsersFull && !p.canInviteJuniorOnly) {
        return setNotice('err', 'Peran kamu tidak memiliki izin menambahkan pengguna.');
      }

      const sb = getClient();
      if (!sb) return setNotice('err', 'Koneksi Supabase tidak tersedia.');

      const fullName = document.getElementById('mFullName').value.trim();
      const email = document.getElementById('mEmail').value.trim();
      const role = document.getElementById('mRole').value;
      const desk = document.getElementById('mDesk').value.trim();
      const password = document.getElementById('mPassword').value;
      const createAuthNow = document.getElementById('mCreateAuth').checked;

      if (!p.canManageUsersFull && p.canInviteJuniorOnly) {
        if (!['reporter', 'kontributor'].includes(role)) {
          return setNotice('err', 'Pemred hanya dapat mengundang Reporter dan Kontributor.');
        }
      }

      if (createAuthNow) {
        if (!password || password.length < 6) {
          return setNotice('err', 'Kata sandi awal minimal 6 karakter.');
        }
        const { data: signUpData, error: signUpErr } = await sb.auth.signUp({
          email,
          password,
          options: { data: { full_name: fullName, role, desk: desk || null } }
        });
        if (signUpErr) return setNotice('err', 'Gagal mendaftarkan akun: ' + signUpErr.message);

        const newUserId = signUpData?.user?.id;
        if (newUserId) {
          await sb.from('profiles').upsert({
            id: newUserId,
            full_name: fullName,
            email,
            role,
            desk: desk || null,
            is_active: true
          }, { onConflict: 'id' });
        }
        await writeAuditLog('profile', newUserId || email, 'invite_user_auth', { fullName, email, role, desk });
        await loadRedaksiSession();
        await loadRedaksiData();
        ev.target.reset();
        return setNotice('ok', `Akun ${fullName} (${role}) didaftarkan. Jika sesi berganti, silakan masuk ulang dengan akun kamu.`);
      }

      const { error: insErr } = await sb.from('profiles').insert({
        full_name: fullName,
        email,
        role,
        desk: desk || null,
        is_active: true
      });
      if (insErr) return setNotice('err', 'Gagal menyimpan anggota: ' + insErr.message);

      await writeAuditLog('profile', email, 'add_member_profile', { fullName, email, role, desk });
      await loadRedaksiData();
      ev.target.reset();
      setNotice('ok', `Anggota "${fullName}" dengan jabatan "${role}" ditambahkan.`);
    }

    async function handleProfileChange(profileId, actionType, newRole) {
      const p = perms();
      const sb = getClient();
      if (!sb) return;
      const target = redaksiState.profilesList.find(x => String(x.id) === String(profileId));
      const targetRole = (target?.role || '').toLowerCase();

      if (!p.canManageUsersFull) {
        return setNotice('err', 'Hanya Direktur yang dapat mengubah jabatan, menonaktifkan, atau menghapus pengguna.');
      }

      if (actionType === 'role') {
        const oldRole = targetRole;
        const { error } = await sb.from('profiles').update({ role: newRole }).eq('id', profileId);
        if (error) return setNotice('err', 'Gagal mengubah jabatan: ' + error.message);
        await writeAuditLog('profile', profileId, 'change_role', { from: oldRole, to: newRole, target_name: target?.full_name });
        await loadRedaksiData();
        return setNotice('ok', 'Jabatan diperbarui menjadi "' + newRole + '".');
      }

      if (actionType === 'toggle_active') {
        const nextActive = target?.is_active === false ? true : false;
        const { error } = await sb.from('profiles').update({ is_active: nextActive }).eq('id', profileId);
        if (error) return setNotice('err', 'Gagal mengubah status aktif: ' + error.message);
        await writeAuditLog('profile', profileId, nextActive ? 'activate_user' : 'deactivate_user', { target_name: target?.full_name });
        await loadRedaksiData();
        return setNotice('ok', nextActive ? 'Akun diaktifkan.' : 'Akun dinonaktifkan.');
      }

      if (actionType === 'reset_email') {
        const email = target?.email;
        if (!email) return setNotice('err', 'Email pengguna tidak tersedia untuk reset kata sandi.');
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/redaksi.html'
        });
        if (error) return setNotice('err', 'Gagal mengirim email reset: ' + error.message);
        await writeAuditLog('profile', profileId, 'send_password_reset_email', { email });
        return setNotice('ok', 'Tautan reset kata sandi dikirim ke email ' + email + '.');
      }

      if (actionType === 'delete') {
        if (targetRole === 'direktur') {
          const activeDirectors = redaksiState.profilesList.filter(
            x => (x.role || '').toLowerCase() === 'direktur' && x.is_active !== false
          );
          if (activeDirectors.length <= 1) {
            return setNotice('err', 'Tidak boleh menghapus Direktur terakhir yang tersisa.');
          }
        }
        if (!confirm('Hapus pengguna ini dari daftar profil?')) return;
        const { error } = await sb.from('profiles').delete().eq('id', profileId);
        if (error) return setNotice('err', 'Gagal menghapus pengguna: ' + error.message);
        await writeAuditLog('profile', profileId, 'delete_profile', { target_name: target?.full_name, role: targetRole });
        await loadRedaksiData();
        return setNotice('ok', 'Pengguna dihapus.');
      }
    }

          || ((a.author_name || '').toLowerCase() === (redaksiState.profile?.full_name || '').toLowerCase());

            actionBtns.push(`<button type="button" class="btn-xs" data-art-act="toggle_breaking" data-art-id="${idAttr}">${a.is_breaking ? 'Lepas Breaking' : 'Label Breaking'}</button>`);

    function bindRedaksiActions() {
      const root = document.getElementById('root');
      if (!root) return;

      root.querySelectorAll('[data-art-act]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const act = btn.getAttribute('data-art-act');
          const id = btn.getAttribute('data-art-id');
          const nextStatus = btn.getAttribute('data-art-status');
          if (id && act) await handleArticleAction(id, act, nextStatus);
        });
      });

      root.querySelectorAll('[data-prof-role]').forEach(sel => {
        sel.addEventListener('change', async () => {
          const pid = sel.getAttribute('data-prof-role');
          if (pid) await handleProfileChange(pid, 'role', sel.value);
        });
      });

      root.querySelectorAll('[data-prof-act]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const pid = btn.getAttribute('data-prof-id');
          const act = btn.getAttribute('data-prof-act');
          if (pid && act) await handleProfileChange(pid, act);
        });
      });

      root.querySelectorAll('[data-com-act]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const cid = btn.getAttribute('data-com-id');
          const st = btn.getAttribute('data-com-act');
          if (cid && st) await setCommentStatus(cid, st);
        });
      });

      root.querySelectorAll('[data-ad-act]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const aid = btn.getAttribute('data-ad-id');
          const act = btn.getAttribute('data-ad-act');
          const active = btn.getAttribute('data-ad-active') === 'true';
          if (aid && act) await handleAdAction(aid, act, active);
        });
      });
    }

    function renderRedaksiPage() {
      if (!redaksiState.user || redaksiState.authMode === 'recovery') {
        renderLoginView();
        return;
      }

      const p = perms();
      const role = currentRole();
      const allowedTabs = getAllowedTabs();
      if (!redaksiState.tab || !allowedTabs.some(t => t.id === redaksiState.tab)) {
        redaksiState.tab = allowedTabs[0]?.id || 'artikel';
      }

      const visibleArts = getVisibleArticles();
      const totalArt = visibleArts.filter(a => !a.deleted_at).length;
      const terbitArt = visibleArts.filter(a => !a.deleted_at && (a.status || '').toLowerCase() === 'terbit').length;
      const draftArt = visibleArts.filter(a => !a.deleted_at && (a.status || '').toLowerCase() !== 'terbit').length;
      const trashArt = visibleArts.filter(a => Boolean(a.deleted_at)).length;

      const noticeHtml = redaksiState.notice
        ? `<div class="r-notice ${redaksiState.notice.type === 'err' ? 'err' : 'ok'}">${rEsc(redaksiState.notice.text)}</div>`
        : '';

      let tabContent = '';
      if (redaksiState.tab === 'artikel') tabContent = renderArticlesTab();
      else if (redaksiState.tab === 'akses') tabContent = renderAccessTab();
      else if (redaksiState.tab === 'komentar') tabContent = renderCommentsTab();
      else if (redaksiState.tab === 'iklan') tabContent = renderAdsTab();
      else if (redaksiState.tab === 'pengaturan') tabContent = renderSettingsTab();
      else if (redaksiState.tab === 'builder') tabContent = renderBuilderTab();
      else if (redaksiState.tab === 'teknis') tabContent = renderTechTab();
      else if (redaksiState.tab === 'reset_it') tabContent = renderResetItTab();
      else if (redaksiState.tab === 'log') tabContent = renderLogsTab();

      const writeBtnHtml = p.canWrite ? `<a class="go sm" href="tulis.html">+ Tulis Naskah</a>` : '';

      document.getElementById('root').innerHTML = `
        <div class="r-wrap">
          <div class="r-top">
            <div class="r-brand">
              <img src="favicon.png" alt="Langkatalk">
              <div>
                <h1>Ruang Redaksi</h1>
                <div class="sub">${rEsc(redaksiState.profile?.full_name || redaksiState.user.email)} • Jabatan: <b>${rEsc(role)}</b></div>
              </div>
            </div>
            <div class="r-actions">
              <a class="pill" href="index.html">Beranda</a>
              ${writeBtnHtml}
              <button type="button" class="btn-grad-dark" onclick="handleRedaksiLogout()">Keluar</button>
            </div>
          </div>

          <div class="r-grid4">
            <div class="r-stat"><div class="k">Naskah Aktif</div><div class="v">${totalArt}</div></div>
            <div class="r-stat"><div class="k">Terbit</div><div class="v">${terbitArt}</div></div>
            <div class="r-stat"><div class="k">Draf / Proses</div><div class="v">${draftArt}</div></div>
            <div class="r-stat"><div class="k">Di Trash</div><div class="v">${trashArt}</div></div>
          </div>

          <div class="r-tabs">
            ${allowedTabs.map(t => `
              <button type="button" class="r-tab ${redaksiState.tab === t.id ? 'on' : ''}" onclick="redaksiState.notice=null;redaksiState.tab='${t.id}';renderRedaksiPage()">${rEsc(t.label)}</button>
            `).join('')}
          </div>

          ${noticeHtml}
          ${tabContent}
        </div>
      `;

      bindRedaksiActions();
    }

    (async function initRedaksi() {
      try {
        const sb = getClient();
        if (sb && sb.auth && sb.auth.onAuthStateChange) {
          sb.auth.onAuthStateChange(async (event) => {
            if (event === 'PASSWORD_RECOVERY') {
              redaksiState.authMode = 'recovery';
              renderRedaksiPage();
            }
          });
        }

        if (window.location.hash && window.location.hash.includes('type=recovery')) {
          redaksiState.authMode = 'recovery';
        }

        renderRedaksiPage();
        await loadRedaksiSession();
        if (redaksiState.user && redaksiState.authMode !== 'recovery') {
          await loadRedaksiData();
        }
        renderRedaksiPage();
      } catch (err) {
        document.getElementById('root').innerHTML = `<div class="r-wrap"><div class="r-card"><h2>Error</h2><p>${rEsc(err?.message || err)}</p></div></div>`;
      }
    })();
  </script>
</body>
</html>
